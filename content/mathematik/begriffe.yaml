# Fachbegriffe Klasse 5 mit Erklärung in einfacher Sprache (LEHRPLAN L-7, INHALTSFORMAT §11.1).
# Entwurf: noch nicht geprüft (INHALTSFORMAT §8).
#
# formen: genau so geschrieben, wie der Begriff in Texten vorkommt (Groß-/Kleinschreibung
# zählt). In Vorlagentexten wird das erste Vorkommen je Text als [[Form]] markiert;
# pnpm test prüft das.
begriffe:
  # Zahlen und Rechnen
  - id: ziffer
    wort: { de: Ziffer }
    formen: [Ziffer, Ziffern]
    erklaerung:
      de: 'Eines der zehn Zeichen 0, 1, 2 … 9. Aus Ziffern schreibt man Zahlen: Die Zahl 305 hat die Ziffern 3, 0 und 5.'
  - id: stellenwerttafel
    wort: { de: Stellenwerttafel }
    formen: [Stellenwerttafel]
    erklaerung:
      de: Eine Tabelle mit Spalten für Einer, Zehner, Hunderter, Tausender … In jede Spalte kommt genau eine Ziffer.
  - id: natuerliche-zahl
    wort: { de: natürliche Zahl }
    formen: [natürliche Zahl, natürlichen Zahlen]
    erklaerung:
      de: 'Die Zahlen zum Zählen: 0, 1, 2, 3 … – ohne Komma und ohne Bruch.'
  - id: gebrochene-zahl
    wort: { de: gebrochene Zahl }
    formen: [gebrochene Zahl, gebrochenen Zahlen, gebrochene Zahlen]
    erklaerung:
      de: 'Jede Zahl, die man als Bruch schreiben kann – zum Beispiel 3/4, 0,5 oder auch 3 = 3/1.'
  - id: element
    wort: { de: Element }
    formen: [Element]
    erklaerung:
      de: 'Ein Ding, das zu einer Menge gehört. 7 ist ein Element der natürlichen Zahlen.'
  - id: teilmenge
    wort: { de: Teilmenge }
    formen: [Teilmenge]
    erklaerung:
      de: 'Eine Menge, die ganz in einer anderen steckt. Die geraden Zahlen sind eine Teilmenge der natürlichen Zahlen.'
  - id: zuordnung
    wort: { de: Zuordnung }
    formen: [Zuordnung, Zuordnungen]
    erklaerung:
      de: 'Eine Vorschrift, die Dingen etwas anderes zuordnet, zum Beispiel jeder Anzahl Hefte ihren Preis.'
  - id: proportional
    wort: { de: proportional }
    formen: [proportional, proportionalen]
    erklaerung:
      de: 'Doppelt so viel ergibt doppelt so viel, dreimal so viel ergibt dreimal so viel. Alle Quotienten y : x sind gleich.'
  - id: umgekehrt-proportional
    wort: { de: umgekehrt proportional }
    formen: [umgekehrt proportional, umgekehrt proportionalen]
    erklaerung:
      de: 'Doppelt so viel ergibt halb so viel. Alle Produkte x · y sind gleich.'
  - id: graph
    wort: { de: Graph }
    formen: [Graphen, Graph]
    erklaerung:
      de: 'Die Linie oder Kurve, die eine Zuordnung im Koordinatensystem zeigt.'
  - id: quotient
    wort: { de: Quotient }
    formen: [Quotienten]
    erklaerung:
      de: 'Das Ergebnis einer Geteiltaufgabe. Bei 12 : 3 = 4 ist 4 der Quotient.'
  - id: relative-haeufigkeit
    wort: { de: relative Häufigkeit }
    formen: [relative Häufigkeit, relativen Häufigkeit]
    erklaerung:
      de: 'Wie oft etwas vorkam, geteilt durch alle Versuche. 5-mal die 6 bei 20 Würfen: 5/20 = 25 %.'
  - id: absolute-haeufigkeit
    wort: { de: absolute Häufigkeit }
    formen: [absolute Häufigkeit]
    erklaerung:
      de: 'Wie oft ein Ergebnis vorkam, zum Beispiel 5-mal die 6.'
  - id: strichliste
    wort: { de: Strichliste }
    formen: [Strichliste]
    erklaerung:
      de: 'Für jedes Ergebnis ein Strich. Jeder fünfte Strich geht quer über die vier davor – das ist ein Fünferbündel.'
  - id: kreisdiagramm
    wort: { de: Kreisdiagramm }
    formen: [Kreisdiagramm]
    erklaerung:
      de: 'Ein Kreis, der in Teile geteilt ist. Jeder Teil zeigt einen Anteil am Ganzen.'
  - id: mittelpunktswinkel
    wort: { de: Mittelpunktswinkel }
    formen: [Mittelpunktswinkel]
    erklaerung:
      de: 'Der Winkel eines Kreisteils am Mittelpunkt des Kreises. Der ganze Kreis hat 360°.'
  - id: summe
    wort: { de: Summe }
    formen: [Summe]
    erklaerung:
      de: 'Das Ergebnis einer Plusaufgabe. Bei 3 + 4 = 7 ist 7 die Summe.'
  - id: produkt
    wort: { de: Produkt }
    formen: [Produkt]
    erklaerung:
      de: 'Das Ergebnis einer Malaufgabe. Bei 3 · 4 = 12 ist 12 das Produkt.'
  - id: teilprodukt
    wort: { de: Teilprodukt }
    formen: [Teilprodukt, Teilprodukte]
    erklaerung:
      de: Beim schriftlichen Multiplizieren das Ergebnis mit einer einzelnen Ziffer der zweiten Zahl. Am Ende werden alle Teilprodukte addiert.
  - id: faktor
    wort: { de: Faktor }
    formen: [Faktor, Faktoren]
    erklaerung:
      de: 'Eine Zahl, die mit einer anderen multipliziert wird. Bei 3 · 4 sind 3 und 4 die Faktoren.'
  - id: uebertrag
    wort: { de: Übertrag }
    formen: [Übertrag]
    erklaerung:
      de: Beim schriftlichen Rechnen der Zehner, der in die nächste Spalte links wandert, wenn eine Spalte 10 oder mehr ergibt.
  - id: stellengerecht
    wort: { de: stellengerecht }
    formen: [stellengerecht]
    erklaerung:
      de: 'So untereinander geschrieben, dass gleiche Stellen genau untereinander stehen: Einer unter Einer, Zehner unter Zehner.'
  - id: entbuendeln
    wort: { de: entbündeln }
    formen: [entbündle, entbündelst, entbündelt]
    erklaerung:
      de: 'Einen Zehner in zehn Einer umtauschen (oder einen Hunderter in zehn Zehner). So hat die Stelle genug zum Abziehen.'
  - id: rundungsstelle
    wort: { de: Rundungsstelle }
    formen: [Rundungsstelle]
    erklaerung:
      de: Die Stelle, auf die gerundet wird, zum Beispiel die Hunderter.
  - id: ueberschlag
    wort: { de: Überschlag }
    formen: [Überschlag, Überschlage]
    erklaerung:
      de: Eine schnelle Rechnung mit gerundeten Zahlen. Sie zeigt, wie groß das Ergebnis ungefähr sein muss.
  - id: hochzahl
    wort: { de: Hochzahl }
    formen: [Hochzahl]
    erklaerung:
      de: 'Die kleine Zahl oben rechts. Sie sagt, wie oft die Zahl mit sich selbst malgenommen wird: 10³ = 10 · 10 · 10.'
  - id: wurzel
    wort: { de: Wurzel }
    formen: [Wurzel]
    erklaerung:
      de: 'Die Wurzel aus 49 ist die Zahl, die mit sich selbst malgenommen 49 ergibt: 7, denn 7 · 7 = 49.'
  - id: punkt-vor-strich
    wort: { de: Punkt vor Strich }
    formen: [Punkt vor Strich]
    erklaerung:
      de: 'Rechenregel: Mal und Geteilt (Punktrechnung) werden vor Plus und Minus (Strichrechnung) gerechnet.'
  - id: umkehraufgabe
    wort: { de: Umkehraufgabe }
    formen: [Umkehraufgabe]
    erklaerung:
      de: 'Die Aufgabe, die eine Rechnung rückgängig macht. Zu 3 + 4 = 7 gehört 7 − 4 = 3.'
  - id: probe
    wort: { de: Probe }
    formen: [Probe]
    erklaerung:
      de: Eine Kontrolle. Du setzt dein Ergebnis ein oder rechnest rückwärts und prüfst, ob es stimmt.
  - id: gleichung
    wort: { de: Gleichung }
    formen: [Gleichung]
    erklaerung:
      de: 'Zwei Rechenausdrücke mit einem Gleichheitszeichen dazwischen, zum Beispiel x + 3 = 7.'

  # Teilbarkeit
  - id: teiler
    wort: { de: Teiler }
    formen: [Teiler]
    erklaerung:
      de: 'Eine Zahl, durch die man ohne Rest teilen kann. 3 ist ein Teiler von 12, denn 12 : 3 = 4.'
  - id: gemeinsamer-teiler
    wort: { de: gemeinsamer Teiler }
    formen: [gemeinsamen Teiler]
    erklaerung:
      de: 'Eine Zahl, die Teiler von beiden Zahlen ist. 4 ist ein gemeinsamer Teiler von 8 und 12.'
  - id: vielfaches
    wort: { de: Vielfaches }
    formen: [Vielfaches, Vielfache, Vielfachen]
    erklaerung:
      de: 'Das Ergebnis, wenn man eine Zahl mit 1, 2, 3 … malnimmt. Vielfache von 4 sind 4, 8, 12, 16 …'
  - id: teilbar
    wort: { de: teilbar }
    formen: [teilbar]
    erklaerung:
      de: '12 ist durch 3 teilbar, weil beim Teilen kein Rest bleibt: 12 : 3 = 4.'
  - id: teilbarkeitsregel
    wort: { de: Teilbarkeitsregel }
    formen: [Teilbarkeitsregel]
    erklaerung:
      de: 'Ein Trick, mit dem du ohne Teilen erkennst, ob eine Zahl teilbar ist. Beispiel: Endet sie auf 0 oder 5, ist sie durch 5 teilbar.'
  - id: quersumme
    wort: { de: Quersumme }
    formen: [Quersumme]
    erklaerung:
      de: 'Alle Ziffern einer Zahl zusammengezählt. Die Quersumme von 4 716 ist 4 + 7 + 1 + 6 = 18.'
  - id: primzahl
    wort: { de: Primzahl }
    formen: [Primzahl, Primzahlen]
    erklaerung:
      de: 'Eine Zahl mit genau zwei Teilern: 1 und sich selbst. Zum Beispiel 2, 3, 5, 7, 11.'
  - id: primfaktor
    wort: { de: Primfaktor }
    formen: [Primfaktoren]
    erklaerung:
      de: 'Ein Faktor, der eine Primzahl ist. 12 = 2 · 2 · 3 – die Primfaktoren sind 2, 2 und 3.'

  # Brüche, Dezimalzahlen, Prozent
  - id: bruch
    wort: { de: Bruch }
    formen: [Bruch, Brüche]
    erklaerung:
      de: 'Eine Zahl wie 3/4. Sie beschreibt einen Anteil: 3 von 4 gleich großen Teilen.'
  - id: anteil
    wort: { de: Anteil }
    formen: [Anteil]
    erklaerung:
      de: 'Ein Teil von einem Ganzen, zum Beispiel 3/4 einer Pizza.'
  - id: zaehler
    wort: { de: Zähler }
    formen: [Zähler]
    erklaerung:
      de: Die Zahl über dem Bruchstrich. Sie sagt, wie viele Teile gemeint sind.
  - id: nenner
    wort: { de: Nenner }
    formen: [Nenner]
    erklaerung:
      de: Die Zahl unter dem Bruchstrich. Sie sagt, in wie viele gleich große Teile das Ganze geteilt ist.
  - id: erweitern
    wort: { de: erweitern }
    formen: [Erweitere, Erweitern, erweitern]
    erklaerung:
      de: 'Zähler und Nenner mit derselben Zahl malnehmen. Der Wert bleibt gleich: 1/2 = 2/4.'
  - id: kuerzen
    wort: { de: kürzen }
    formen: [Kürze, kürze, Kürzen, kürzen, gekürzt, gekürzten]
    erklaerung:
      de: 'Zähler und Nenner durch dieselbe Zahl teilen. Der Wert bleibt gleich: 6/8 = 3/4.'
  - id: kehrwert
    wort: { de: Kehrwert }
    formen: [Kehrwert]
    erklaerung:
      de: 'Der Bruch mit vertauschtem Zähler und Nenner. Der Kehrwert von 3/4 ist 4/3, der von 5 ist 1/5.'
  - id: gemeinsamer-nenner
    wort: { de: gemeinsamer Nenner }
    formen: [gemeinsamen Nenner, gemeinsamer Nenner]
    erklaerung:
      de: 'Ein Nenner, auf den man beide Brüche erweitern kann. Für 1/4 und 1/6 ist 12 der kleinste gemeinsame Nenner.'
  - id: periodisch
    wort: { de: periodisch }
    formen: [periodisch]
    erklaerung:
      de: 'Eine Dezimalzahl ist periodisch, wenn sich Ziffern hinter dem Komma unendlich oft wiederholen: 1/3 = 0,333…'
  - id: periodenstrich
    wort: { de: Periodenstrich }
    formen: [Periodenstrich]
    erklaerung:
      de: 'Der Strich über den Ziffern, die sich wiederholen. 0,16̅ heißt 0,1666…'
  - id: dezimalzahl
    wort: { de: Dezimalzahl }
    formen: [Dezimalzahl, Dezimalzahlen]
    erklaerung:
      de: 'Eine Zahl mit Komma, zum Beispiel 3,25. Hinter dem Komma stehen Zehntel, Hundertstel, Tausendstel.'
  - id: nachkommastelle
    wort: { de: Nachkommastelle }
    formen: [Nachkommastelle, Nachkommastellen]
    erklaerung:
      de: 'Eine Stelle hinter dem Komma. 3,25 hat zwei Nachkommastellen.'
  - id: zehntel
    wort: { de: Zehntel }
    formen: [Zehntel]
    erklaerung:
      de: 'Ein Zehntel ist 1/10 = 0,1. Es steht an der ersten Stelle hinter dem Komma.'
  - id: hundertstel
    wort: { de: Hundertstel }
    formen: [Hundertstel]
    erklaerung:
      de: 'Ein Hundertstel ist 1/100 = 0,01. Es steht an der zweiten Stelle hinter dem Komma.'
  - id: tausendstel
    wort: { de: Tausendstel }
    formen: [Tausendstel]
    erklaerung:
      de: 'Ein Tausendstel ist 1/1000 = 0,001. Es steht an der dritten Stelle hinter dem Komma.'
  - id: prozent
    wort: { de: Prozent }
    formen: [Prozent]
    erklaerung:
      de: 'Prozent heißt „von Hundert“. 25 % sind 25 Hundertstel, also 25/100.'
  - id: durchschnitt
    wort: { de: Durchschnitt }
    formen: [arithmetische Mittel, Notendurchschnitt, Durchschnitt]
    erklaerung:
      de: 'Auch „arithmetisches Mittel“: Alle Werte addieren und durch ihre Anzahl teilen. Von 2, 3 und 7 ist der Durchschnitt 12 : 3 = 4.'

  # Größen
  - id: umrechnungszahl
    wort: { de: Umrechnungszahl }
    formen: [Umrechnungszahl, Umrechnungszahlen]
    erklaerung:
      de: 'Die Zahl, mit der man zwischen zwei benachbarten Einheiten umrechnet. Zwischen m und dm ist sie 10, zwischen m² und dm² ist sie 100.'
  - id: kommaschreibweise
    wort: { de: Kommaschreibweise }
    formen: [Kommaschreibweise]
    erklaerung:
      de: 'Eine Größe mit Komma statt mit zwei Einheiten: 3,07 m statt 3 m 7 cm.'
  - id: flaecheneinheit
    wort: { de: Flächeneinheit }
    formen: [Flächeneinheiten]
    erklaerung:
      de: 'Einheiten für Flächen: mm², cm², dm², m², a, ha, km².'
  - id: volumeneinheit
    wort: { de: Volumeneinheit }
    formen: [Volumeneinheiten]
    erklaerung:
      de: 'Einheiten für den Rauminhalt: mm³, cm³, dm³, m³.'
  - id: hohlmass
    wort: { de: Hohlmaß }
    formen: [Hohlmaßen]
    erklaerung:
      de: 'Einheiten für das, was in ein Gefäß passt: Milliliter (ml) und Liter (l). 1 l = 1 dm³.'

  # Flächen und Körper
  - id: umfang
    wort: { de: Umfang }
    formen: [Umfang]
    erklaerung:
      de: Die Länge des Weges einmal ganz außen um eine Figur herum.
  - id: flaecheninhalt
    wort: { de: Flächeninhalt }
    formen: [Flächeninhalt, Flächeninhalte]
    erklaerung:
      de: Wie viel Fläche eine Figur bedeckt. Man zählt, wie viele Einheitsquadrate hineinpassen.
  - id: einheitsquadrat
    wort: { de: Einheitsquadrat }
    formen: [Einheitsquadrate, Quadrateinheiten]
    erklaerung:
      de: 'Ein Quadrat mit der Seitenlänge 1, zum Beispiel 1 cm. Sein Flächeninhalt ist 1 cm².'
  - id: quader
    wort: { de: Quader }
    formen: [Quader, Quaders]
    erklaerung:
      de: 'Ein Körper mit sechs rechteckigen Flächen, wie ein Schuhkarton.'
  - id: wuerfel
    wort: { de: Würfel }
    formen: [Würfel]
    erklaerung:
      de: Ein Quader, bei dem alle sechs Flächen gleich große Quadrate sind.
  - id: kante
    wort: { de: Kante }
    formen: [Kantenlänge, Kantenlängen, Kante]
    erklaerung:
      de: Die Linie, an der zwei Flächen eines Körpers zusammenstoßen. Ein Quader hat 12 Kanten.
  - id: grundflaeche
    wort: { de: Grundfläche }
    formen: [Grundfläche]
    erklaerung:
      de: 'Die Fläche, auf der ein Körper steht. Beim Quader: Breite mal Tiefe.'
  - id: volumen
    wort: { de: Volumen }
    formen: [Volumen, Volumens]
    erklaerung:
      de: Wie viel Raum ein Körper einnimmt – also wie viel hineinpasst. Man zählt Einheitswürfel.
  - id: einheitswuerfel
    wort: { de: Einheitswürfel }
    formen: [Einheitswürfel]
    erklaerung:
      de: 'Ein Würfel mit der Kantenlänge 1, zum Beispiel 1 cm. Sein Volumen ist 1 cm³.'
  - id: oberflaeche
    wort: { de: Oberfläche }
    formen: [Oberflächeninhalt, Oberfläche]
    erklaerung:
      de: Alle Außenflächen eines Körpers zusammen. Ihr Flächeninhalt heißt Oberflächeninhalt.
  - id: netz
    wort: { de: Würfelnetz }
    formen: [Würfelnetze, Würfelnetz, Netz]
    erklaerung:
      de: 'Die Oberfläche eines Körpers, aufgeklappt und flach hingelegt. Ein Würfelnetz besteht aus sechs Quadraten.'

  # Dreiecke und Vierecke (Klasse 6)
  - id: innenwinkel
    wort: { de: Innenwinkel }
    formen: [Innenwinkel]
    erklaerung:
      de: 'Die Winkel innen an den Ecken einer Figur. Im Dreieck sind es drei, zusammen immer 180°.'
  - id: basiswinkel
    wort: { de: Basiswinkel }
    formen: [Basiswinkel]
    erklaerung:
      de: 'Die beiden Winkel an der Basis eines gleichschenkligen Dreiecks. Sie sind gleich groß.'
  - id: gleichschenklig
    wort: { de: gleichschenklig }
    formen: [gleichschenklig, gleichschenkligen]
    erklaerung:
      de: 'Ein Dreieck mit zwei gleich langen Seiten (den Schenkeln). Die dritte Seite heißt Basis.'
  - id: gleichseitig
    wort: { de: gleichseitig }
    formen: [gleichseitig]
    erklaerung:
      de: 'Ein Dreieck, dessen drei Seiten alle gleich lang sind. Alle Winkel sind dann 60°.'
  - id: kongruenzsatz
    wort: { de: Kongruenzsatz }
    formen: [Kongruenzsatz]
    erklaerung:
      de: 'Ein Satz, der sagt, welche drei Angaben ein Dreieck eindeutig festlegen: sss, sws, wsw oder SsW.'
  - id: zirkel
    wort: { de: Zirkel }
    formen: [Zirkel]
    erklaerung:
      de: 'Ein Gerät zum Zeichnen von Kreisen und Kreisbögen. Seine Öffnung ist der Radius.'
  - id: hoehe
    wort: { de: Höhe }
    formen: [Höhe]
    erklaerung:
      de: 'Ein senkrechter Abstand. Im Dreieck: die Strecke von einer Ecke senkrecht auf die gegenüberliegende Seite.'
  - id: seitenhalbierende
    wort: { de: Seitenhalbierende }
    formen: [Seitenhalbierende]
    erklaerung:
      de: 'Die Strecke von einer Ecke des Dreiecks zur Mitte der gegenüberliegenden Seite.'
  - id: winkelhalbierende
    wort: { de: Winkelhalbierende }
    formen: [Winkelhalbierende]
    erklaerung:
      de: 'Eine Linie, die einen Winkel in zwei gleich große Winkel teilt.'
  - id: mittelsenkrechte
    wort: { de: Mittelsenkrechte }
    formen: [Mittelsenkrechte]
    erklaerung:
      de: 'Eine Gerade, die durch die Mitte einer Strecke geht und senkrecht auf ihr steht.'
  - id: umkreis
    wort: { de: Umkreis }
    formen: [Umkreis]
    erklaerung:
      de: 'Der Kreis, der durch alle drei Ecken eines Dreiecks geht.'
  - id: inkreis
    wort: { de: Inkreis }
    formen: [Inkreis]
    erklaerung:
      de: 'Der Kreis im Dreieck, der alle drei Seiten berührt.'
  - id: raute
    wort: { de: Raute }
    formen: [Raute]
    erklaerung:
      de: 'Ein Viereck mit vier gleich langen Seiten. Ein Quadrat ist eine besondere Raute mit rechten Winkeln.'
  - id: parallelogramm
    wort: { de: Parallelogramm }
    formen: [Parallelogramm, Parallelogrammen]
    erklaerung:
      de: 'Ein Viereck, bei dem gegenüberliegende Seiten parallel und gleich lang sind.'
  - id: trapez
    wort: { de: Trapez }
    formen: [Trapez, Trapezen]
    erklaerung:
      de: 'Ein Viereck mit (mindestens) zwei parallelen gegenüberliegenden Seiten.'
  - id: drachenviereck
    wort: { de: Drachenviereck }
    formen: [Drachenviereck, Drachenvierecken]
    erklaerung:
      de: 'Ein Viereck mit zwei Paaren gleich langer Seiten, die jeweils nebeneinanderliegen – wie ein Drachen.'

  # Geometrie
  - id: koordinaten
    wort: { de: Koordinaten }
    formen: [Koordinaten, Koordinate]
    erklaerung:
      de: 'Zwei Zahlen, die sagen, wo ein Punkt liegt: erst x (nach rechts), dann y (nach oben). P(3|2).'
  - id: ursprung
    wort: { de: Ursprung }
    formen: [Ursprung]
    erklaerung:
      de: 'Der Punkt (0|0), an dem sich die beiden Achsen des Koordinatensystems schneiden.'
  - id: gerade
    wort: { de: Gerade }
    formen: [Gerade, Geraden]
    erklaerung:
      de: Eine gerade Linie ohne Anfang und ohne Ende. Man zeichnet nur ein Stück davon.
  - id: parallel
    wort: { de: parallel }
    formen: [parallel, Parallel, Parallele]
    erklaerung:
      de: Zwei Geraden sind parallel, wenn sie überall gleich weit voneinander entfernt sind. Sie schneiden sich nie.
  - id: senkrecht
    wort: { de: senkrecht }
    formen: [senkrecht, Senkrechten]
    erklaerung:
      de: 'Zwei Geraden stehen senkrecht aufeinander, wenn sie sich im rechten Winkel (90°) schneiden. Ohne zweite Gerade heißt senkrecht: von oben nach unten.'
  - id: schnittpunkt
    wort: { de: Schnittpunkt }
    formen: [Schnittpunkt, Schnittpunkten]
    erklaerung:
      de: Der Punkt, an dem sich zwei Linien kreuzen.
  - id: geodreieck
    wort: { de: Geodreieck }
    formen: [Geodreieck]
    erklaerung:
      de: 'Ein dreieckiges Lineal mit Mittellinie und Winkelskala. Damit misst und zeichnet man Längen, Winkel, Parallelen und Senkrechte.'
  - id: winkel
    wort: { de: Winkel }
    formen: [Winkel]
    erklaerung:
      de: 'Zwei Linien (die Schenkel), die von einem Punkt (dem Scheitel) ausgehen. Seine Größe misst man in Grad.'
  - id: rechter-winkel
    wort: { de: rechter Winkel }
    formen: [rechten Winkel, rechter Winkel]
    erklaerung:
      de: 'Ein Winkel von genau 90°, wie eine Heftecke.'
  - id: gestreckter-winkel
    wort: { de: gestreckter Winkel }
    formen: [gestreckten Winkel]
    erklaerung:
      de: 'Ein Winkel von genau 180°. Die beiden Schenkel bilden eine gerade Linie.'
  - id: winkelart
    wort: { de: Winkelart }
    formen: [Winkelart]
    erklaerung:
      de: 'Winkel werden nach ihrer Größe benannt: spitz (unter 90°), recht (90°), stumpf (zwischen 90° und 180°), gestreckt (180°), überstumpf (über 180°).'
  - id: schenkel
    wort: { de: Schenkel }
    formen: [Schenkel]
    erklaerung:
      de: 'Die beiden Linien, die einen Winkel bilden.'
  - id: grad
    wort: { de: Grad }
    formen: [Grad]
    erklaerung:
      de: 'Die Maßeinheit für Winkel, geschrieben °. Ein rechter Winkel hat 90°, ein ganzer Kreis 360°.'
  - id: winkelmesser
    wort: { de: Winkelmesser }
    formen: [Winkelmesser]
    erklaerung:
      de: 'Ein Halbkreis mit einer Skala in Grad. Damit misst man Winkel. Auch das Geodreieck hat einen.'
  - id: skala
    wort: { de: Skala }
    formen: [Skalen, Skala]
    erklaerung:
      de: Eine Reihe von Strichen mit Zahlen zum Ablesen, wie auf einem Lineal.
  - id: scheitelwinkel
    wort: { de: Scheitelwinkel }
    formen: [Scheitelwinkel, Scheitel-]
    erklaerung:
      de: 'Zwei Winkel, die sich am Schnittpunkt zweier Geraden genau gegenüberliegen. Sie sind gleich groß.'
  - id: nebenwinkel
    wort: { de: Nebenwinkel }
    formen: [Nebenwinkel]
    erklaerung:
      de: 'Zwei Winkel, die nebeneinander liegen und einen Schenkel teilen. Zusammen sind sie 180°.'
  - id: stufenwinkel
    wort: { de: Stufenwinkel }
    formen: [Stufenwinkel, Stufen-]
    erklaerung:
      de: 'Zwei Winkel an zwei Schnittpunkten, die an der gleichen Stelle liegen (F-Form). Bei parallelen Geraden sind sie gleich groß.'
  - id: wechselwinkel
    wort: { de: Wechselwinkel }
    formen: [Wechselwinkel]
    erklaerung:
      de: 'Zwei Winkel an zwei Schnittpunkten, die über Kreuz liegen (Z-Form). Bei parallelen Geraden sind sie gleich groß.'
  - id: verschiebung
    wort: { de: Verschiebung }
    formen: [Verschiebung]
    erklaerung:
      de: Eine Bewegung, bei der eine Figur nur woanders hin rutscht. Sie wird nicht gedreht und nicht umgeklappt.
  - id: spiegelung
    wort: { de: Spiegelung }
    formen: [Spiegelung, Spiegle]
    erklaerung:
      de: 'Eine Bewegung, bei der eine Figur an einer Linie umgeklappt wird – wie im Spiegel. Danach ist sie seitenverkehrt.'
  - id: drehung
    wort: { de: Drehung }
    formen: [Drehung]
    erklaerung:
      de: Eine Bewegung, bei der sich eine Figur um einen Punkt dreht.
  - id: bildpunkt
    wort: { de: Bildpunkt }
    formen: [Bildpunktes, Bildpunkt]
    erklaerung:
      de: 'Der Punkt, an dem ein Punkt nach einer Spiegelung oder Verschiebung landet. Zu P gehört der Bildpunkt P′.'
  - id: spiegelachse
    wort: { de: Spiegelachse }
    formen: [Spiegelachse]
    erklaerung:
      de: 'Die Linie, an der gespiegelt wird. Punkt und Bildpunkt sind gleich weit von ihr entfernt.'
  - id: symmetrieachse
    wort: { de: Symmetrieachse }
    formen: [Symmetrieachsen, Symmetrieachse]
    erklaerung:
      de: 'Eine Linie, an der man eine Figur falten kann, sodass beide Hälften genau aufeinanderliegen.'
  - id: achsensymmetrisch
    wort: { de: achsensymmetrisch }
    formen: [achsensymmetrisch]
    erklaerung:
      de: Eine Figur ist achsensymmetrisch, wenn sie mindestens eine Symmetrieachse hat.
  - id: punktsymmetrie
    wort: { de: Punktsymmetrie }
    formen: [Punktsymmetrie]
    erklaerung:
      de: Eine Figur ist punktsymmetrisch, wenn sie nach einer halben Drehung genauso aussieht wie vorher.
  - id: diagonale
    wort: { de: Diagonale }
    formen: [Diagonalen, Diagonale]
    erklaerung:
      de: 'Eine Strecke, die zwei Ecken verbindet, die nicht nebeneinanderliegen.'
  - id: prisma
    wort: { de: Prisma }
    formen: [Prismas, Prismen, Prisma]
    erklaerung:
      de: 'Ein Körper mit zwei gleichen, parallelen Vielecken als Grund- und Deckfläche. Die Seitenflächen sind Rechtecke.'
  - id: deckflaeche
    wort: { de: Deckfläche }
    formen: [Deckfläche]
    erklaerung:
      de: 'Die Fläche oben auf einem Prisma. Sie ist genauso groß wie die Grundfläche.'
  - id: schraegbild
    wort: { de: Schrägbild }
    formen: [Schrägbild]
    erklaerung:
      de: 'Eine Zeichnung, die einen Körper räumlich zeigt. Die Kanten nach hinten werden schräg und verkürzt gezeichnet.'
  # Klasse 7: rationale Zahlen
  - id: negative-zahl
    wort: { de: negative Zahl }
    formen: [negative Zahl, negativen Zahlen, negative Zahlen]
    erklaerung:
      de: 'Eine Zahl kleiner als 0, mit Minus davor: −3, −0,5. Sie steht links von der 0. Beispiele: −5 °C, 20 € Schulden.'
  - id: zahlengerade
    wort: { de: Zahlengerade }
    formen: [Zahlengerade, Zahlengeraden]
    erklaerung:
      de: 'Ein Zahlenstrahl, der nach links über die 0 hinaus weitergeht. Rechts von 0 stehen die positiven, links die negativen Zahlen.'
  - id: gegenzahl
    wort: { de: Gegenzahl }
    formen: [Gegenzahl, Gegenzahlen]
    erklaerung:
      de: 'Die Zahl auf der anderen Seite der 0, gleich weit entfernt. Die Gegenzahl von 4 ist −4, die Gegenzahl von −4 ist 4.'
  - id: betrag
    wort: { de: Betrag }
    formen: [Betrag, Beträge, Beträgen]
    erklaerung:
      de: 'Der Abstand einer Zahl von der 0, ohne Vorzeichen. Man schreibt |−4| = 4. Ein Betrag ist nie negativ.'
  - id: vorzeichen
    wort: { de: Vorzeichen }
    formen: [Vorzeichen]
    erklaerung:
      de: 'Das Plus oder Minus vor einer Zahl. Es sagt, auf welcher Seite der 0 die Zahl liegt. Das Plus lässt man meist weg.'
  - id: ganze-zahl
    wort: { de: ganze Zahl }
    formen: [ganze Zahl, ganzen Zahlen, ganze Zahlen]
    erklaerung:
      de: 'Die natürlichen Zahlen und ihre Gegenzahlen: … −2, −1, 0, 1, 2 … – ohne Komma und ohne Bruch.'
  - id: rationale-zahl
    wort: { de: rationale Zahl }
    formen: [rationale Zahl, rationalen Zahlen, rationale Zahlen]
    erklaerung:
      de: 'Jede Zahl, die man als Bruch schreiben kann – auch mit Minus: 3, −2, 3/4, −0,5.'
  - id: quadrant
    wort: { de: Quadrant }
    formen: [Quadrant, Quadranten]
    erklaerung:
      de: 'Eines der vier Viertel, in die die Achsen das Koordinatensystem teilen. Man zählt gegen den Uhrzeigersinn: I oben rechts, II oben links, III unten links, IV unten rechts.'
  # Klasse 7: Terme und Gleichungen
  - id: variable
    wort: { de: Variable }
    formen: [Variable, Variablen]
    erklaerung:
      de: 'Ein Buchstabe wie x, der für eine Zahl steht. Man kann verschiedene Zahlen für ihn einsetzen.'
  - id: term
    wort: { de: Term }
    formen: [Term, Terme]
    erklaerung:
      de: 'Ein Rechenausdruck ohne Gleichheitszeichen, zum Beispiel 3 · x − 5 oder (4 + 2) · 7.'
  - id: formel
    wort: { de: Formel }
    formen: [Formel, Formeln]
    erklaerung:
      de: 'Eine Gleichung mit Buchstaben, die immer gilt – zum Beispiel A = a · b für den Flächeninhalt eines Rechtecks.'
  - id: umformen
    wort: { de: umformen }
    formen: [umformen, Umformen, Umformung, Umformungsschritt]
    erklaerung:
      de: 'Auf beiden Seiten einer Gleichung dasselbe rechnen. Die Gleichung wird einfacher, die Lösung bleibt gleich.'
  # Klasse 7: Prozent- und Zinsrechnung
  - id: grundwert
    wort: { de: Grundwert }
    formen: [Grundwert]
    erklaerung:
      de: 'Das Ganze, von dem man Prozent nimmt – es sind 100 %. In „25 % von 80 €“ ist 80 € der Grundwert.'
  - id: prozentwert
    wort: { de: Prozentwert }
    formen: [Prozentwert]
    erklaerung:
      de: 'Der Teil vom Grundwert. In „25 % von 80 € sind 20 €“ ist 20 € der Prozentwert.'
  - id: prozentsatz
    wort: { de: Prozentsatz }
    formen: [Prozentsatz, Prozentsätze, Prozentsätzen]
    erklaerung:
      de: 'Die Angabe mit dem Zeichen %. Sie sagt, wie viele Hundertstel vom Ganzen gemeint sind. In „25 % von 80 €“ ist 25 % der Prozentsatz.'
  - id: kapital
    wort: { de: Kapital }
    formen: [Kapital]
    erklaerung:
      de: 'Das Geld, das man auf ein Konto legt oder sich leiht. In der Zinsrechnung ist es der Grundwert.'
  - id: zinsen
    wort: { de: Zinsen }
    formen: [Zinsen]
    erklaerung:
      de: 'Geld, das man für angelegtes Geld bekommt oder für geliehenes Geld bezahlt. In der Zinsrechnung sind die Zinsen der Prozentwert.'
  - id: zinssatz
    wort: { de: Zinssatz }
    formen: [Zinssatz]
    erklaerung:
      de: 'Wie viel Prozent Zinsen es in einem Jahr gibt. In der Zinsrechnung ist er der Prozentsatz.'
  # Klasse 7: Daten und Zufall
  - id: saeulendiagramm
    wort: { de: Säulendiagramm }
    formen: [Säulendiagramm]
    erklaerung:
      de: 'Ein Diagramm mit Säulen. Je höher die Säule, desto größer der Wert. Gut zum Vergleichen.'
  - id: liniendiagramm
    wort: { de: Liniendiagramm }
    formen: [Liniendiagramm]
    erklaerung:
      de: 'Ein Diagramm mit Punkten, die durch Linien verbunden sind. Es zeigt, wie sich etwas mit der Zeit verändert.'
  - id: ergebnismenge
    wort: { de: Ergebnismenge }
    formen: [Ergebnismenge]
    erklaerung:
      de: 'Alle möglichen Ergebnisse eines Zufallsversuchs. Beim Würfel: {1; 2; 3; 4; 5; 6}.'
  - id: ereignis
    wort: { de: Ereignis }
    formen: [Ereignis, Ereignisse]
    erklaerung:
      de: 'Ein Teil der Ergebnismenge, zum Beispiel „eine gerade Zahl würfeln“ = {2; 4; 6}.'
  - id: wahrscheinlichkeit
    wort: { de: Wahrscheinlichkeit }
    formen: [Wahrscheinlichkeit]
    erklaerung:
      de: 'Wie groß die Chance für ein Ereignis ist – eine Zahl von 0 (unmöglich) bis 1 (sicher). Bei gleich wahrscheinlichen Ergebnissen: günstige durch alle.'
  # Klasse 7: Kreis und Begründen
  - id: radius
    wort: { de: Radius }
    formen: [Radius]
    erklaerung:
      de: 'Der Abstand vom Mittelpunkt eines Kreises zu jedem Punkt auf dem Kreis.'
  - id: sekante
    wort: { de: Sekante }
    formen: [Sekante]
    erklaerung:
      de: 'Eine Gerade, die einen Kreis in zwei Punkten schneidet.'
  - id: tangente
    wort: { de: Tangente }
    formen: [Tangente]
    erklaerung:
      de: 'Eine Gerade, die einen Kreis in genau einem Punkt berührt. Sie steht senkrecht auf dem Radius zu diesem Punkt.'
  - id: passante
    wort: { de: Passante }
    formen: [Passante]
    erklaerung:
      de: 'Eine Gerade, die am Kreis vorbeigeht – ohne gemeinsamen Punkt.'
  - id: thales
    wort: { de: Satz des Thales }
    formen: [Satz des Thales]
    erklaerung:
      de: 'Liegt der Punkt C auf einem Kreis mit dem Durchmesser AB, dann ist der Winkel bei C im Dreieck ABC ein rechter Winkel.'
  - id: zentriwinkel
    wort: { de: Zentriwinkel }
    formen: [Zentriwinkel]
    erklaerung:
      de: 'Ein Winkel mit der Ecke im Mittelpunkt des Kreises. Seine Schenkel gehen zu zwei Punkten auf dem Kreis.'
  - id: peripheriewinkel
    wort: { de: Peripheriewinkel }
    formen: [Peripheriewinkel]
    erklaerung:
      de: 'Ein Winkel mit der Ecke auf dem Kreis. Seine Schenkel gehen zu zwei anderen Punkten auf dem Kreis.'
  - id: sehnenviereck
    wort: { de: Sehnenviereck }
    formen: [Sehnenviereck]
    erklaerung:
      de: 'Ein Viereck, dessen vier Ecken alle auf einem Kreis liegen.'
  - id: voraussetzung
    wort: { de: Voraussetzung }
    formen: [Voraussetzung]
    erklaerung:
      de: 'Der Teil eines Satzes nach „Wenn“: Das muss gelten, damit der Satz etwas sagt.'
  - id: behauptung
    wort: { de: Behauptung }
    formen: [Behauptung]
    erklaerung:
      de: 'Der Teil eines Satzes nach „dann“: Das folgt aus der Voraussetzung.'
  - id: umkehrung
    wort: { de: Umkehrung }
    formen: [Umkehrung]
    erklaerung:
      de: 'Der Satz, bei dem Voraussetzung und Behauptung die Plätze tauschen. Sie kann wahr oder falsch sein.'
  - id: gegenbeispiel
    wort: { de: Gegenbeispiel }
    formen: [Gegenbeispiel]
    erklaerung:
      de: 'Ein Beispiel, das zeigt: Eine Aussage über „jede“ Zahl oder Figur stimmt nicht.'
  # Klasse 7: Körper
  - id: pyramide
    wort: { de: Pyramide }
    formen: [Pyramide, Pyramiden]
    erklaerung:
      de: 'Ein Körper mit einem Vieleck als Grundfläche und Dreiecken als Seitenflächen, die sich oben in einer Spitze treffen.'
  - id: pyramidenstumpf
    wort: { de: Pyramidenstumpf }
    formen: [Pyramidenstumpf]
    erklaerung:
      de: 'Eine Pyramide, deren Spitze parallel zur Grundfläche abgeschnitten ist. Die Seitenflächen sind Trapeze.'
  - id: zweitafelbild
    wort: { de: Zweitafelbild }
    formen: [Zweitafelbild]
    erklaerung:
      de: 'Zwei Ansichten eines Körpers genau übereinander: oben die Vorderansicht (Aufriss), unten die Draufsicht (Grundriss).'
  - id: aufriss
    wort: { de: Aufriss }
    formen: [Aufriss]
    erklaerung:
      de: 'Die Ansicht eines Körpers genau von vorne.'
  - id: grundriss
    wort: { de: Grundriss }
    formen: [Grundriss]
    erklaerung:
      de: 'Die Ansicht eines Körpers genau von oben.'
  - id: dichte
    wort: { de: Dichte }
    formen: [Dichte]
    erklaerung:
      de: 'Wie schwer 1 cm³ eines Stoffes ist. Wasser hat die Dichte 1 g/cm³, Eisen etwa 7,9 g/cm³.'
  # Klasse 8: Terme umformen
  - id: ausmultiplizieren
    wort: { de: ausmultiplizieren }
    formen: [ausmultiplizieren, Ausmultiplizieren, Multipliziere aus, multipliziere aus]
    erklaerung:
      de: 'Eine Klammer auflösen, indem man die Zahl davor mit jedem Glied in der Klammer malnimmt: 3·(x + 4) = 3·x + 12.'
  - id: ausklammern
    wort: { de: ausklammern }
    formen: [ausklammern, Ausklammern, Klammere aus]
    erklaerung:
      de: 'Einen gemeinsamen Faktor vor eine Klammer ziehen: 6·x + 9 = 3·(2·x + 3). Das Gegenteil von ausmultiplizieren.'
  - id: binomische-formel
    wort: { de: binomische Formel }
    formen: [binomische Formel, binomischen Formel, binomischen Formeln, binomische Formeln]
    erklaerung:
      de: '(a + b)² = a² + 2·a·b + b², (a − b)² = a² − 2·a·b + b² und (a + b)·(a − b) = a² − b².'
  - id: ungleichung
    wort: { de: Ungleichung }
    formen: [Ungleichung]
    erklaerung:
      de: 'Wie eine Gleichung, aber mit <, >, ≤ oder ≥ statt =. Meist erfüllen viele Zahlen eine Ungleichung.'
  # Klasse 8: Funktionen
  - id: funktion
    wort: { de: Funktion }
    formen: [Funktion, Funktionen]
    erklaerung:
      de: 'Eine Zuordnung, bei der jedem x genau ein y zugeordnet ist. Man schreibt zum Beispiel f(x) = 2·x + 1.'
  - id: funktionswert
    wort: { de: Funktionswert }
    formen: [Funktionswert, Funktionswerte]
    erklaerung:
      de: 'Das y, das zu einem bestimmten x gehört. f(3) ist der Funktionswert an der Stelle 3.'
  - id: nullstelle
    wort: { de: Nullstelle }
    formen: [Nullstelle, Nullstellen]
    erklaerung:
      de: 'Eine Stelle x, an der der Funktionswert 0 ist. Dort schneidet oder berührt der Graph die x-Achse.'
  - id: lineare-funktion
    wort: { de: lineare Funktion }
    formen: [lineare Funktion, linearen Funktion]
    erklaerung:
      de: 'Eine Funktion mit der Gleichung y = m·x + n. Ihr Graph ist eine Gerade.'
  - id: anstieg
    wort: { de: Anstieg }
    formen: [Anstieg]
    erklaerung:
      de: 'Die Zahl m in y = m·x + n. Sie sagt, um wie viel y wächst, wenn x um 1 größer wird. Negativ heißt: Die Gerade fällt.'
  - id: y-achsenabschnitt
    wort: { de: y-Achsenabschnitt }
    formen: [y-Achsenabschnitt]
    erklaerung:
      de: 'Die Zahl n in y = m·x + n. An dieser Stelle schneidet die Gerade die y-Achse.'
  - id: steigungsdreieck
    wort: { de: Steigungsdreieck }
    formen: [Steigungsdreieck]
    erklaerung:
      de: 'Ein rechtwinkliges Dreieck an der Geraden: ein Stück nach rechts, dann hoch oder runter bis zur Geraden. Höhe : Breite ergibt den Anstieg.'
  - id: hochpunkt
    wort: { de: Hochpunkt }
    formen: [Hochpunkt]
    erklaerung:
      de: 'Ein Punkt des Graphen, der höher liegt als alle Punkte in seiner Nähe. Links davon steigt der Graph, rechts davon fällt er.'
  - id: grundgebuehr
    wort: { de: Grundgebühr }
    formen: [Grundgebühr]
    erklaerung:
      de: 'Ein fester Betrag, den man immer zahlt – egal, wie viel man nutzt. In y = m·x + n ist das n.'
  # Klasse 8: Gleichungssysteme
  - id: gleichungssystem
    wort: { de: Gleichungssystem }
    formen: [Gleichungssystem, Gleichungssystems, Gleichungssysteme]
    erklaerung:
      de: 'Zwei Gleichungen mit zwei Variablen x und y, die beide zugleich gelten sollen. Die Lösung ist ein Zahlenpaar (x|y).'
  - id: einsetzungsverfahren
    wort: { de: Einsetzungsverfahren }
    formen: [Einsetzungsverfahren]
    erklaerung:
      de: 'Eine Gleichung ist nach y aufgelöst. Man setzt diesen Term für y in die andere Gleichung ein – so bleibt nur x übrig.'
  - id: additionsverfahren
    wort: { de: Additionsverfahren }
    formen: [Additionsverfahren]
    erklaerung:
      de: 'Man addiert beide Gleichungen so, dass eine Variable wegfällt. Vorher kann man eine Gleichung mit einer Zahl malnehmen.'
  # Klasse 8: Kreis und Zylinder
  - id: durchmesser
    wort: { de: Durchmesser }
    formen: [Durchmesser]
    erklaerung:
      de: 'Eine Strecke quer durch den Kreis, durch den Mittelpunkt. Sie ist doppelt so lang wie der Radius: d = 2·r.'
  - id: kreiszahl
    wort: { de: Kreiszahl π }
    formen: [π]
    erklaerung:
      de: 'Die Zahl π („pi“) ≈ 3,14. Bei jedem Kreis ist der Umfang π-mal so lang wie der Durchmesser.'
  - id: kreisring
    wort: { de: Kreisring }
    formen: [Kreisrings, Kreisring]
    erklaerung:
      de: 'Die Fläche zwischen zwei Kreisen mit demselben Mittelpunkt – wie bei einer Unterlegscheibe.'
  - id: zylinder
    wort: { de: Zylinder }
    formen: [Zylinders, Zylinder, Hohlzylinder]
    erklaerung:
      de: 'Ein Körper wie eine Dose: unten und oben je ein gleich großer Kreis, dazwischen eine gebogene Fläche, der Mantel. Ein Hohlzylinder ist innen hohl wie ein Rohr.'
  - id: mantel
    wort: { de: Mantel }
    formen: [Mantelrechtecks, Mantelrechteck, Mantels, Mantel]
    erklaerung:
      de: 'Die gebogene Seitenfläche eines Zylinders. Abgerollt ist sie ein Rechteck: so lang wie der Kreisumfang, so hoch wie der Zylinder.'
  # Klasse 8: Ähnlichkeit
  - id: zentrische-streckung
    wort: { de: zentrische Streckung }
    formen: [zentrische Streckung, zentrischen Streckung, zentrisch]
    erklaerung:
      de: 'Eine Figur wird von einem festen Punkt Z aus vergrößert oder verkleinert. Jeder Punkt wandert auf seinem Strahl von Z weg oder zu Z hin.'
  - id: streckfaktor
    wort: { de: Streckfaktor }
    formen: [Streckfaktor, Streckfaktoren]
    erklaerung:
      de: 'Die Zahl k, mit der alle Längen malgenommen werden. k > 1 vergrößert, k zwischen 0 und 1 verkleinert.'
  - id: streckzentrum
    wort: { de: Streckzentrum }
    formen: [Streckzentrum]
    erklaerung:
      de: 'Der feste Punkt Z, von dem aus gestreckt wird. Er selbst bleibt an seinem Platz.'
  - id: aehnlich
    wort: { de: ähnlich }
    formen: [ähnlich, ähnliche, ähnlichen, Ähnlichkeit]
    erklaerung:
      de: 'Zwei Figuren sind ähnlich, wenn die eine eine vergrößerte oder verkleinerte Kopie der anderen ist: gleiche Winkel, alle Seiten mit demselben Faktor gestreckt.'
  - id: hauptaehnlichkeitssatz
    wort: { de: Hauptähnlichkeitssatz }
    formen: [Hauptähnlichkeitssatz]
    erklaerung:
