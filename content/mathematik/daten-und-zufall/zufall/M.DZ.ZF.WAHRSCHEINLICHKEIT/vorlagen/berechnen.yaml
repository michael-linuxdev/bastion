# „Wie groß ist die Wahrscheinlichkeit, eine gerade Zahl zu würfeln?“ Entwurf: noch nicht geprüft.
id: M.DZ.ZF.WAHRSCHEINLICHKEIT.BERECHNEN
kompetenz: M.DZ.ZF.WAHRSCHEINLICHKEIT
niveaus: [G, M]
typ: bruch-eingabe
quelle: generator
generator: zf.laplace@1
parameter:
  G: { erweitert: false }
  M: { erweitert: true }
antwort:
  form: beliebig
text:
  aufgabe:
    de: '{versuch} **Gib** die [[Wahrscheinlichkeit]] für „{ereignis}“ als [[Bruch]] **an**.'
hilfen:
  - de: 'Zähle alle möglichen Ergebnisse. Zähle dann die Ergebnisse, die passen.'
  - de: '[[Wahrscheinlichkeit]] = passende Ergebnisse : alle Ergebnisse. Bei 3 von 6 also 3/6 = 1/2.'
fehlerbilder:
  guenstig-durch-unguenstig:
    de: 'Du hast die passenden durch die nicht passenden Ergebnisse geteilt. In den [[Nenner]] gehören **alle** Ergebnisse.'
    fv: FV.BR.TEIL-ZU-REST
  kehrwert:
    de: '[[Zähler]] und [[Nenner]] sind vertauscht. Eine [[Wahrscheinlichkeit]] ist nie größer als 1.'
    fv: FV.BR.VERTAUSCHT
herkunft: ki-entwurf
version: 1
