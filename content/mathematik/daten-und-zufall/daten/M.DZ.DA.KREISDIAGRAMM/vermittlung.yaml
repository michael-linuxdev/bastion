id: M.DZ.DA.KREISDIAGRAMM
kompetenz: M.DZ.DA.KREISDIAGRAMM
niveau: G
dauer_min: 11
schritte:
  - id: ziel
    typ: ziel
    text:
      de: 'Danach kannst du Anteile aus einem [[Kreisdiagramm]] ablesen und den [[Winkel]] für einen [[Anteil]] ausrechnen.'
    weiter: vorwissen
  - id: vorwissen
    typ: anknuepfen
    text:
      de: 'Wie viel ist ein Viertel von 360?'
    antwort:
      eingabe: { art: zahl, loesung: '90' }
    weiter: entdecken
    bei: { sonst: M.ZO.BR.ANTEIL-VON }
  - id: entdecken
    typ: entdecken
    text:
      de: 'Eine Pizza ist in 8 gleiche Stücke geteilt, 3 davon haben Pilze. Welcher [[Anteil]] der Pizza hat Pilze?'
    antwort:
      eingabe:
        {
          art: bruch,
          loesung: '3/8',
          fehler: [{ wert: '5/8', fv: FV.BR.GEGENTEIL }, { wert: '3/5', fv: FV.BR.TEIL-ZU-REST }],
        }
    weiter: erklaeren-winkel
  - id: erklaeren-winkel
    typ: erklaeren
    text:
      de: 'Ein [[Kreisdiagramm]] ist ein ganzer Kreis mit 360°. Jeder [[Anteil]] bekommt denselben Anteil von 360°. [[Winkel]] = Anteil · 360°. Umgekehrt: Anteil = Winkel : 360°.'
    weiter: beispiel
  - id: beispiel
    typ: beispiel
    text:
      de: 'Ein Viertel der Klasse fährt Rad: 1/4 von 360° = 90°. Ein Stück mit 120° ist 120 : 360 = 1/3 des Kreises.'
    weiter: ergaenzen
  - id: ergaenzen
    typ: ergaenzen
    text:
      de: 'Ein [[Anteil]] von 1/6 soll im [[Kreisdiagramm]] gezeigt werden. Wie viel [[Grad]] hat das Stück?'
    antwort:
      eingabe:
        {
          art: zahl,
          loesung: '60',
          fehler:
            [{ wert: '16,7', fv: FV.DA.VOLLKREIS-360 }, { wert: '30', fv: FV.DA.VOLLKREIS-360 }],
        }
    weiter: gegenbeispiel
    bei: { FV.DA.VOLLKREIS-360: erklaeren-winkel }
  - id: gegenbeispiel
    typ: gegenbeispiel
    text:
      de: 'Für 25 % zeichnet Ben ein Stück mit 25°. Stimmt das?'
    antwort:
      optionen:
        - { wert: { de: 'Nein, 25 % von 360° sind 90°.' }, richtig: true }
        - { wert: { de: 'Ja.' }, fv: FV.DA.VOLLKREIS-360 }
    weiter: merksatz
    bei: { FV.DA.VOLLKREIS-360: erklaeren-winkel }
  - id: merksatz
    typ: merksatz
    text:
      de: 'Der ganze Kreis hat 360°. [[Winkel]] = [[Anteil]] · 360°. Anteil = Winkel : 360°. Der Anteil bezieht sich auf das Ganze, nicht auf den Rest.'
    weiter: pruefen
  - id: pruefen
    typ: pruefen
    text:
      de: 'Ein Stück im [[Kreisdiagramm]] hat 180°. Welcher [[Anteil]] ist das?'
    antwort:
      optionen:
        - { wert: { de: '1/2' }, richtig: true }
        - { wert: { de: '1/180' }, fv: FV.DA.VOLLKREIS-360 }
        - { wert: { de: '1/1' }, fv: FV.BR.TEIL-ZU-REST }
    weiter: uebergang
    bei: { FV.DA.VOLLKREIS-360: erklaeren-winkel, FV.BR.TEIL-ZU-REST: erklaeren-winkel }
  - id: uebergang
    typ: uebergang
    text:
      de: 'Sehr gut. Jetzt übst du selbst.'
    vorlagen: [M.DZ.DA.KREISDIAGRAMM.ABLESEN, M.DZ.DA.KREISDIAGRAMM.WINKEL]
    anzahl: 3
herkunft: ki-entwurf
version: 1
