# „Berechne den Durchschnitt.“ Entwurf: noch nicht geprüft.
id: M.DZ.DA.MITTELWERT.ZAHLEN
kompetenz: M.DZ.DA.MITTELWERT
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: da.mittelwert@1
parameter:
  G: { anzahl_min: 3, anzahl_max: 4, wert_max: 30, noten: false, ganzzahlig: true }
  M: { anzahl_min: 4, anzahl_max: 6, wert_max: 200, noten: false, ganzzahlig: false }
text:
  aufgabe:
    de: '**Berechne** das [[arithmetische Mittel]] (den Durchschnitt) der Werte: {werte}'
hilfen:
  - de: Addiere alle Werte.
  - de: 'Teile die [[Summe]] durch die Anzahl der Werte ({anzahl}).'
fehlerbilder:
  durch-falsche-anzahl:
    de: Du hast durch die falsche Anzahl geteilt. Zähle die Werte noch einmal – es sind {anzahl}.
    fv: FV.DA.MITTELWERT-ANZAHL
  nur-summe:
    de: 'Das ist erst die [[Summe]]. Teile sie noch durch die Anzahl der Werte.'
    fv: FV.SA.ZWISCHENERGEBNIS
  nicht-gerundet:
    de: Runde das Ergebnis wie verlangt.
    fv: FV.SA.ANGABE-UEBERSEHEN
herkunft: ki-entwurf
version: 1
