id: M.DZ.DA.MITTELWERT
kompetenz: M.DZ.DA.MITTELWERT
niveau: G
dauer_min: 11
schritte:
  - id: ziel
    typ: ziel
    text:
      de: 'Danach kannst du den [[Durchschnitt]] von Werten ausrechnen, zum Beispiel einen Notendurchschnitt.'
    weiter: vorwissen
  - id: vorwissen
    typ: anknuepfen
    text:
      de: 'Was ergibt 7,5 : 3?'
    antwort:
      eingabe: { art: zahl, loesung: '2,5' }
    weiter: entdecken
    bei: { sonst: M.ZO.BR.DEZ-RECHNEN }
  - id: entdecken
    typ: entdecken
    text:
      de: 'Drei Kinder haben 2, 5 und 8 Bonbons, im Bild als Säulen aus Kästchen. Sie legen alle zusammen und teilen gerecht. Wie viele bekommt jedes?'
    bild:
      {
        werkzeug: gitter@1,
        parameter:
          {
            achsen: false,
            xmax: 11,
            ymax: 8,
            kaestchen:
              [
                [2, 0],
                [2, 1],
                [5, 0],
                [5, 1],
                [5, 2],
                [5, 3],
                [5, 4],
                [8, 0],
                [8, 1],
                [8, 2],
                [8, 3],
                [8, 4],
                [8, 5],
                [8, 6],
                [8, 7],
              ],
          },
      }
    antwort:
      eingabe:
        {
          art: zahl,
          loesung: '5',
          fehler:
            [
              { wert: '15', fv: FV.SA.ZWISCHENERGEBNIS },
              { wert: '7,5', fv: FV.DA.MITTELWERT-ANZAHL },
            ],
        }
    weiter: erklaeren-mittelwert
  - id: erklaeren-mittelwert
    typ: erklaeren
    text:
      de: 'Das [[arithmetische Mittel]] ist diese gerechte Menge. Die hohe Säule gibt 3 Kästchen ab: Dann reichen alle bis zur gestrichelten Linie, 5 Kästchen hoch. Rechnen: alle Werte addieren, durch ihre Anzahl teilen. Jeder Wert zählt, auch 0 und doppelte.'
    bild:
      {
        werkzeug: gitter@1,
        parameter:
          {
            achsen: false,
            xmax: 11,
            ymax: 8,
            kaestchen:
              [
                [2, 0],
                [2, 1],
                [5, 0],
                [5, 1],
                [5, 2],
                [5, 3],
                [5, 4],
                [8, 0],
                [8, 1],
                [8, 2],
                [8, 3],
                [8, 4],
                [8, 5],
                [8, 6],
                [8, 7],
              ],
            linien: [{ von: [0, 5], nach: [11, 5], gestrichelt: true }],
            pfeile: [{ von: [8, 8], nach: [3, 5] }],
          },
      }
    weiter: beispiel
  - id: beispiel
    typ: beispiel
    text:
      de: 'Noten 2, 3, 3 und 4: [[Summe]] 12, Anzahl 4. [[Durchschnitt]] 12 : 4 = 3. Bei 2, 3 und 3 geht es nicht auf: 8 : 3 = 2,666…, auf eine [[Nachkommastelle]] gerundet 2,7.'
    weiter: ergaenzen
  - id: ergaenzen
    typ: ergaenzen
    text:
      de: 'Berechne den [[Durchschnitt]] von 4, 6, 6 und 8.'
    antwort:
      eingabe:
        {
          art: zahl,
          loesung: '6',
          fehler:
            [
              { wert: '8', fv: FV.DA.MITTELWERT-ANZAHL },
              { wert: '24', fv: FV.SA.ZWISCHENERGEBNIS },
            ],
        }
    weiter: gegenbeispiel
    bei:
      {
        FV.DA.MITTELWERT-ANZAHL: erklaeren-mittelwert,
        FV.SA.ZWISCHENERGEBNIS: erklaeren-mittelwert,
      }
  - id: gegenbeispiel
    typ: gegenbeispiel
    text:
      de: 'Lisa läuft an vier Tagen 3 km, 0 km, 5 km und 4 km. Sie rechnet 12 : 3 = 4 km im [[Durchschnitt]]. Stimmt das?'
    antwort:
      optionen:
        - { wert: { de: 'Nein, es sind vier Tage: 12 : 4 = 3 km.' }, richtig: true }
        - { wert: { de: 'Ja, die 0 zählt nicht.' }, fv: FV.DA.MITTELWERT-ANZAHL }
    weiter: merksatz
    bei: { FV.DA.MITTELWERT-ANZAHL: erklaeren-mittelwert }
  - id: merksatz
    typ: merksatz
    text:
      de: '[[Durchschnitt]] = [[Summe]] aller Werte : Anzahl der Werte. Jeder Wert zählt, auch 0.'
    weiter: pruefen
  - id: pruefen
    typ: pruefen
    text:
      de: 'Werte: 10, 20, 0, 30. Wie groß ist das [[arithmetische Mittel]]?'
    antwort:
      optionen:
        - { wert: { de: '15' }, richtig: true }
        - { wert: { de: '20' }, fv: FV.DA.MITTELWERT-ANZAHL }
        - { wert: { de: '60' }, fv: FV.SA.ZWISCHENERGEBNIS }
    weiter: uebergang
    bei:
      {
        FV.DA.MITTELWERT-ANZAHL: erklaeren-mittelwert,
        FV.SA.ZWISCHENERGEBNIS: erklaeren-mittelwert,
      }
  - id: uebergang
    typ: uebergang
    text:
      de: 'Gut gemacht. Jetzt rechnest du selbst.'
    vorlagen: [M.DZ.DA.MITTELWERT.NOTEN, M.DZ.DA.MITTELWERT.ZAHLEN]
    anzahl: 3
herkunft: ki-entwurf
version: 1
