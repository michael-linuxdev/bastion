# Kosten und Mehrkosten berechnen. Entwurf: noch nicht geprüft.
id: M.ZO.PZ.ANGEBOTE.KOSTEN
kompetenz: M.ZO.PZ.ANGEBOTE
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: pz.angebot-kosten@1
parameter:
  G: { raten: false }
  M: { raten: true }
text:
  aufgabe:
    de: '**Rechne**: {aufgabe}'
hilfen:
  - de: 'Wie viele Packungen brauchst du? Nimm den Packungspreis so oft.'
  - de: 'Mehrkosten beim [[Ratenkauf]]: alles zusammen, was du zahlst, minus Barpreis.'
fehlerbilder:
  eine-packung:
    de: 'Das ist der Preis für eine Packung. Du brauchst mehrere.'
  anzahlung-vergessen:
    de: 'Die Anzahlung gehört zum [[Ratenkauf]] dazu.'
  gesamt-statt-mehr:
    de: 'Das ist alles zusammen. Gefragt ist, wie viel mehr als der Barpreis.'
herkunft: ki-entwurf
version: 1
