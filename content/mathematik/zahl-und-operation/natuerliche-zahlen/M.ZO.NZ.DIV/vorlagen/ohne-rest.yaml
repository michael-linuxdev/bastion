# „Berechne schriftlich: 4 218 : 6“. Entwurf: noch nicht geprüft.
id: M.ZO.NZ.DIV.OHNE-REST
kompetenz: M.ZO.NZ.DIV
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: nz.schriftlich-dividieren-ohne-rest@1
parameter:
  G: { stellen_min: 3, stellen_max: 4, mit_rest: false }
  M: { stellen_min: 4, stellen_max: 6, mit_rest: false }
text:
  aufgabe:
    de: '**Berechne** schriftlich: {a} : {b}'
hilfen:
  - de: Teile von links nach rechts. Wie oft passt {b} in die erste Stelle – oder in die ersten beiden?
  - de: 'Passt {b} nicht hinein, schreibe eine 0 ins Ergebnis und nimm die nächste [[Ziffer]] dazu.'
  - de: 'Mache die [[Probe]]: Ergebnis mal {b} muss {a} ergeben.'
fehlerbilder:
  null-vergessen:
    de: Im Ergebnis fehlt eine 0. Wenn {b} in eine Stelle nicht hineinpasst, schreibst du eine 0 ins Ergebnis.
    fv: FV.NZ.NULL-PLATZHALTER
herkunft: ki-entwurf
version: 1
