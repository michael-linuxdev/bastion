# „Berechne schriftlich mit Rest: 4 219 : 6“. Entwurf: noch nicht geprüft.
id: M.ZO.NZ.DIV.MIT-REST
kompetenz: M.ZO.NZ.DIV
niveaus: [G, M]
typ: rest-eingabe
quelle: generator
generator: nz.schriftlich-dividieren@1
parameter:
  G: { stellen_min: 3, stellen_max: 4, mit_rest: true }
  M: { stellen_min: 4, stellen_max: 6, mit_rest: true }
text:
  aufgabe:
    de: '**Berechne** schriftlich: {a} : {b}. Gib auch den Rest an.'
hilfen:
  - de: Teile von links nach rechts. Wie oft passt {b} in die erste Stelle – oder in die ersten beiden?
  - de: 'Passt {b} nicht hinein, schreibe eine 0 ins Ergebnis und nimm die nächste [[Ziffer]] dazu.'
  - de: 'Mache die [[Probe]]: Ergebnis mal {b} plus Rest muss {a} ergeben.'
fehlerbilder:
  null-vergessen:
    de: Im Ergebnis fehlt eine 0. Wenn {b} in eine Stelle nicht hineinpasst, schreibst du eine 0 ins Ergebnis.
  rest-zu-gross:
    de: 'Der Rest ist größer als die Zahl, durch die du teilst – dann passt {b} noch einmal hinein.'
  rest-vergessen:
    de: Es bleibt ein Rest. Gib ihn mit an.
herkunft: ki-entwurf
version: 1
