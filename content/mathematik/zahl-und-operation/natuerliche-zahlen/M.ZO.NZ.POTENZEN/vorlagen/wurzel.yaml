# „Berechne √169“. Entwurf: noch nicht geprüft.
id: M.ZO.NZ.POTENZEN.WURZEL
kompetenz: M.ZO.NZ.POTENZEN
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: nz.quadratzahl@1
parameter:
  G: { basis_max: 10, wurzel: true }
  M: { basis_max: 20, wurzel: true }
text:
  aufgabe:
    de: '**Berechne** im Kopf: $\sqrt{ {quadrat} }$'
hilfen:
  - de: Welche Zahl ergibt mit sich selbst multipliziert {quadrat}?
fehlerbilder:
  mal-zwei:
    de: Verdoppeln ist hier nicht gemeint.
    fv: FV.NZ.WURZEL-HALBIERT
  halbiert:
    de: 'Du hast halbiert. Die [[Wurzel]] ist die Zahl, die mit sich selbst multipliziert {quadrat} ergibt.'
    fv: FV.NZ.WURZEL-HALBIERT
herkunft: ki-entwurf
version: 1
