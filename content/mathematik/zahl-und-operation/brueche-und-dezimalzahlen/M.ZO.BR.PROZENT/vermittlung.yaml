id: M.ZO.BR.PROZENT
kompetenz: M.ZO.BR.PROZENT
niveau: G
dauer_min: 10
schritte:
  - id: ziel
    typ: ziel
    text:
      de: 'Danach kannst du Anteile wie 50 %, 25 % und 100 % als [[Bruch]] und als [[Dezimalzahl]] schreiben.'
    weiter: vorwissen
  - id: vorwissen
    typ: anknuepfen
    text:
      de: 'Schreibe $\frac{25}{100}$ als [[Dezimalzahl]].'
    antwort:
      eingabe:
        { art: zahl, loesung: '0,25', fehler: [{ wert: '2,5', fv: FV.BR.STELLENWERT-DEZIMAL }] }
    weiter: entdecken
    bei: { sonst: M.ZO.BR.DEZIMAL }
  - id: entdecken
    typ: entdecken
    text:
      de: 'Die Tafel ist in 100 gleiche Kästchen geteilt. Jedes Kästchen ist ein [[Hundertstel]] der Tafel. Wie viele Hundertstel sind gefärbt?'
    bild:
      {
        werkzeug: gitter@1,
        parameter:
          { achsen: false, max: 10, figuren: [{ ecken: [[0, 5], [10, 5], [10, 10], [0, 10]] }] },
      }
    antwort:
      eingabe: { art: zahl, loesung: '50', fehler: [{ wert: '5', fv: FV.BR.PROZENT-HUNDERTSTEL }] }
    weiter: erklaeren-hundertstel
  - id: erklaeren-hundertstel
    typ: erklaeren
    text:
      de: '[[Prozent]] heißt „von Hundert“. 1 % ist ein [[Hundertstel]], ein Kästchen der Tafel. 50 % sind $\frac{50}{100}$, also $\frac{1}{2}$ oder 0,5. 100 % sind die ganze Tafel.'
    bild:
      {
        werkzeug: gitter@1,
        parameter:
          { achsen: false, max: 10, figuren: [{ ecken: [[0, 5], [10, 5], [10, 10], [0, 10]] }] },
      }
    weiter: beispiel
  - id: beispiel
    typ: beispiel
    text:
      de: '25 % = $\frac{25}{100}$: 25 Kästchen, ein Viertel der Tafel. Gekürzt ist das $\frac{1}{4}$. Als [[Dezimalzahl]]: 0,25.'
    bild:
      {
        werkzeug: gitter@1,
        parameter:
          { achsen: false, max: 10, figuren: [{ ecken: [[0, 5], [5, 5], [5, 10], [0, 10]] }] },
      }
    weiter: ergaenzen
  - id: ergaenzen
    typ: ergaenzen
    text:
      de: 'Die Tafel zeigt 0,75. Wie viel [[Prozent]] sind das? Zähle die [[Hundertstel]].'
    bild:
      {
        werkzeug: gitter@1,
        parameter:
          {
            achsen: false,
            max: 10,
            figuren: [{ ecken: [[0, 0], [10, 0], [10, 10], [5, 10], [5, 5], [0, 5]] }],
          },
      }
    antwort:
      eingabe:
        { art: zahl, loesung: '75', fehler: [{ wert: '7,5', fv: FV.BR.PROZENT-HUNDERTSTEL }] }
    weiter: gegenbeispiel
    bei: { FV.BR.PROZENT-HUNDERTSTEL: erklaeren-hundertstel }
  - id: gegenbeispiel
    typ: gegenbeispiel
    text:
      de: 'Lena sagt: „0,5 sind 5 %.“ Stimmt das?'
    antwort:
      optionen:
        - { wert: { de: 'Nein, $0{,}5 = \frac{50}{100} = 50$ %.' }, richtig: true }
        - { wert: { de: 'Ja, die 5 bleibt die 5.' }, fv: FV.BR.PROZENT-HUNDERTSTEL }
    weiter: merksatz
    bei: { FV.BR.PROZENT-HUNDERTSTEL: erklaeren-hundertstel }
  - id: merksatz
    typ: merksatz
    text:
      de: '[[Prozent]] zählt [[Hundertstel]]: 50 % = $\frac{1}{2} = 0{,}5$, 25 % = $\frac{1}{4} = 0{,}25$, 100 % = 1.'
    weiter: pruefen
  - id: pruefen
    typ: pruefen
    text:
      de: 'Welcher [[Bruch]] ist 25 %?'
    antwort:
      optionen:
        - { wert: { de: '$\frac{1}{4}$' }, richtig: true }
        - { wert: { de: '$\frac{25}{10}$' }, fv: FV.BR.PROZENT-HUNDERTSTEL }
    weiter: uebergang
    bei: { FV.BR.PROZENT-HUNDERTSTEL: erklaeren-hundertstel }
  - id: uebergang
    typ: uebergang
    text:
      de: 'Prima. Jetzt übst du selbst.'
    vorlagen: [M.ZO.BR.PROZENT.DEZIMAL-ZU-PROZENT, M.ZO.BR.PROZENT.PROZENT-ZU-BRUCH]
    anzahl: 3
herkunft: ki-entwurf
version: 1
