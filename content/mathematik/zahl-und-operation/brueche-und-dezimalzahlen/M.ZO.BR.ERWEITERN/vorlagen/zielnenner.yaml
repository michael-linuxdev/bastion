# „Erweitere 3/4 auf den Nenner 20.“ (INHALTSFORMAT §4.1). Entwurf: noch nicht geprüft.
id: M.ZO.BR.ERWEITERN.ZIELNENNER
kompetenz: M.ZO.BR.ERWEITERN
niveaus: [G, M]
typ: bruch-eingabe
quelle: generator
generator: bruch.erweitern-zielnenner@1
parameter:
  G: { nenner_max: 6, faktor_max: 5 }
  M: { nenner_max: 15, faktor_max: 12 }
antwort:
  form: exakt # Nenner muss genau {zielnenner} sein
text:
  aufgabe:
    de: '**[[Erweitere]]** den [[Bruch]] {bruch} so, dass der [[Nenner]] {zielnenner} ist.'
hilfen:
  - de: 'Mit welcher Zahl musst du den [[Nenner]] malnehmen, um {zielnenner} zu erhalten? Rechne {zielnenner} : {nenner}.'
  - de: 'Multipliziere [[Zähler]] **und** [[Nenner]] mit {faktor}.'
fehlerbilder:
  addiert:
    de: 'Du hast zum [[Zähler]] etwas addiert. Beim [[Erweitern]] wird **multipliziert** – Zähler und [[Nenner]] mit derselben Zahl.'
    fv: FV.BR.ADDITIV
  nur-nenner:
    de: 'Du hast nur den [[Nenner]] verändert. Der [[Zähler]] muss mit derselben Zahl multipliziert werden.'
    fv: FV.BR.NUR-NENNER
  zaehler-falscher-faktor:
    de: 'Der [[Nenner]] stimmt. Prüfe, mit welcher Zahl du den [[Zähler]] multipliziert hast.'
    fv: FV.BR.FAKTOR
# Zwischenschritte nach einem falschen Ergebnis (INHALTSFORMAT §17)
schritte:
  - id: faktor
    frage:
      {
        de: 'Mit welcher Zahl musst du den [[Nenner]] {nenner} multiplizieren, damit {zielnenner} herauskommt?',
      }
    typ: zahl-eingabe
    fehlerbilder:
      differenz:
        de: 'Du hast den Unterschied der [[Nenner]] genommen. Beim [[Erweitern]] wird **multipliziert**: Rechne {zielnenner} : {nenner}.'
        fv: FV.BR.ADDITIV
  - id: ergebnis
    frage:
      {
        de: 'Multipliziere [[Zähler]] und [[Nenner]] von {bruch} mit {faktor}. Wie heißt der erweiterte [[Bruch]]?',
      }
    typ: bruch-eingabe
    fehlerbilder:
      addiert:
        de: 'Du hast zum [[Zähler]] etwas addiert. Auch der Zähler wird **multipliziert**.'
        fv: FV.BR.ADDITIV
      nur-nenner:
        de: 'Du hast nur den [[Nenner]] verändert. Der [[Zähler]] wird mit derselben Zahl multipliziert.'
        fv: FV.BR.NUR-NENNER
      zaehler-falscher-faktor:
        de: 'Der [[Nenner]] stimmt. Nimm für den [[Zähler]] dieselbe Zahl.'
        fv: FV.BR.FAKTOR
herkunft: ki-entwurf
version: 1
