# „Runde 3,476 auf Zehntel.“ Entwurf: noch nicht geprüft.
id: M.ZO.BR.DEZ-ORDNEN.RUNDEN
kompetenz: M.ZO.BR.DEZ-ORDNEN
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: br.dezimal-runden@1
parameter:
  G: { ganz_max: 20, stellen_max: 1 }
  M: { ganz_max: 1000, stellen_max: 2 }
text:
  aufgabe:
    de: '**Runde** {zahl} auf {stelle}.'
hilfen:
  - de: 'Schau auf die [[Ziffer]] direkt rechts von der [[Rundungsstelle]]. Ab 5 wird aufgerundet.'
fehlerbilder:
  abgeschnitten:
    de: 'Du hast die Stellen nur weggelassen. Ist die nächste [[Ziffer]] 5 oder größer, wird aufgerundet.'
  falsche-stelle:
    de: Du hast auf eine andere Stelle gerundet. Lies noch einmal, auf welche Stelle gerundet werden soll.
herkunft: ki-entwurf
version: 1
