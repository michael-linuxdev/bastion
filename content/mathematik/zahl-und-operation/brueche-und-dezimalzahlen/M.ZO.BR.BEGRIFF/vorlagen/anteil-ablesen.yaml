# Bild → Bruch: „Welcher Anteil ist gefärbt?“ Entwurf: noch nicht geprüft.
id: M.ZO.BR.BEGRIFF.ANTEIL-ABLESEN
kompetenz: M.ZO.BR.BEGRIFF
niveaus: [G, M]
typ: bruch-bild
quelle: generator
generator: br.anteil-ablesen@1
parameter:
  G: { nenner_max: 6 }
  M: { nenner_max: 12 }
antwort:
  form: beliebig # 2/4 und 1/2 sind beide richtig
text:
  aufgabe:
    de: '**Gib** als [[Bruch]] **an**: Welcher [[Anteil]] ist gefärbt?'
hilfen:
  - de: 'In wie viele gleich große Teile ist das Ganze geteilt? Das ist der [[Nenner]].'
  - de: 'Wie viele Teile sind gefärbt? Das ist der [[Zähler]].'
fehlerbilder:
  gefaerbt-zu-ungefaerbt:
    de: 'Du hast die gefärbten mit den ungefärbten Teilen verglichen. Der [[Nenner]] zählt **alle** Teile.'
    fv: FV.BR.TEIL-ZU-REST
  ungefaerbter-teil:
    de: 'Das ist der ungefärbte [[Anteil]]. Gefragt ist der gefärbte.'
    fv: FV.BR.GEGENTEIL
herkunft: ki-entwurf
version: 1
