# „Berechne 3/8 + 7/8.“ Entwurf: noch nicht geprüft.
id: M.ZO.BR.ADD-SUB.GLEICHNAMIG
kompetenz: M.ZO.BR.ADD-SUB
niveaus: [G, M]
typ: bruch-eingabe
quelle: generator
generator: br.add-sub@1
parameter:
  G: { art: gleichnamig, nenner_max: 12, unecht: false }
  M: { art: gleichnamig, nenner_max: 20, unecht: true }
antwort:
  form: gekuerzt
text:
  aufgabe:
    de: '**Berechne** und [[kürze]] vollständig: {a} {zeichen} {b}'
hilfen:
  - de: 'Die [[Nenner]] sind gleich. Rechne nur mit den Zählern, der Nenner bleibt.'
  - de: '[[Kürze]] das Ergebnis am Ende.'
fehlerbilder:
  nenner-addiert:
    de: 'Du hast auch die [[Nenner]] zusammengerechnet. Bei gleichen Nennern bleibt der Nenner gleich – es ändert sich nur die Anzahl der Teile.'
    fv: FV.BR.NENNER-ADDIERT
  # Erscheint bei gleichen Nennern nie (br.add-sub@1 erzeugt es nur bei verschiedenen Nennern),
  # muss aber stehen, weil der Generator das Fehlerbild kennt (INHALTSFORMAT §10.1).
  nicht-erweitert:
    de: '[[Erweitern]] musst du hier nicht – die [[Nenner]] sind schon gleich.'
    fv: FV.BR.NUR-NENNER
# Zwischenschritte nach einem falschen Ergebnis (INHALTSFORMAT §17). Gemeinsamer Nenner und
# Erweitern entfallen: die Nenner sind schon gleich.
schritte:
  - id: rechnen
    frage:
      de: 'Die [[Nenner]] sind gleich. Rechne {a} {zeichen} {b}, ohne zu [[kürzen]].'
    typ: bruch-eingabe
    fehlerbilder:
      nenner-addiert:
        de: 'Du hast auch die [[Nenner]] addiert. Der Nenner bleibt gleich, nur die [[Zähler]] werden verrechnet.'
        fv: FV.BR.NENNER-ADDIERT
  - id: kuerzen
    frage:
      de: '[[Kürze]] {rechnen} vollständig. Geht es nicht, schreibe den [[Bruch]] noch einmal hin.'
    typ: bruch-eingabe
    fehlerbilder:
      nicht-vollstaendig:
        de: 'Du hast [[gekürzt]], aber noch nicht vollständig. [[Zähler]] und [[Nenner]] haben noch einen [[gemeinsamen Teiler]].'
        fv: FV.BR.NICHT-VOLLSTAENDIG
herkunft: ki-entwurf
version: 1
review:
