# „Berechne 2/3 von 27 km.“ Entwurf: noch nicht geprüft.
id: M.ZO.BR.ANTEIL-VON.ALLGEMEIN
kompetenz: M.ZO.BR.ANTEIL-VON
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: br.anteil-von@1
parameter:
  G: { stammbruch: false, nenner_max: 6, ganzes_max: 60 }
  M: { stammbruch: false, nenner_max: 12, ganzes_max: 1000 }
text:
  aufgabe:
    de: '**Berechne** {anteil} von {ganzes} {einheit}.'
hilfen:
  - de: 'Teile {ganzes} durch den [[Nenner]] – so groß ist ein Teil.'
  - de: 'Multipliziere dann mit dem [[Zähler]] – so viele Teile sind gemeint.'
fehlerbilder:
  nur-geteilt:
    de: 'Du hast nur durch den [[Nenner]] geteilt. Multipliziere noch mit dem [[Zähler]].'
  nur-mit-zaehler-mal:
    de: 'Du hast nur mit dem [[Zähler]] multipliziert. Teile zuerst durch den [[Nenner]].'
  zaehler-nenner-vertauscht:
    de: 'Du hast mit dem [[Nenner]] multipliziert. Durch den Nenner wird geteilt.'
herkunft: ki-entwurf
version: 1
