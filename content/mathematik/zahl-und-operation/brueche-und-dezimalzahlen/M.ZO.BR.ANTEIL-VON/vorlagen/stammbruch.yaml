  nur-mit-zaehler-mal:
    de: Du hast nur mit dem Zähler multipliziert. Teile zuerst durch den Nenner.
  zaehler-nenner-vertauscht:
    de: Du hast mit dem Nenner multipliziert. Durch den Nenner wird geteilt.
herkunft: ki-entwurf
version: 1
