# „Berechne 1,5 + 0,4 · 3.“ Entwurf: noch nicht geprüft.
id: M.ZO.BR.RECHENGESETZE.DEZIMAL
kompetenz: M.ZO.BR.RECHENGESETZE
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: br.term-dezimal@1
parameter:
  G: { arten: [punkt-vor-strich, quadrat], zehntel_max: 50 }
  M: { arten: [punkt-vor-strich, klammer, quadrat], zehntel_max: 99 }
text:
  aufgabe:
    de: '**Berechne**: {term}'
hilfen:
  - de: 'Was in Klammern steht, rechnest du zuerst. Dann gilt [[Punkt vor Strich]].'
  - de: 'Hoch 2 heißt: die Zahl mal sich selbst.'
fehlerbilder:
  links-nach-rechts:
    de: 'Du hast von links nach rechts gerechnet. Es gilt [[Punkt vor Strich]] – erst das Malnehmen.'
    fv: FV.NZ.PUNKT-VOR-STRICH
  klammer-uebersehen:
    de: Du hast die Klammer übersehen. Was in der Klammer steht, wird zuerst gerechnet.
    fv: FV.NZ.KLAMMER
  quadrat-mal-zwei:
    de: 'Du hast mit 2 malgenommen. Hoch 2 heißt: die Zahl mal sich selbst.'
    fv: FV.NZ.QUADRAT-MAL-ZWEI
  quadrat-komma:
    de: 'Das Komma steht falsch. Beim Malnehmen zählst du die [[Nachkommastellen]] beider Zahlen zusammen.'
    fv: FV.BR.KOMMA-MAL
herkunft: ki-entwurf
version: 1
