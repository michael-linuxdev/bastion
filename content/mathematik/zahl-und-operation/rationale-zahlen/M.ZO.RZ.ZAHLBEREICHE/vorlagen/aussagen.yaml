# „Stimmt die Aussage? Jede ganze Zahl ist eine rationale Zahl.“ Entwurf: noch nicht geprüft.
id: M.ZO.RZ.ZAHLBEREICHE.AUSSAGEN
kompetenz: M.ZO.RZ.ZAHLBEREICHE
niveaus: [G, M]
typ: auswahl
quelle: generator
generator: rz.zahlbereich-aussage@1
parameter:
  G: { mengen: false }
  M: { mengen: true }
text:
  aufgabe:
    de: '**Entscheide**: Stimmt die Aussage? „{aussage}“'
hilfen:
  - de: 'Die [[natürlichen Zahlen]] stecken in den [[ganzen Zahlen]], die ganzen in den [[rationalen Zahlen]].'
  - de: 'Eine Aussage über „jede Zahl“ stimmt nicht, wenn du ein einziges [[Gegenbeispiel]] findest.'
  - de: 'Die Schnittmenge enthält nur, was in beiden Mengen liegt. Die Vereinigungsmenge enthält alles aus beiden.'
fehlerbilder:
  falsch-geglaubt:
    de: 'Die Aussage stimmt. Suche ein [[Gegenbeispiel]] – du wirst keines finden.'
  teilmenge-verdreht:
    de: 'Es ist umgekehrt: −3 ist eine [[ganze Zahl]], aber keine [[natürliche Zahl]]; 1/2 ist eine [[rationale Zahl]], aber keine ganze. Ein [[Gegenbeispiel]] genügt.'
  negativ-gebrochen:
    de: 'Die [[gebrochenen Zahlen]] haben kein Minus. −1/2 ist eine [[rationale Zahl]], aber keine gebrochene.'
  kleinste-zahl:
    de: 'Zu jeder Zahl gibt es eine noch kleinere: Zieh einfach 1 ab. Eine kleinste [[rationale Zahl]] gibt es nicht.'
  zwischen-ganzen:
    de: 'Zwischen zwei [[ganzen Zahlen]] liegen unendlich viele [[rationale Zahlen]], zum Beispiel −1,5 zwischen −2 und −1.'
  schnitt-vereinigung:
    de: 'In der Schnittmenge liegt nur, was in **beiden** Mengen ist; die Vereinigungsmenge enthält alles aus beiden. Prüfe die Aussage mit Beispielen wie −2, 0, 3 und 1/2.'
herkunft: ki-entwurf
version: 1
