# „Gib die Gegenzahl von −7 an.“ / „Gib den Betrag von −2,5 an.“ Entwurf: noch nicht geprüft.
id: M.ZO.RZ.BEGRIFF.GEGENZAHL-BETRAG
kompetenz: M.ZO.RZ.BEGRIFF
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: rz.gegenzahl-betrag@1
parameter:
  G: { dezimal: false, max: 20 }
  M: { dezimal: true, max: 50 }
text:
  aufgabe:
    de: '**Gib** {was} von {zahl} **an**.'
hilfen:
  - de: 'Die [[Gegenzahl]] liegt auf der anderen Seite der 0, gleich weit weg: aus 5 wird −5, aus −5 wird 5.'
  - de: 'Der [[Betrag]] ist der Abstand zur 0. Er hat nie ein Minus: |−5| = 5.'
fehlerbilder:
  zahl-selbst:
    de: 'Das ist die Zahl selbst. Gefragt ist eine andere Zahl – lies die Aufgabe noch einmal.'
  betrag-statt-gegenzahl:
    de: 'Das ist der [[Betrag]]. Die [[Gegenzahl]] hat das andere [[Vorzeichen]]: Die Gegenzahl von 5 ist −5.'
  gegenzahl-statt-betrag:
    de: 'Das ist die [[Gegenzahl]]. Der [[Betrag]] ist der Abstand zur 0 und nie negativ.'
herkunft: ki-entwurf
version: 1
