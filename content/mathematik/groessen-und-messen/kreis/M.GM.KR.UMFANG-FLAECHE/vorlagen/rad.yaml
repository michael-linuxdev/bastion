# Sachaufgabe: Rad rollt. Entwurf: noch nicht geprüft.
id: M.GM.KR.UMFANG-FLAECHE.RAD
kompetenz: M.GM.KR.UMFANG-FLAECHE
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: kr.sach@1
parameter:
  G: { umkehr: false }
  M: { umkehr: true }
text:
  aufgabe:
    de: '**Rechne** mit [[π]] ≈ 3,14: {aufgabe}'
hilfen:
  - de: 'Bei einer Umdrehung rollt das Rad genau seinen [[Umfang]] ab.'
  - de: '100 cm sind 1 m.'
fehlerbilder:
  radius-durchmesser:
    de: 'Der [[Umfang]] ist [[π]] · d – mit dem [[Durchmesser]], nicht 2 · π · d.'
    fv: FV.KR.RADIUS-DURCHMESSER
  einheit-vergessen:
    de: 'Achte auf die Einheiten: Der [[Durchmesser]] ist in cm, die Strecke in m. Rechne vorher um.'
    fv: FV.GR.EINHEITEN-MISCHEN
herkunft: ki-entwurf
version: 1
