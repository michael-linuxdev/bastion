# Flächeninhalt einer Hausfigur aus Rechteck und Dreieck. Entwurf: noch nicht geprüft.
id: M.GM.FL.VIERECKE.ZERLEGT
kompetenz: M.GM.FL.VIERECKE
niveaus: [G, M]
typ: bild-zahl
quelle: generator
