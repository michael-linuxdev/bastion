# Flächeninhalt einer L-förmigen Figur. Entwurf: noch nicht geprüft.
id: M.GM.FL.ZUSAMMENGESETZT.FLAECHE
kompetenz: M.GM.FL.ZUSAMMENGESETZT
niveaus: [G, M]
typ: bild-zahl
quelle: generator
generator: fl.zusammengesetzt@1
parameter:
  G: { gesucht: flaeche, alle_masse: true, max: 12 }
  M: { gesucht: flaeche, alle_masse: false, max: 30 }
text:
  aufgabe:
    de: '**Berechne** den [[Flächeninhalt]] der Figur in {einheit}.'
hilfen:
  - de: Zerlege die Figur mit einer Linie in zwei Rechtecke – oder ergänze sie zu einem großen Rechteck.
  - de: Berechne jedes Rechteck einzeln. Beim Ergänzen ziehst du das fehlende Stück ab.
fehlerbilder:
  aussen-multipliziert:
    de: Du hast das große Rechteck berechnet. Ein Stück fehlt aber – das musst du abziehen.
  addiert-statt-abgezogen:
    de: Das fehlende Rechteck gehört nicht zur Figur. Ziehe es ab, statt es dazuzuzählen.
  einschnitt-vergessen:
    de: 'Das ist ein [[Umfang]], und dabei fehlen noch Seiten. Gesucht ist der [[Flächeninhalt]].'
  flaeche-statt-umfang:
    de: 'Prüfe, ob du den [[Flächeninhalt]] in [[Quadrateinheiten]] berechnet hast.'
herkunft: ki-entwurf
version: 1
