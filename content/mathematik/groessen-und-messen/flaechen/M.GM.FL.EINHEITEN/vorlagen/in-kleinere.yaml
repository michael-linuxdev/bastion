# „Rechne um: 3 m² = ? dm²“. Entwurf: noch nicht geprüft.
id: M.GM.FL.EINHEITEN.IN-KLEINERE
kompetenz: M.GM.FL.EINHEITEN
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: gr.einheiten-umrechnen@1
parameter:
  G: { groessen: [flaeche], richtung: in-kleinere, sprung_max: 1, dezimal: false }
  M: { groessen: [flaeche], richtung: in-kleinere, sprung_max: 2, dezimal: true }
text:
  aufgabe:
    de: '**Rechne um**: {wert} {von} = ? {nach}'
hilfen:
  - de: In eine kleinere Einheit umrechnen heißt multiplizieren – die Zahl wird größer.
  - de: 'Bei [[Flächeneinheiten]] ist die [[Umrechnungszahl]] 100: 1 m² = 100 dm², 1 ha = 100 a.'
fehlerbilder:
  falsche-richtung:
    de: Du hast geteilt statt multipliziert. Kleinere Einheit heißt mehr Stück – die Zahl muss größer werden.
  falsche-umrechnungszahl:
    de: 'Du hast wie bei Längen mit 10 gerechnet. Ein Quadrat mit 1 m Seite enthält 10 · 10 = 100 Quadrate mit 1 dm Seite.'
herkunft: ki-entwurf
version: 1
