# Flächeninhalt durch Zerlegen. Entwurf: noch nicht geprüft.
id: M.GM.FL.VIELECKE.ZERLEGEN
kompetenz: M.GM.FL.VIELECKE
niveaus: [G, M]
typ: bild-zahl
quelle: generator
generator: fl.vieleck-zerlegen@1
parameter:
  G: { zwei_dreiecke: false }
  M: { zwei_dreiecke: true }
text:
  aufgabe:
    de: '**Berechne** den [[Flächeninhalt]] der Figur in cm². Die gestrichelten Linien zeigen eine Zerlegung.'
hilfen:
  - de: 'Berechne jedes Teil einzeln: Rechteck = Breite · [[Höhe]], Dreieck = Grundseite · [[Höhe]] : 2.'
  - de: 'Zähle am Ende alle Teile zusammen.'
fehlerbilder:
  dreieck-nicht-halbiert:
    de: 'Beim Dreieck musst du noch durch 2 teilen: Grundseite · [[Höhe]] : 2.'
    fv: FV.FL.NICHT-HALBIERT
  dreieck-vergessen:
    de: 'Das ist nur das Rechteck. Die Dreiecke gehören auch zur Figur.'
    fv: FV.FL.ZERLEGEN
  umfang-statt-flaeche:
    de: 'Du hast die Seiten zusammengezählt – das wäre der [[Umfang]]. Gefragt ist der [[Flächeninhalt]].'
    fv: FV.FL.UMFANG-FLAECHE
herkunft: ki-entwurf
version: 1
