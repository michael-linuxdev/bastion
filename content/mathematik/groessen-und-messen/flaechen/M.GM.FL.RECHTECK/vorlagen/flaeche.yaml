# Flächeninhalt eines Rechtecks oder Quadrats. Entwurf: noch nicht geprüft.
id: M.GM.FL.RECHTECK.FLAECHE
kompetenz: M.GM.FL.RECHTECK
niveaus: [G, M]
typ: bild-zahl
quelle: generator
generator: fl.rechteck@1
parameter:
  G: { gesucht: flaeche, max: 12, einheiten: [cm, m] }
  M: { gesucht: flaeche, max: 60, einheiten: [mm, cm, dm, m] }
text:
  aufgabe:
    de: '{angabe} **Berechne** den [[Flächeninhalt]] in {einheit}.'
hilfen:
  - de: 'Wie viele [[Einheitsquadrate]] passen in eine Reihe, und wie viele Reihen gibt es?'
  - de: '[[Flächeninhalt]] = Länge mal Breite.'
fehlerbilder:
  umfang-flaeche-verwechselt:
    de: 'Das ist der [[Umfang]]. Für den [[Flächeninhalt]] multiplizierst du Länge und Breite.'
  addiert:
    de: 'Du hast Länge und Breite addiert. Für den [[Flächeninhalt]] wird multipliziert.'
  nur-zwei-seiten:
    de: 'Du hast nur zwei Seiten addiert. Für den [[Flächeninhalt]] wird multipliziert.'
herkunft: ki-entwurf
version: 1
