# Flächeninhalt eines Rechtecks oder Quadrats. Entwurf: noch nicht geprüft.
id: M.GM.FL.RECHTECK.FLAECHE
kompetenz: M.GM.FL.RECHTECK
niveaus: [G, M]
typ: bild-zahl
