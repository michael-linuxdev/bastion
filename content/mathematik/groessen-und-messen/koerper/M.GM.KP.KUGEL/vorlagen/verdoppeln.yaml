# „Radius verdoppelt: Wie ändert sich das Volumen?“ – Niveau E. Entwurf: noch nicht geprüft.
id: M.GM.KP.KUGEL.VERDOPPELN
kompetenz: M.GM.KP.KUGEL
niveaus: [E]
typ: auswahl
quelle: generator
generator: kp.verdoppeln@2
parameter:
  E: {}
text:
  aufgabe:
    de: 'Der [[Radius]] einer Kugel wird {faktor}-mal so groß. **Wie** ändert sich ihre {groesse}?'
hilfen:
  - de: 'Setze in die [[Formel]] $k \cdot r$ statt r ein und vereinfache.'
  - de: '[[Volumen]]: r hoch 3. [[Oberfläche]]: r hoch 2.'
fehlerbilder:
