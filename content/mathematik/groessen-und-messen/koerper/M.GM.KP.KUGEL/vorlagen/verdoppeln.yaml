  quadratisch:
    de: 'Beim [[Volumen]] steht $r^3$. Der [[Faktor]] wird also hoch 3 genommen.'
    fv: FV.KP.HOCHZAHL-FORMEL
  kubisch-statt-quadratisch:
    de: 'Bei der [[Oberfläche]] steht $r^2$. Der [[Faktor]] wird also hoch 2 genommen.'
    fv: FV.KP.HOCHZAHL-FORMEL
  summe:
    de: 'Der [[Faktor]] wird nicht verdoppelt, sondern hoch 2 oder hoch 3 genommen.'
    fv: FV.KP.HOCHZAHL-FORMEL
