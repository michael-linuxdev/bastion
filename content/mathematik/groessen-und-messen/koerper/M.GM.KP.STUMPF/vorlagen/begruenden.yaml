# Anteil des Stumpfs am Volumen – Niveau E. Entwurf: noch nicht geprüft.
id: M.GM.KP.STUMPF.BEGRUENDEN
kompetenz: M.GM.KP.STUMPF
niveaus: [E]
typ: auswahl
