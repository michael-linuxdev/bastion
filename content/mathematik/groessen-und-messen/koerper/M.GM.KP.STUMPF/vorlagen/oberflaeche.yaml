# Oberfläche des quadratischen Pyramidenstumpfs. Entwurf: noch nicht geprüft.
id: M.GM.KP.STUMPF.OBERFLAECHE
kompetenz: M.GM.KP.STUMPF
niveaus: [M]
typ: zahl-eingabe
quelle: generator
generator: kp.stumpf-oberflaeche@1
parameter:
  M: {}
text:
  aufgabe:
    de: 'Ein [[Pyramidenstumpf]] hat eine quadratische [[Grundfläche]] mit der [[Kante]] {a} cm und eine quadratische [[Deckfläche]] mit der Kante {ad} cm. Die [[Höhe]] jedes Seitentrapezes ist {hs} cm. **Berechne** die [[Oberfläche]] in cm².'
hilfen:
  - de: 'Zur [[Oberfläche]] gehören [[Grundfläche]], [[Deckfläche]] und vier gleiche Seitenflächen. Jede ist ein [[Trapez]].'
  - de: 'Ein [[Trapez]]: $\frac{a + c}{2} \cdot h$.'
fehlerbilder:
  deckflaeche:
    de: 'Der Stumpf hat oben eine [[Deckfläche]]. Zähle sie zur [[Oberfläche]] dazu.'
    fv: FV.KP.FLAECHEN-VERGESSEN
  mantel:
    de: 'Das ist nur der [[Mantel]]. [[Grundfläche]] und [[Deckfläche]] fehlen noch.'
    fv: FV.KP.FLAECHEN-VERGESSEN
  halbiert:
    de: 'Beim [[Trapez]] wird die [[Summe]] der parallelen Seiten halbiert.'
    fv: FV.FL.NICHT-HALBIERT
herkunft: ki-entwurf
version: 1
