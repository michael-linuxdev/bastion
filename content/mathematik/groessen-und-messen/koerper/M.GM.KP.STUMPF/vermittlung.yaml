id: M.GM.KP.STUMPF
kompetenz: M.GM.KP.STUMPF
niveau: G
dauer_min: 10
schritte:
  - id: ziel
    typ: ziel
    text:
      de: 'Danach berechnest du das [[Volumen]] eines [[Pyramidenstumpfs]].'
    weiter: vorwissen
  - id: vorwissen
    typ: anknuepfen
    text:
      de: 'Eine [[Pyramide]] hat die [[Grundfläche]] 36 cm² und die [[Höhe]] 10 cm. Wie groß ist ihr [[Volumen]] in cm³?'
    antwort:
      eingabe: { art: zahl, loesung: '120', fehler: [{ wert: '360', fv: FV.KP.PYRAMIDE-DRITTEL }] }
    weiter: entdecken
    bei: { FV.KP.PYRAMIDE-DRITTEL: M.GM.KP.ZUSAMMENGESETZT, sonst: M.GM.KP.ZUSAMMENGESETZT }
  - id: entdecken
    typ: entdecken
    text:
      de: 'Ein Turmdach wird oben flach abgeschnitten. Wie bekommst du das [[Volumen]] des Rests?'
    antwort:
      optionen:
        - { wert: { de: 'Große Pyramide minus abgeschnittene Spitze' }, richtig: true }
        - { wert: { de: 'Grundfläche mal Höhe des Rests' }, fv: FV.KP.STUMPF-PRISMA }
    weiter: erklaeren-differenz
  - id: erklaeren-differenz
    typ: erklaeren
    text:
      de: 'Ein [[Pyramidenstumpf]] ist eine [[Pyramide]] ohne Spitze. Sein [[Volumen]] ist das Volumen der ganzen Pyramide minus das Volumen der Spitze. Er ist kein [[Prisma]], denn er wird nach oben schmaler.'
    weiter: beispiel
  - id: beispiel
    typ: beispiel
    text:
      de: 'Ganze [[Pyramide]]: [[Kante]] 6 cm, [[Höhe]] 9 cm, also $V_1 = \frac{1}{3} \cdot 36 \cdot 9 = 108$ cm³. Spitze: Kante 2 cm, Höhe 3 cm, $V_2 = 4$ cm³. Stumpf: $108 - 4 = 104$ cm³.'
    weiter: ergaenzen
  - id: ergaenzen
    typ: ergaenzen
    text:
      de: 'Die ganze [[Pyramide]] hat 200 cm³, die abgeschnittene Spitze 25 cm³. Wie groß ist das [[Volumen]] des Stumpfs in cm³?'
    antwort:
      eingabe: { art: zahl, loesung: '175', fehler: [{ wert: '225', fv: FV.KP.TEIL-VERGESSEN }] }
    weiter: gegenbeispiel
  - id: gegenbeispiel
    typ: gegenbeispiel
    text:
      de: 'Tom rechnet beim Stumpf: [[Grundfläche]] 36 cm² mal [[Höhe]] 6 cm = 216 cm³. Stimmt das?'
    antwort:
      optionen:
        - {
            wert: { de: 'Nein. G · h gilt für ein Prisma, der Stumpf ist kleiner.' },
            richtig: true,
          }
        - { wert: { de: 'Ja, Volumen ist immer Grundfläche mal Höhe.' }, fv: FV.KP.STUMPF-PRISMA }
    weiter: merksatz
    bei: { FV.KP.STUMPF-PRISMA: erklaeren-differenz }
  - id: merksatz
    typ: merksatz
    text:
      de: '[[Volumen]] des [[Pyramidenstumpfs]] = Volumen der ganzen [[Pyramide]] minus Volumen der Spitze. Es gibt auch eine [[Formel]]: $V = \frac{h}{3} \cdot (G + \sqrt{G \cdot D} + D)$.'
    weiter: pruefen
  - id: pruefen
    typ: pruefen
    text:
      de: 'Ganze [[Pyramide]] 90 cm³, Spitze 10 cm³. Wie viel cm³ hat der Stumpf?'
    antwort:
      optionen:
        - { wert: { de: '80 cm³' }, richtig: true }
        - { wert: { de: '100 cm³' }, fv: FV.KP.TEIL-VERGESSEN }
        - { wert: { de: '240 cm³' }, fv: FV.KP.PYRAMIDE-DRITTEL }
    weiter: uebergang
  - id: uebergang
    typ: uebergang
    text:
      de: 'Gut. Jetzt berechnest du selbst Stümpfe.'
    vorlagen: [M.GM.KP.STUMPF.DIFFERENZ]
    anzahl: 3
herkunft: ki-entwurf
version: 1
