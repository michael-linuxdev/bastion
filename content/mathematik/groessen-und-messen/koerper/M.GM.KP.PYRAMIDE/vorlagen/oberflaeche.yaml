# Oberfläche von Pyramiden. Entwurf: noch nicht geprüft.
id: M.GM.KP.PYRAMIDE.OBERFLAECHE
kompetenz: M.GM.KP.PYRAMIDE
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: kp.pyramide-oberflaeche@1
parameter:
  G: { rechteckig: false }
  M: { rechteckig: true }
text:
  aufgabe:
    de: '{aufgabe}'
