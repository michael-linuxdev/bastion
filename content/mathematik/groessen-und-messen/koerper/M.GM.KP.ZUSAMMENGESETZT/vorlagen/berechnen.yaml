  halbkugel-ganz:
    de: 'Oben liegt nur eine Halbkugel. Nimm die Hälfte des Kugelvolumens.'
    fv: FV.KP.TEIL-VERGESSEN
  drittel-vergessen:
    de: 'Kegel und [[Pyramide]] haben nur ein Drittel des [[Volumens]] von [[Zylinder]] und [[Prisma]].'
    fv: FV.KP.DRITTEL
herkunft: ki-entwurf
version: 1
