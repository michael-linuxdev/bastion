# Mantellinie, Volumen, Mantel, Oberfläche eines Kegels. Entwurf: noch nicht geprüft.
id: M.GM.KP.KEGEL.BERECHNEN
kompetenz: M.GM.KP.KEGEL
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: kp.kegel@1
parameter:
  G: { erweitert: false }
  M: { erweitert: true }
text:
  aufgabe:
    de: '**Rechne** mit [[π]] ≈ 3,14: {angabe} **Berechne** {gesucht} in {einheit}. Runde auf eine [[Nachkommastelle]].'
hilfen:
  - de: '[[Volumen]]: $V = \frac{1}{3} \cdot \pi \cdot r^2 \cdot h$. Mantellinie: $s^2 = r^2 + h^2$.'
  - de: '[[Mantel]]: $M = \pi \cdot r \cdot s$. [[Oberfläche]]: Grundkreis plus Mantel.'
fehlerbilder:
  drittel-vergessen:
    de: 'Das ist das [[Volumen]] eines [[Zylinders]]. Der Kegel hat nur ein Drittel davon.'
    fv: FV.KP.DRITTEL
  durchmesser:
    de: 'Du hast mit dem [[Durchmesser]] statt dem [[Radius]] gerechnet.'
    fv: FV.KR.RADIUS-DURCHMESSER
  hoehe-statt-mantellinie:
    de: 'Für den [[Mantel]] brauchst du die Mantellinie s, nicht die [[Höhe]] h. Berechne erst s mit dem Satz des Pythagoras.'
    fv: FV.KP.HOEHE-MANTELLINIE
  grundflaeche-vergessen:
    de: 'Das ist nur der [[Mantel]]. Zur [[Oberfläche]] gehört auch der Grundkreis.'
    fv: FV.KP.GRUNDKREIS-VERGESSEN
herkunft: ki-entwurf
version: 1
