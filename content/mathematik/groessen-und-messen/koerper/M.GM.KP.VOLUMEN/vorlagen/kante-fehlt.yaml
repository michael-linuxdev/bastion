# Höhe eines Quaders aus dem Volumen. Entwurf: noch nicht geprüft.
id: M.GM.KP.VOLUMEN.KANTE-FEHLT
kompetenz: M.GM.KP.VOLUMEN
niveaus: [M]
typ: zahl-eingabe
quelle: generator
generator: kp.kante-fehlt@1
parameter:
  M: { max: 15 }
text:
  aufgabe:
    de: '{angabe} **Berechne**, wie hoch er ist (in {einheit}).'
hilfen:
  - de: 'Berechne zuerst die [[Grundfläche]] aus Breite und Tiefe.'
  - de: '[[Volumen]] = [[Grundfläche]] · Höhe. Also ist die Höhe = Volumen : Grundfläche.'
fehlerbilder:
  nur-durch-eine-kante:
    de: 'Du hast nur durch eine [[Kante]] geteilt. Teile durch die [[Grundfläche]], also durch Breite mal Tiefe.'
  subtrahiert:
    de: 'Beim [[Volumen]] wird multipliziert. Rückwärts musst du deshalb teilen, nicht abziehen.'
herkunft: ki-entwurf
version: 1
