# Masse eines Quaders bzw. Prismas aus Maßen und Dichte. Entwurf: noch nicht geprüft.
id: M.GM.KP.MASSE.KOERPER
kompetenz: M.GM.KP.MASSE
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: kp.masse-koerper@1
parameter:
  G: { prisma: false }
  M: { prisma: true }
text:
  aufgabe:
    de: '{aufgabe}'
hilfen:
  - de: 'Berechne zuerst das [[Volumen]] des Körpers, dann die Masse: m = [[Dichte]] · V.'
  - de: '[[Volumen]] eines [[Prismas]]: [[Grundfläche]] · Länge. Ein rechtwinkliges Dreieck hat den [[Flächeninhalt]] Kathete · Kathete : 2.'
fehlerbilder:
  dichte-vergessen:
    de: 'Das ist das [[Volumen]]. Für die Masse nimmst du noch mit der [[Dichte]] mal.'
  dreieck-nicht-halbiert:
    de: 'Die [[Grundfläche]] ist ein Dreieck – also ein halbes Rechteck. Teile noch durch 2.'
herkunft: ki-entwurf
version: 1
