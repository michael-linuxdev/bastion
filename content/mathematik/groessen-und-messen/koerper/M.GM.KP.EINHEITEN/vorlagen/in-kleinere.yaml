# „Rechne um: 4 dm³ = ? cm³“. Entwurf: noch nicht geprüft.
id: M.GM.KP.EINHEITEN.IN-KLEINERE
kompetenz: M.GM.KP.EINHEITEN
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: gr.einheiten-umrechnen@1
parameter:
  G: { groessen: [volumen, hohlmass], richtung: in-kleinere, sprung_max: 1, dezimal: false }
  M: { groessen: [volumen, hohlmass], richtung: in-kleinere, sprung_max: 2, dezimal: true }
text:
  aufgabe:
    de: '**Rechne um**: {wert} {von} = ? {nach}'
hilfen:
  - de: In eine kleinere Einheit umrechnen heißt multiplizieren – die Zahl wird größer.
  - de: 'Bei Volumeneinheiten ist die Umrechnungszahl 1000: 1 dm³ = 1000 cm³. Und 1 l = 1000 ml.'
fehlerbilder:
  falsche-richtung:
    de: Du hast geteilt statt multipliziert. Kleinere Einheit heißt mehr Stück – die Zahl muss größer werden.
  falsche-umrechnungszahl:
    de: 'Die Umrechnungszahl stimmt nicht. Ein Würfel mit 1 dm Kante enthält 10 · 10 · 10 = 1000 Würfel mit 1 cm Kante; 1 l sind 1000 ml.'
herkunft: ki-entwurf
version: 1
