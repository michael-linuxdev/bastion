# Sachaufgabe Wegstrecke mit km und m. Entwurf: noch nicht geprüft.
id: M.GM.GR.SACH.WEG
kompetenz: M.GM.GR.SACH
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: gr.sach-weg@1
parameter:
  G: { km_max: 10 }
  M: { km_max: 50 }
text:
  aufgabe:
    de: '{geschichte} **Gib** das Ergebnis in km **an**.'
hilfen:
  - de: '„Hin und zurück“ heißt: die Strecke zweimal.'
  - de: Rechne alle Angaben in dieselbe Einheit um, bevor du addierst.
fehlerbilder:
  einheiten-nicht-umgerechnet:
    de: Du hast km und m addiert, ohne umzurechnen. Rechne zuerst alles in km um.
  nur-einfache-strecke:
    de: Der Weg wird hin **und** zurück gefahren – also zweimal.
herkunft: ki-entwurf
version: 1
