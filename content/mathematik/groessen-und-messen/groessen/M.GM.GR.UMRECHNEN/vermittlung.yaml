id: M.GM.GR.UMRECHNEN
kompetenz: M.GM.GR.UMRECHNEN
niveau: G
dauer_min: 12
schritte:
  - id: ziel
    typ: ziel
    text:
      de: 'Danach kannst du Längen, Gewichte, Geld und Zeiten in eine andere Einheit umrechnen, zum Beispiel 3 m in cm oder 2 min in s.'
    weiter: vorwissen
  - id: vorwissen
    typ: anknuepfen
    text:
      de: 'Was ergibt 7 · 100?'
    antwort:
      eingabe: { art: zahl, loesung: '700' }
    weiter: entdecken
    bei: { sonst: M.ZO.NZ.STELLENWERT }
  - id: entdecken
    typ: entdecken
    text:
      de: 'Ein Brett ist 3 m lang. In der Tafel steht die 3 unter m. Tippe auf cm. Wie viele Zentimeter sind das?'
    werkzeug: { id: einheitentafel@1, parameter: { wert: 3, einheit: m, einheiten: [m, dm, cm] } }
    antwort:
      eingabe:
        {
          art: zahl,
          loesung: '300',
          fehler:
            [
              { wert: '30', fv: FV.GR.UMRECHNUNGSZAHL },
              { wert: '0,03', fv: FV.GR.UMRECHNEN-RICHTUNG },
            ],
        }
    weiter: erklaeren-umrechnen
    bei: { FV.GR.UMRECHNUNGSZAHL: erklaeren-umrechnungszahlen }
  - id: erklaeren-umrechnen
    typ: erklaeren
    text:
      de: 'Von der großen in die kleine Einheit wird die Zahl größer: Du multiplizierst. Von der kleinen in die große wird sie kleiner: Du teilst. In der Tafel bleiben die [[Ziffern]] stehen, nur das Komma rückt.'
    bild:
      {
        werkzeug: einheitentafel@1,
        parameter: { groesse: masse, wert: 2500, einheit: g, einheiten: [kg, g], ziel: kg },
      }
    weiter: erklaeren-umrechnungszahlen
  - id: erklaeren-umrechnungszahlen
    typ: erklaeren
    text:
      de: 'Die [[Umrechnungszahl]] hängt von den Einheiten ab: 1 km = 1000 m, 1 m = 10 dm = 100 cm, 1 cm = 10 mm. 1 kg = 1000 g, 1 t = 1000 kg. 1 € = 100 ct.'
    bild: { werkzeug: einheitentafel@1, parameter: { wert: 1, einheit: km, ziel: m } }
    weiter: erklaeren-zeit
  - id: erklaeren-zeit
    typ: erklaeren
    text:
      de: 'Bei der Zeit sind die [[Umrechnungszahlen]] anders: 1 min = 60 s, 1 h = 60 min, 1 d = 24 h. Sonst rechnest du genauso: 2 min = 2 · 60 s = 120 s.'
    weiter: beispiel
  - id: beispiel
    typ: beispiel
    text:
      de: '4 km in m: groß nach klein, also mal 1000: 4000 m. 2500 g in kg: klein nach groß, also durch 1000: 2,5 kg.'
    bild:
      {
        werkzeug: einheitentafel@1,
        parameter: { wert: 4, einheit: km, einheiten: [km, m], ziel: m },
      }
    weiter: ergaenzen
  - id: ergaenzen
    typ: ergaenzen
    text:
      de: 'Rechne um: 6 cm = ? mm'
    bild:
      {
        werkzeug: einheitentafel@1,
        parameter: { wert: 6, einheit: cm, einheiten: [m, dm, cm, mm] },
      }
    antwort:
      eingabe:
        {
          art: zahl,
          loesung: '60',
          fehler:
            [
              { wert: '600', fv: FV.GR.UMRECHNUNGSZAHL },
              { wert: '0,6', fv: FV.GR.UMRECHNEN-RICHTUNG },
            ],
        }
    weiter: gegenbeispiel
    bei:
      {
        FV.GR.UMRECHNUNGSZAHL: erklaeren-umrechnungszahlen,
        FV.GR.UMRECHNEN-RICHTUNG: erklaeren-umrechnen,
      }
  - id: gegenbeispiel
    typ: gegenbeispiel
    text:
      de: 'Lena rechnet 5000 m in km um und schreibt 5 000 000 km. Stimmt das? Schau, wo die 5 in der Tafel steht.'
    bild: { werkzeug: einheitentafel@1, parameter: { wert: 5000, einheit: m, einheiten: [km, m] } }
    antwort:
      optionen:
        - { wert: { de: 'Nein, klein nach groß heißt teilen: 5 km.' }, richtig: true }
        - { wert: { de: 'Ja.' }, fv: FV.GR.UMRECHNEN-RICHTUNG }
    weiter: merksatz
    bei: { FV.GR.UMRECHNEN-RICHTUNG: erklaeren-umrechnen }
  - id: merksatz
    typ: merksatz
    text:
      de: 'Groß nach klein: mal. Klein nach groß: geteilt. Die richtige [[Umrechnungszahl]] nehmen: 10, 100 oder 1000, bei der Zeit 60 oder 24.'
    weiter: pruefen
  - id: pruefen
    typ: pruefen
    text:
      de: 'Rechne um: 3000 g = ? kg'
    antwort:
      optionen:
        - { wert: { de: '3' }, richtig: true }
        - { wert: { de: '3 000 000' }, fv: FV.GR.UMRECHNEN-RICHTUNG }
        - { wert: { de: '30' }, fv: FV.GR.UMRECHNUNGSZAHL }
    weiter: uebergang
    bei:
      {
        FV.GR.UMRECHNEN-RICHTUNG: erklaeren-umrechnen,
        FV.GR.UMRECHNUNGSZAHL: erklaeren-umrechnungszahlen,
      }
  - id: uebergang
    typ: uebergang
    text:
      de: 'Gut gemacht. Jetzt rechnest du selbst um.'
    vorlagen: [M.GM.GR.UMRECHNEN.IN-GROESSERE, M.GM.GR.UMRECHNEN.IN-KLEINERE]
    anzahl: 3
herkunft: ki-entwurf
version: 1
