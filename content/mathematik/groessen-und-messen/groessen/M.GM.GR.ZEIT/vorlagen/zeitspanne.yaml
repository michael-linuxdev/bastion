# „Wie viele Minuten zwischen 7:45 Uhr und 13:20 Uhr?“ Entwurf: noch nicht geprüft.
id: M.GM.GR.ZEIT.ZEITSPANNE
kompetenz: M.GM.GR.ZEIT
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: gr.zeitspanne@1
parameter:
  G: { bis_stunden: 3 }
  M: { bis_stunden: 10 }
text:
  aufgabe:
    de: '**Bestimme**, wie viele Minuten von {beginn} bis {ende} vergehen.'
hilfen:
  - de: Rechne zuerst bis zur nächsten vollen Stunde, dann in ganzen Stunden weiter.
  - de: Eine Stunde hat 60 Minuten.
fehlerbilder:
  wie-dezimalzahl-gerechnet:
    de: Du hast die Uhrzeiten wie Zahlen abgezogen. Eine Stunde hat aber 60 Minuten, nicht 100.
  nur-stunden:
    de: Du hast nur die vollen Stunden gezählt. Die Minuten am Anfang und am Ende gehören dazu.
herkunft: ki-entwurf
version: 1
