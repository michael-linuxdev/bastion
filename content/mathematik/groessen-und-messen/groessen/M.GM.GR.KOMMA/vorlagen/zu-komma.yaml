# „4 € 3 ct = ? €“. Entwurf: noch nicht geprüft.
id: M.GM.GR.KOMMA.ZU-KOMMA
kompetenz: M.GM.GR.KOMMA
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: gr.kommaschreibweise@1
parameter:
  G: { groessen: [geld, laenge], richtung: zu-komma }
  M: { groessen: [geld, laenge, masse], richtung: zu-komma }
text:
  aufgabe:
    de: '**Gib** in [[Kommaschreibweise]] **an**: {gross} {einheit_gross} {klein} {einheit_klein} = ? {einheit_gross}'
hilfen:
  - de: Wie viele {einheit_klein} hat ein {einheit_gross}? So viele Stellen gibt es hinter dem Komma.
fehlerbilder:
  falsche-stelle:
    de: 'Die [[Ziffer]] steht an der falschen Stelle hinter dem Komma. Beispiel: 3 ct sind 0,03 € – nicht 0,3 €.'
    fv: FV.GR.KOMMASCHREIBWEISE
  nullen-falsch:
    de: Achte auf die Nullen hinter dem Komma.
    fv: FV.GR.KOMMASCHREIBWEISE
herkunft: ki-entwurf
version: 1
