# „Wo schneiden sich die Mittelsenkrechten?“ Entwurf: noch nicht geprüft.
id: M.RF.DV.BESONDERE-LINIEN.SCHNITTPUNKT
kompetenz: M.RF.DV.BESONDERE-LINIEN
niveaus: [G, M]
typ: auswahl
quelle: generator
