# Symmetrieachsen und Mittelpunktswinkel. Entwurf: noch nicht geprüft.
id: M.RF.DV.REGELMAESSIG.SYMMETRIE
kompetenz: M.RF.DV.REGELMAESSIG
niveaus: [G, M]
