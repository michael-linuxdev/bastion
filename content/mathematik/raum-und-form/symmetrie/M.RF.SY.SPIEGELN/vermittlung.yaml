id: M.RF.SY.SPIEGELN
kompetenz: M.RF.SY.SPIEGELN
niveau: G
dauer_min: 11
schritte:
  - id: ziel
    typ: ziel
    text:
      de: 'Danach kannst du einen Punkt an einer [[Geraden]] spiegeln und die [[Koordinaten]] des [[Bildpunktes]] angeben.'
    weiter: vorwissen
  - id: vorwissen
    typ: anknuepfen
    text:
      de: 'Welche [[Koordinaten]] hat der Punkt P?'
    bild: { werkzeug: gitter@1, parameter: { max: 6, punkte: [{ x: 3, y: 4, name: 'P' }] } }
    antwort:
      optionen:
        - { wert: { de: '(3|4)' }, richtig: true }
        - { wert: { de: '(4|3)' }, fv: FV.GF.X-Y-VERTAUSCHT }
    weiter: vorwissen-achse
    bei: { sonst: M.RF.GF.KOORDINATEN }
  - id: vorwissen-achse
    typ: anknuepfen
    text:
      de: 'Ist die dicke Linie eine [[Symmetrieachse]] des Rechtecks?'
    bild:
      {
        werkzeug: gitter@1,
        parameter:
          {
            achsen: false,
            max: 8,
            spiegelachse: { x: 4 },
            figuren: [{ ecken: [[1, 2], [7, 2], [7, 6], [1, 6]] }],
          },
      }
    antwort:
      optionen:
        - { wert: { de: 'Ja, beide Hälften passen beim Falten aufeinander.' }, richtig: true }
        - { wert: { de: 'Nein.' }, fv: FV.SY.ACHSENSYMMETRIE }
    weiter: entdecken
    bei: { sonst: M.RF.SY.SYMMETRIE }
  - id: entdecken
    typ: entdecken
    text:
      de: 'Die dicke Linie ist ein Spiegel. Bewege P mit den Pfeilen auf die Linie zu. Was macht der [[Bildpunkt]] P′?'
    werkzeug:
      {
        id: gitter@1,
        parameter: { max: 8, spiegelachse: { x: 4 }, beweglich: { x: 1, y: 3, name: 'P' } },
      }
    antwort:
      optionen:
        - { wert: { de: 'Er kommt der Linie von der anderen Seite genauso nah.' }, richtig: true }
        - { wert: { de: 'Er bleibt stehen.' }, fv: FV.SY.SPIEGELABSTAND }
        - { wert: { de: 'Er wandert in dieselbe Richtung wie P.' }, fv: FV.SY.SPIEGELABSTAND }
    weiter: erklaeren-spiegeln
  - id: erklaeren-spiegeln
    typ: erklaeren
    text:
      de: 'Beim Spiegeln gehst du von P [[senkrecht]] zur [[Spiegelachse]] und zählst den Abstand: 3 Kästchen. Dann gehst du genauso weit auf der anderen Seite weiter. Der [[Bildpunkt]] P′ hat denselben Abstand zur Achse.'
    bild:
      {
        werkzeug: gitter@1,
        parameter: { max: 8, spiegelachse: { x: 4 }, beweglich: { x: 1, y: 3, name: 'P' } },
      }
    weiter: beispiel
  - id: beispiel
    typ: beispiel
    text:
      de: 'Die Achse ist die senkrechte Linie bei x = 4. P(1|3) liegt 3 links davon. P′ liegt 3 rechts davon: P′(7|3). y bleibt gleich.'
    bild:
      {
        werkzeug: gitter@1,
        parameter: { max: 8, spiegelachse: { x: 4 }, beweglich: { x: 1, y: 3, name: 'P' } },
      }
    weiter: ergaenzen
  - id: ergaenzen
    typ: ergaenzen
    text:
      de: '[[Spiegle]] P(2|6) an der senkrechten Achse bei x = 5. Welche x-[[Koordinate]] hat der [[Bildpunkt]] P′?'
    bild:
      {
        werkzeug: gitter@1,
        parameter: { max: 8, spiegelachse: { x: 5 }, punkte: [{ x: 2, y: 6, name: 'P' }] },
      }
    antwort:
      eingabe:
        {
          art: zahl,
          loesung: '8',
          fehler:
            [{ wert: '5', fv: FV.SY.SPIEGELABSTAND }, { wert: '2', fv: FV.SY.SPIEGELABSTAND }],
        }
    weiter: gegenbeispiel
    bei: { FV.SY.SPIEGELABSTAND: erklaeren-spiegeln }
  - id: gegenbeispiel
    typ: gegenbeispiel
    text:
      de: 'Ida spiegelt P(5|6) an der waagerechten Achse bei y = 4. Sie zeichnet P′(3|6) und sagt: „x wird um 2 kleiner.“ Stimmt das?'
    bild:
      {
        werkzeug: gitter@1,
        parameter:
          {
            max: 8,
            spiegelachse: { y: 4 },
            punkte: [{ x: 5, y: 6, name: 'P' }, { x: 3, y: 6, name: 'P′' }],
          },
      }
    antwort:
      optionen:
        - {
            wert: { de: 'Nein, bei einer waagerechten Achse ändert sich y: P′(5|2).' },
            richtig: true,
          }
        - { wert: { de: 'Ja.' }, fv: FV.GF.SPIEGELN-KOORDINATE }
    weiter: merksatz
    bei: { FV.GF.SPIEGELN-KOORDINATE: erklaeren-spiegeln }
  - id: merksatz
    typ: merksatz
    text:
      de: 'Senkrecht zur Achse, gleicher Abstand auf der anderen Seite. Bei einer senkrechten Achse ändert sich nur x, bei einer waagerechten nur y.'
    weiter: pruefen
  - id: pruefen
    typ: pruefen
    text:
      de: '[[Spiegle]] P an der dicken Linie. Welcher [[Bildpunkt]] P′ entsteht?'
    bild:
      {
        werkzeug: gitter@1,
        parameter: { max: 8, spiegelachse: { x: 3 }, punkte: [{ x: 1, y: 4, name: 'P' }] },
      }
    antwort:
      optionen:
        - { wert: { de: '(5|4)' }, richtig: true }
        - { wert: { de: '(3|4)' }, fv: FV.SY.SPIEGELABSTAND }
        - { wert: { de: '(1|2)' }, fv: FV.GF.SPIEGELN-KOORDINATE }
    weiter: uebergang
    bei: { FV.SY.SPIEGELABSTAND: erklaeren-spiegeln, FV.GF.SPIEGELN-KOORDINATE: erklaeren-spiegeln }
  - id: uebergang
    typ: uebergang
    text:
      de: 'Sehr gut. Jetzt spiegelst du selbst.'
    vorlagen: [M.RF.SY.SPIEGELN.DREIECK, M.RF.SY.SPIEGELN.PUNKT]
    anzahl: 3
herkunft: ki-entwurf
version: 1
