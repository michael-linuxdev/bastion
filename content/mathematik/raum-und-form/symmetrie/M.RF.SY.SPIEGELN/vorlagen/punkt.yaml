# Spiegeln an einer Achse im Koordinatensystem. Entwurf: noch nicht geprüft.
id: M.RF.SY.SPIEGELN.PUNKT
kompetenz: M.RF.SY.SPIEGELN
niveaus: [G, M]
typ: koordinaten-eingabe
quelle: generator
generator: sy.spiegelpunkt@1
parameter:
  G: { max: 8, figur: false }
  M: { max: 12, figur: false }
text:
  aufgabe:
    de: '**[[Spiegle]]** den Punkt {punkt} an der [[Geraden]] {achse}. **Gib** die [[Koordinaten]] des [[Bildpunktes]] **an**.'
hilfen:
  - de: 'Zähle, wie viele Kästchen der Punkt von der [[Spiegelachse]] entfernt ist.'
  - de: 'Der [[Bildpunkt]] liegt genauso weit auf der anderen Seite – auf einer [[Senkrechten]] zur Achse.'
fehlerbilder:
  nicht-gespiegelt:
    de: Das ist noch der ursprüngliche Punkt. Gespiegelt liegt er auf der anderen Seite der Achse.
    fv: FV.SY.SPIEGELABSTAND
  auf-die-achse:
    de: 'Du bist nur bis zur Achse gegangen. Der [[Bildpunkt]] liegt genauso weit **hinter** der Achse.'
    fv: FV.SY.SPIEGELABSTAND
  falsche-achse:
    de: 'Du hast in die falsche Richtung gespiegelt. Bei {achse} ändert sich nur eine [[Koordinate]].'
    fv: FV.GF.SPIEGELN-KOORDINATE
herkunft: ki-entwurf
version: 1
