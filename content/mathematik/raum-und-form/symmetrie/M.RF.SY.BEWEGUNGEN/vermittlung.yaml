id: M.RF.SY.BEWEGUNGEN
kompetenz: M.RF.SY.BEWEGUNGEN
niveau: G
dauer_min: 11
schritte:
  - id: ziel
    typ: ziel
    text:
      de: 'Danach kannst du [[Spiegelung]], [[Verschiebung]] und [[Drehung]] unterscheiden und eine Verschiebung ausführen.'
    weiter: vorwissen
  - id: vorwissen
    typ: anknuepfen
    text:
      de: 'Wie viele [[Symmetrieachsen]] hat dieses Rechteck?'
    bild:
      {
        werkzeug: gitter@1,
        parameter:
          { achsen: false, max: 8, figuren: [{ ecken: [[1, 2], [7, 2], [7, 5], [1, 5]] }] },
      }
    antwort:
      eingabe: { art: zahl, loesung: '2', fehler: [{ wert: '4', fv: FV.SY.ACHSENSYMMETRIE }] }
    weiter: entdecken
    bei: { sonst: M.RF.SY.SYMMETRIE }
  - id: entdecken
    typ: entdecken
    text:
      de: 'Jeder Punkt wird gleich verschoben. Bewege P mit den Pfeilen und schau auf den [[Bildpunkt]] P′. Wo liegt P′ immer?'
    werkzeug:
      {
        id: gitter@1,
        parameter:
          { max: 8, verschiebung: [3, 2], beweglich: { x: 1, y: 1, name: 'P' }, frage: true },
      }
    antwort:
      optionen:
        - { wert: { de: '3 nach rechts und 2 nach oben von P.' }, richtig: true }
        - { wert: { de: 'P′ bleibt stehen.' }, fv: FV.SY.VERSCHIEBUNG }
        - {
            wert: { de: 'P′ liegt gespiegelt auf der anderen Seite.' },
            fv: FV.SY.BEWEGUNG-ERKENNEN,
          }
    weiter: erklaeren-verschiebung
    bei:
      { FV.SY.VERSCHIEBUNG: erklaeren-verschiebung, FV.SY.BEWEGUNG-ERKENNEN: erklaeren-bewegungen }
  - id: erklaeren-verschiebung
    typ: erklaeren
    text:
      de: 'Eine [[Verschiebung]] „3 nach rechts, 2 nach oben“ gilt für jeden Punkt: x plus 3, y plus 2. P(1|4) wird zu P′(4|6). Nach links oder unten wird abgezogen.'
    bild:
      {
        werkzeug: gitter@1,
        parameter: { max: 8, verschiebung: [3, 2], beweglich: { x: 1, y: 4, name: 'P' } },
      }
    weiter: erklaeren-bewegungen
  - id: erklaeren-bewegungen
    typ: erklaeren
    text:
      de: '[[Verschiebung]]: Die Figur rückt nur woanders hin, nichts dreht sich (Pfeil). [[Spiegelung]]: Die Figur wird an der Achse umgeklappt, links und rechts tauschen. [[Drehung]]: Die Figur dreht sich um einen Punkt.'
    bild:
      {
        werkzeug: gitter@1,
        parameter:
          {
            achsen: false,
            max: 12,
            spiegelachse: { x: 7 },
            figuren:
              [
                { ecken: [[2, 1], [4, 1], [4, 2], [3, 2], [3, 4], [2, 4]] },
                { ecken: [[4, 5], [6, 5], [6, 6], [5, 6], [5, 8], [4, 8]], bild: true },
                { ecken: [[12, 1], [10, 1], [10, 2], [11, 2], [11, 4], [12, 4]], bild: true },
              ],
            pfeile: [{ von: [2, 1], nach: [4, 5] }],
          },
      }
    weiter: beispiel
  - id: beispiel
    typ: beispiel
    text:
      de: '[[Verschiebung]] 3 nach rechts, 2 nach oben. P(1|4) wird zu P′(4|6). Q(5|1) wird zu Q′(8|3). Beide Pfeile sind gleich lang und zeigen in dieselbe Richtung.'
    bild:
      {
        werkzeug: gitter@1,
        parameter:
          {
            max: 9,
            punkte:
              [
                { x: 1, y: 4, name: 'P' },
                { x: 4, y: 6, name: 'P′' },
                { x: 5, y: 1, name: 'Q' },
                { x: 8, y: 3, name: 'Q′' },
              ],
            pfeile: [{ von: [1, 4], nach: [4, 6] }, { von: [5, 1], nach: [8, 3] }],
          },
      }
    weiter: ergaenzen
  - id: ergaenzen
    typ: ergaenzen
    text:
      de: '[[Verschiebung]] 4 nach rechts, 1 nach unten. P(2|5) wird verschoben. Welche y-[[Koordinate]] hat P′?'
    bild: { werkzeug: gitter@1, parameter: { max: 8, punkte: [{ x: 2, y: 5, name: 'P' }] } }
    antwort:
      eingabe:
        {
          art: zahl,
          loesung: '4',
          fehler: [{ wert: '6', fv: FV.SY.VERSCHIEBUNG }, { wert: '5', fv: FV.SY.VERSCHIEBUNG }],
        }
    weiter: gegenbeispiel
    bei: { FV.SY.VERSCHIEBUNG: erklaeren-verschiebung }
  - id: gegenbeispiel
    typ: gegenbeispiel
    text:
      de: 'Bei der linken Figur zeigt der Fuß nach rechts, bei der rechten nach links. Tom sagt: Die rechte ist nur verschoben. Stimmt das?'
    bild:
      {
        werkzeug: gitter@1,
        parameter:
          {
            achsen: false,
            max: 12,
            figuren:
              [
                { ecken: [[1, 1], [3, 1], [3, 2], [2, 2], [2, 4], [1, 4]] },
                { ecken: [[11, 1], [9, 1], [9, 2], [10, 2], [10, 4], [11, 4]], bild: true },
              ],
          },
      }
    antwort:
      optionen:
        - {
            wert: { de: 'Nein, die Figur ist umgeklappt: Das ist eine Spiegelung.' },
            richtig: true,
          }
        - { wert: { de: 'Ja.' }, fv: FV.SY.BEWEGUNG-ERKENNEN }
    weiter: merksatz
    bei: { FV.SY.BEWEGUNG-ERKENNEN: erklaeren-bewegungen }
  - id: merksatz
    typ: merksatz
    text:
      de: '[[Verschiebung]]: gleiche Richtung, nur woanders. [[Drehung]]: um einen Punkt gedreht. [[Spiegelung]]: umgeklappt. Bei der Verschiebung jeden Punkt gleich weit bewegen.'
    weiter: pruefen
  - id: pruefen
    typ: pruefen
    text:
      de: 'Bei einer [[Verschiebung]] wird P(1|1) zu P′(4|3). Wohin kommt Q(5|5)?'
    bild:
      {
        werkzeug: gitter@1,
        parameter:
          {
            max: 8,
            punkte:
              [{ x: 1, y: 1, name: 'P' }, { x: 4, y: 3, name: 'P′' }, { x: 5, y: 5, name: 'Q' }],
            pfeile: [{ von: [1, 1], nach: [4, 3] }],
          },
      }
    antwort:
      optionen:
        - { wert: { de: '(8|7)' }, richtig: true }
        - { wert: { de: '(8|5)' }, fv: FV.SY.VERSCHIEBUNG }
        - { wert: { de: '(2|3)' }, fv: FV.SY.VERSCHIEBUNG }
    weiter: uebergang
    bei: { FV.SY.VERSCHIEBUNG: erklaeren-verschiebung }
  - id: uebergang
    typ: uebergang
    text:
      de: 'Prima. Jetzt übst du selbst.'
    vorlagen: [M.RF.SY.BEWEGUNGEN.ERKENNEN, M.RF.SY.BEWEGUNGEN.VERSCHIEBUNG]
    anzahl: 3
herkunft: ki-entwurf
version: 1
