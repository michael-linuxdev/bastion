# Welche Kästchenfigur ist achsensymmetrisch? Entwurf: noch nicht geprüft.
id: M.RF.SY.SYMMETRIE.FIGUR-WAEHLEN
kompetenz: M.RF.SY.SYMMETRIE
niveaus: [G, M]
typ: bild-auswahl
quelle: generator
generator: sy.symmetrische-figur@1
parameter:
  G: { kaestchen: 4 }
  M: { kaestchen: 7 }
text:
  aufgabe:
    de: '**Wähle** die Figur **aus**, die achsensymmetrisch ist.'
hilfen:
  - de: Suche eine Linie, an der du die Figur falten könntest.
  - de: Zähle auf beiden Seiten der Linie die Kästchen in jeder Reihe.
fehlerbilder:
  fast-symmetrisch:
    de: Diese Figur ist fast symmetrisch – aber ein Kästchen passt nicht. Vergleiche Kästchen für Kästchen.
herkunft: ki-entwurf
version: 1
