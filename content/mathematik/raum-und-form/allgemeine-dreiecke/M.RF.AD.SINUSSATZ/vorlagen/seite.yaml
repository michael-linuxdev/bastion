# Seite mit dem Sinussatz – Niveau G. Entwurf: noch nicht geprüft.
id: M.RF.AD.SINUSSATZ.SEITE
kompetenz: M.RF.AD.SINUSSATZ
niveaus: [G]
typ: zahl-eingabe
quelle: generator
generator: ad.sinussatz-seite@1
parameter:
  G: {}
text:
  aufgabe:
    de: 'Im Dreieck ABC ist $b = {b}$ cm, $\alpha = {alpha}°$ und $\beta = {beta}°$. **Berechne** a in cm auf eine Stelle nach dem Komma.'
hilfen:
  - de: 'Welcher [[Winkel]] liegt a gegenüber, welcher b?'
  - de: '[[Sinussatz]]: $\frac{a}{\sin \alpha} = \frac{b}{\sin \beta}$. Stelle nach a um.'
fehlerbilder:
  paar:
    de: 'Du hast die [[Winkel]] vertauscht. Zu a gehört der [[Gegenwinkel]] α, zu b der Gegenwinkel β.'
    fv: FV.AD.PAAR
  bogenmass:
    de: 'Dein Taschenrechner rechnet im [[Bogenmaß]]. Stelle ihn auf [[Grad]] (DEG).'
    fv: FV.TR.BOGENMASS
herkunft: ki-entwurf
version: 1
