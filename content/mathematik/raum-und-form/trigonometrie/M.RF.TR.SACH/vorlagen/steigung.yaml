# „12 % Steigung: Wie groß ist der Winkel?“ – Niveau E. Entwurf: noch nicht geprüft.
id: M.RF.TR.SACH.STEIGUNG
kompetenz: M.RF.TR.SACH
niveaus: [E]
typ: auswahl
quelle: generator
generator: tr.steigung@1
parameter:
  E: {}
text:
  aufgabe:
    de: 'Ein Verkehrsschild zeigt {prozent} % Steigung. **Wie** groß ist der Steigungswinkel? **Wähle** die Antwort mit der richtigen Begründung.'
hilfen:
  - de: '[[Prozent]] heißt: so viele Meter [[Höhe]] auf 100 m waagerechte Strecke.'
