  sinus:
    de: 'Die 100 m sind waagerecht gemessen, also die [[Ankathete]], nicht die [[Hypotenuse]]. Darum Tangens.'
    fv: FV.TR.FUNKTION-VERWECHSELT
  prozent-mal-90:
    de: '100 % Steigung heißt [[Höhe]] gleich waagerechte Strecke: Das sind 45°, nicht 90°.'
    fv: FV.TR.PROZENT-GRAD
