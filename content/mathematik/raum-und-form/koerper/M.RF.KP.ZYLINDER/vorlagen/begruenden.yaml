  flaeche:
    de: '[[π]] · r² ist eine Fläche in cm². Die Seite des Rechtecks ist eine Länge: der [[Umfang]] 2 · π · r.'
    fv: FV.FL.UMFANG-FLAECHE
  halber-umfang:
    de: 'Der [[Umfang]] ist 2 · [[π]] · r oder π · d. Mit π · r fehlt die Hälfte.'
