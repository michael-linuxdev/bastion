# Länge des Mantelrechtecks begründen – Niveau E (K-31). Entwurf: noch nicht geprüft.
id: M.RF.KP.ZYLINDER.BEGRUENDEN
kompetenz: M.RF.KP.ZYLINDER
niveaus: [E]
typ: auswahl
quelle: generator
generator: kp.mantel-aussage@1
parameter:
  E: {}
text:
  aufgabe:
    de: '{situation} **Wähle** die Antwort mit der richtigen Begründung.'
hilfen:
  - de: 'Stell dir vor, du wickelst den [[Mantel]] um eine Dose.'
  - de: 'Er geht einmal ganz um den Kreis herum: Das ist der [[Umfang]].'
fehlerbilder:
