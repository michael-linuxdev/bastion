# „Welcher Satz begründet das?“ – Niveau E. Entwurf: noch nicht geprüft.
id: M.RF.PY.UMKEHRUNG.SATZ
kompetenz: M.RF.PY.UMKEHRUNG
niveaus: [E]
typ: auswahl
quelle: generator
generator: py.satz-oder-umkehrung@1
parameter:
  E: {}
text:
  aufgabe:
    de: '{situation} **Welcher** Satz begründet diese Folgerung?'
hilfen:
  - de: 'Was ist bekannt, was wird gefolgert? Ein Satz schließt von „rechtwinklig“ auf die [[Gleichung]], die [[Umkehrung]] andersherum.'
