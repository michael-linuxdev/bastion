  umkehrung-statt-satz:
    de: 'Hier ist der rechte [[Winkel]] bekannt, und es wird gerechnet. Das leistet der Satz selbst.'
    fv: FV.PY.SATZ-UMKEHRUNG
  hoehensatz:
    de: 'Der Höhensatz verbindet die [[Höhe]] mit den Hypotenusenabschnitten. Hier geht es um die drei Seiten.'
    fv: FV.PY.SATZ-UMKEHRUNG
  thales:
    de: 'Der [[Satz des Thales]] handelt von Dreiecken im Halbkreis. Hier geht es um die Seitenlängen.'
