  beinahe:
    de: 'Die Quadrate müssen genau gleich sein. Fast gleich reicht nicht für einen [[rechten Winkel]].'
    fv: FV.PY.UMKEHRUNG-UNGEFAEHR
  kleinste-seite:
    de: 'Der rechte [[Winkel]] liegt der längsten Seite gegenüber, nicht der kürzesten.'
