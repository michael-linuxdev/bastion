# „Ist das Dreieck mit a = 7, b = 24, c = 25 rechtwinklig?“ Entwurf: noch nicht geprüft.
id: M.RF.PY.UMKEHRUNG.PRUEFEN
kompetenz: M.RF.PY.UMKEHRUNG
niveaus: [G, M]
typ: auswahl
quelle: generator
generator: py.umkehrung@1
parameter:
  G: { wo: false }
  M: { wo: true }
text:
  aufgabe:
    de: 'Ein Dreieck hat die Seiten {seiten} (in cm). **Prüfe** mit der [[Umkehrung]] des Satzes von Pythagoras und wähle die passende Antwort.'
hilfen:
  - de: 'Nur die längste Seite kann die [[Hypotenuse]] sein.'
