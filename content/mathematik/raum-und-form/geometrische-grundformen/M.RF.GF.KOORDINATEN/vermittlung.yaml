id: M.RF.GF.KOORDINATEN
kompetenz: M.RF.GF.KOORDINATEN
niveau: G
dauer_min: 11
schritte:
  - id: ziel
    typ: ziel
    text:
      de: 'Danach kannst du die [[Koordinaten]] eines Punktes ablesen und einen Punkt zu Koordinaten finden.'
    weiter: vorwissen
  - id: vorwissen
    typ: anknuepfen
    text:
      de: 'Welche Zahl ist größer: 7 oder 4?'
    antwort:
      optionen:
        - { wert: { de: '7' }, richtig: true }
        - { wert: { de: '4' }, fv: FV.NZ.ZEICHEN-VERDREHT }
    weiter: entdecken
    bei: { sonst: M.ZO.NZ.ORDNEN }
  - id: entdecken
    typ: entdecken
    text:
      de: 'Bewege den Punkt P mit den Pfeilen nach rechts und schau auf die Klammer. Welche der beiden Zahlen ändert sich?'
    werkzeug: { id: gitter@1, parameter: { max: 6, beweglich: { x: 1, y: 2, name: 'P' } } }
    antwort:
      optionen:
        - { wert: { de: 'die erste Zahl' }, richtig: true }
        - { wert: { de: 'die zweite Zahl' }, fv: FV.GF.X-Y-VERTAUSCHT }
    weiter: erklaeren-koordinaten
  - id: erklaeren-koordinaten
    typ: erklaeren
    text:
      de: 'P(3|5) hat zwei [[Koordinaten]]. Erst x: 3 nach rechts. Dann y: 5 nach oben. Die Zahlen stehen an den Linien, nicht in den Kästchen. Gezählt wird ab dem [[Ursprung]] (0|0).'
    bild:
      {
        werkzeug: gitter@1,
        parameter: { max: 6, punkte: [{ x: 3, y: 5, name: 'P' }], hilfslinien: true },
      }
    weiter: beispiel
  - id: beispiel
    typ: beispiel
    text:
      de: 'Q liegt dort, wo sich die Linie bei 2 auf der x-Achse und die Linie bei 6 auf der y-Achse kreuzen. Seine [[Koordinaten]]: Q(2|6).'
    bild:
      {
        werkzeug: gitter@1,
        parameter: { max: 7, punkte: [{ x: 2, y: 6, name: 'Q' }], hilfslinien: true },
      }
    weiter: ergaenzen
  - id: ergaenzen
    typ: ergaenzen
    text:
      de: 'Welche [[Koordinaten]] hat der Punkt R?'
    bild: { werkzeug: gitter@1, parameter: { max: 6, punkte: [{ x: 4, y: 1, name: 'R' }] } }
    antwort:
      optionen:
        - { wert: { de: '(4|1)' }, richtig: true }
        - { wert: { de: '(1|4)' }, fv: FV.GF.X-Y-VERTAUSCHT }
        - { wert: { de: '(5|2)' }, fv: FV.GF.KAESTCHEN-LINIEN }
    weiter: gegenbeispiel
    bei:
      { FV.GF.X-Y-VERTAUSCHT: erklaeren-koordinaten, FV.GF.KAESTCHEN-LINIEN: erklaeren-koordinaten }
  - id: gegenbeispiel
    typ: gegenbeispiel
    text:
      de: 'Lina soll den Punkt (2|5) einzeichnen. Sie geht 5 nach rechts und 2 nach oben, wie im Bild. Stimmt das?'
    bild:
      {
        werkzeug: gitter@1,
        parameter: { max: 6, punkte: [{ x: 5, y: 2, name: 'L' }], hilfslinien: true },
      }
    antwort:
      optionen:
        - { wert: { de: 'Nein, erst x: 2 nach rechts, dann y: 5 nach oben.' }, richtig: true }
        - { wert: { de: 'Ja.' }, fv: FV.GF.X-Y-VERTAUSCHT }
    weiter: merksatz
    bei: { FV.GF.X-Y-VERTAUSCHT: erklaeren-koordinaten }
  - id: merksatz
    typ: merksatz
    text:
      de: 'Erst nach rechts (x), dann nach oben (y). An den Linien ablesen, ab dem [[Ursprung]] zählen.'
    weiter: pruefen
  - id: pruefen
    typ: pruefen
    text:
      de: 'Wie heißen die [[Koordinaten]] von S?'
    bild: { werkzeug: gitter@1, parameter: { max: 8, punkte: [{ x: 6, y: 3, name: 'S' }] } }
    antwort:
      optionen:
        - { wert: { de: '(6|3)' }, richtig: true }
        - { wert: { de: '(3|6)' }, fv: FV.GF.X-Y-VERTAUSCHT }
        - { wert: { de: '(7|4)' }, fv: FV.GF.KAESTCHEN-LINIEN }
    weiter: uebergang
    bei:
      { FV.GF.X-Y-VERTAUSCHT: erklaeren-koordinaten, FV.GF.KAESTCHEN-LINIEN: erklaeren-koordinaten }
  - id: uebergang
    typ: uebergang
    text:
      de: 'Gut gemacht. Jetzt liest du selbst ab.'
    vorlagen: [M.RF.GF.KOORDINATEN.ABLESEN, M.RF.GF.KOORDINATEN.FINDEN]
    anzahl: 3
herkunft: ki-entwurf
version: 1
