id: M.RF.GF.LAGE
kompetenz: M.RF.GF.LAGE
niveau: G
dauer_min: 10
schritte:
  - id: ziel
    typ: ziel
    text:
      de: 'Danach kannst du sagen, ob zwei [[Geraden]] [[parallel]] oder [[senkrecht]] zueinander sind oder sich nur schneiden.'
    weiter: entdecken
  - id: entdecken
    typ: entdecken
    text:
      de: 'Hier siehst du zwei kurze Stücke von [[Geraden]]. Eine [[Gerade]] hat aber kein Ende. Verlängere beide mit dem Knopf. Treffen sie sich?'
    werkzeug: { id: geraden@1, parameter: { kurz: true, winkel: 20, richtung: 10 } }
    antwort:
      optionen:
        - { wert: { de: 'Ja, weiter draußen schneiden sie sich.' }, richtig: true }
        - { wert: { de: 'Nein, sie berühren sich nicht.' }, fv: FV.GF.LAGEBEZIEHUNG }
    weiter: erklaeren-lage
  - id: erklaeren-lage
    typ: erklaeren
    text:
      de: '[[Parallel]]: Die [[Geraden]] haben überall denselben Abstand und schneiden sich nie, auch verlängert nicht. Wie die zwei Schienen einer Eisenbahn.'
    bild: { werkzeug: geraden@1, parameter: { lage: parallel, richtung: 15 } }
    weiter: erklaeren-senkrecht
  - id: erklaeren-senkrecht
    typ: erklaeren
    text:
      de: 'Stehen zwei [[Geraden]] [[senkrecht]] aufeinander, schneiden sie sich im [[rechten Winkel]], wie die Ecke eines Blatts. Das kleine Quadrat zeigt den rechten Winkel. Alle anderen Geraden schneiden sich schräg.'
    bild: { werkzeug: geraden@1, parameter: { lage: senkrecht, richtung: 0 } }
    weiter: beispiel
  - id: beispiel
    typ: beispiel
    text:
      de: 'Die Linien in deinem Heft sind [[parallel]]. Der Heftrand steht [[senkrecht]] auf ihnen. Die Zeiger einer Uhr um 2 Uhr schneiden sich schräg, wie g und h hier.'
    bild: { werkzeug: geraden@1, parameter: { winkel: 60, richtung: 90 } }
    weiter: ergaenzen
  - id: ergaenzen
    typ: ergaenzen
    text:
      de: 'Drehe die [[Gerade]] h Schritt für Schritt. Bei wie viel [[Grad]] steht h [[senkrecht]] auf g?'
    werkzeug: { id: geraden@1, parameter: { winkel: 50, richtung: 0 } }
    antwort:
      eingabe:
        {
          art: zahl,
          loesung: '90',
          fehler:
            [{ wert: '0', fv: FV.GF.LAGEBEZIEHUNG }, { wert: '180', fv: FV.GF.LAGEBEZIEHUNG }],
        }
    weiter: gegenbeispiel
    bei: { FV.GF.LAGEBEZIEHUNG: erklaeren-lage }
  - id: gegenbeispiel
    typ: gegenbeispiel
    text:
      de: 'Ben sagt: Diese [[Geraden]] stehen [[senkrecht]] aufeinander, sie kreuzen sich doch. Stimmt das?'
    bild: { werkzeug: geraden@1, parameter: { winkel: 70, richtung: 20 } }
    antwort:
      optionen:
        - {
            wert: { de: 'Nein, senkrecht heißt: genau ein rechter Winkel. Hier ist er schief.' },
            richtig: true,
          }
        - { wert: { de: 'Ja, jede Kreuzung ist senkrecht.' }, fv: FV.GF.LAGEBEZIEHUNG }
    weiter: merksatz
    bei: { FV.GF.LAGEBEZIEHUNG: erklaeren-lage }
  - id: merksatz
    typ: merksatz
    text:
      de: 'Zwei [[Geraden]] sind [[parallel]]: Sie schneiden sich nie, überall gleicher Abstand. Sie stehen [[senkrecht]]: Sie schneiden sich im [[rechten Winkel]]. Alles andere: schneidend. Geraden in Gedanken immer verlängern.'
    weiter: pruefen
  - id: pruefen
    typ: pruefen
    text:
      de: 'Wie liegen g und h zueinander?'
    bild: { werkzeug: geraden@1, parameter: { lage: parallel, richtung: 0 } }
    antwort:
      optionen:
        - { wert: { de: 'parallel' }, richtig: true }
        - { wert: { de: 'senkrecht' }, fv: FV.GF.LAGEBEZIEHUNG }
        - { wert: { de: 'schneidend, weiter draußen' }, fv: FV.GF.LAGEBEZIEHUNG }
    weiter: uebergang
    bei: { FV.GF.LAGEBEZIEHUNG: erklaeren-lage }
  - id: uebergang
    typ: uebergang
    text:
      de: 'Gut gemacht. Jetzt übst du selbst.'
    vorlagen: [M.RF.GF.LAGE.PARALLELE-FINDEN, M.RF.GF.LAGE.ZWEI-GERADEN]
    anzahl: 3
herkunft: ki-entwurf
version: 1
