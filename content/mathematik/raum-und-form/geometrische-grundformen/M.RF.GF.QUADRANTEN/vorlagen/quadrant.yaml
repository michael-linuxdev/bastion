# „In welchem Quadranten liegt P(−3|5)?“ Entwurf: noch nicht geprüft.
id: M.RF.GF.QUADRANTEN.QUADRANT
kompetenz: M.RF.GF.QUADRANTEN
niveaus: [G, M]
