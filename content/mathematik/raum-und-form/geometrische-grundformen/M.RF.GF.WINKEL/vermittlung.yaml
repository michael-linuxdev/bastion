id: M.RF.GF.WINKEL
kompetenz: M.RF.GF.WINKEL
niveau: G
dauer_min: 12
schritte:
  - id: ziel
    typ: ziel
    text:
      de: 'Danach kannst du [[Winkel]] am [[Winkelmesser]] ablesen und sagen, welche [[Winkelart]] sie haben.'
    weiter: entdecken
  - id: entdecken
    typ: entdecken
    text:
      de: 'Mach den [[Winkel]] mit + Schritt für Schritt größer. Schau auf die [[Winkelart]]. Bei wie viel [[Grad]] wird aus „spitz“ „recht“?'
    werkzeug: { id: winkel@1, parameter: { grad: 30 } }
    antwort:
      eingabe:
        {
          art: zahl,
          loesung: '90',
          fehler: [{ wert: '180', fv: FV.GF.WINKELART }, { wert: '100', fv: FV.GF.WINKELART }],
        }
    weiter: erklaeren-winkelarten
  - id: erklaeren-winkelarten
    typ: erklaeren
    text:
      de: 'Fünf Winkelarten: spitz unter 90°, recht genau 90°, stumpf zwischen 90° und 180°, gestreckt genau 180°, überstumpf über 180°. Der Bogen zeigt, welcher [[Winkel]] gemeint ist.'
    bild: { werkzeug: winkel@1, parameter: { grad: 120 } }
    weiter: erklaeren-messen
  - id: erklaeren-messen
    typ: erklaeren
    text:
      de: 'Am [[Winkelmesser]] gibt es zwei [[Skalen]]. Lege die Mitte auf den Scheitel und die 0 auf einen [[Schenkel]]. Lies auf der Skala ab, die dort mit 0 beginnt: hier 40°. Zahlen stehen alle 20°, jeder Strich zählt 5°.'
    bild: { werkzeug: winkel@1, parameter: { grad: 40, winkelmesser: true } }
    weiter: beispiel
  - id: beispiel
    typ: beispiel
    text:
      de: 'Der erste [[Schenkel]] liegt links auf der 0 der inneren [[Skala]]. Der zweite zeigt innen auf 40 und außen auf 140. Der [[Winkel]] ist spitz, also 40°.'
    bild: { werkzeug: winkel@1, parameter: { grad: 40, winkelmesser: true, links: true } }
    weiter: ergaenzen
  - id: ergaenzen
    typ: ergaenzen
    text:
      de: 'Welche [[Winkelart]] hat dieser [[Winkel]] von 120°?'
    bild: { werkzeug: winkel@1, parameter: { grad: 120, frage: true } }
    antwort:
      optionen:
        - { wert: { de: 'stumpf' }, richtig: true }
        - { wert: { de: 'spitz' }, fv: FV.GF.WINKELART }
        - { wert: { de: 'überstumpf' }, fv: FV.GF.WINKELART }
    weiter: gegenbeispiel
    bei: { FV.GF.WINKELART: erklaeren-winkelarten }
  - id: gegenbeispiel
    typ: gegenbeispiel
    text:
      de: 'Mia liest diesen [[Winkel]] ab und schreibt 160°. Stimmt das?'
    bild: { werkzeug: winkel@1, parameter: { grad: 20, winkelmesser: true, frage: true } }
    antwort:
      optionen:
        - {
            wert:
              { de: 'Nein, der Winkel ist spitz. Auf der Skala mit der 0 am Schenkel steht 20.' },
            richtig: true,
          }
        - { wert: { de: 'Ja, 160 steht doch am zweiten Schenkel.' }, fv: FV.GF.WINKELMESSER-SKALA }
    weiter: merksatz
    bei: { FV.GF.WINKELMESSER-SKALA: erklaeren-messen }
  - id: merksatz
    typ: merksatz
    text:
      de: 'Erst schätzen: spitz, recht oder stumpf? Dann die [[Skala]] nehmen, die beim [[Schenkel]] mit 0 beginnt. Passt der Wert zur Schätzung?'
    weiter: pruefen
  - id: pruefen
    typ: pruefen
    text:
      de: 'Wie groß ist dieser [[Winkel]]?'
    bild: { werkzeug: winkel@1, parameter: { grad: 120, winkelmesser: true, frage: true } }
    antwort:
      optionen:
        - { wert: { de: '120°' }, richtig: true }
        - { wert: { de: '60°' }, fv: FV.GF.WINKELMESSER-SKALA }
    weiter: uebergang
    bei: { FV.GF.WINKELMESSER-SKALA: erklaeren-messen }
  - id: uebergang
    typ: uebergang
    text:
      de: 'Sehr gut. Jetzt misst du selbst.'
    vorlagen: [M.RF.GF.WINKEL.ABLESEN, M.RF.GF.WINKEL.ART]
    anzahl: 3
herkunft: ki-entwurf
version: 1
