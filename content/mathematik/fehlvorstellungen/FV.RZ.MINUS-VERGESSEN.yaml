id: FV.RZ.MINUS-VERGESSEN
name:
  de: Lässt bei Zahlen unter null das Minus weg
art: lesefehler
beschreibung:
  de: >-
    Schreibt 3 statt −3 für „3 Grad unter null“ oder liest die Markierung links der 0 als positive
    Zahl. Der Betrag stimmt, die Seite der 0 wird nicht beachtet.
kompetenzen: [M.ZO.RZ.BEGRIFF, M.RF.GF.QUADRANTEN]
erklaerung:
  kurz:
    de: 'Links von der 0, unter null, unter dem Meeresspiegel oder bei Schulden steht ein Minus vor der Zahl.'
  lang:
    - teil: so-denkst-du
      de: 'Du hast den Abstand zur 0 richtig, aber das Minus vergessen.'
    - teil: warum-nicht
      de: 'Im Alltag sagt man oft nur „drei [[Grad]]“. Aber 3 °C und −3 °C sind sehr verschieden: einmal taut es, einmal friert es.'
    - teil: so-stimmt-es
      de: 'Frage dich zuerst: Auf welcher Seite der 0 liegt die Zahl? Links oder darunter heißt [[Vorzeichen]] minus.'
gegenbeispiel:
  de: '5 € auf dem Konto und 5 € Schulden sind nicht dasselbe.'
rueckweg:
  vermittlung: M.ZO.RZ.BEGRIFF#erklaeren-zahlengerade
kontrast: [M.ZO.RZ.BEGRIFF.ALLTAG, M.ZO.RZ.BEGRIFF.ZAHLENGERADE, M.RF.GF.QUADRANTEN.ABLESEN]
herkunft: ki-entwurf
version: 1
