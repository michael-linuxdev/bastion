id: FV.NZ.RUNDEN-STELLE
name:
  de: Rundet auf eine andere Stelle als verlangt
art: lesefehler
beschreibung:
  de: >-
    Rundet auf Zehner statt auf Hunderter oder auf Hundertstel statt auf Zehntel. Meist werden die
    Namen der Stellen verwechselt oder die Aufgabe zu schnell gelesen.
kompetenzen: [M.ZO.BR.DEZ-ORDNEN, M.ZO.NZ.RUNDEN]
erklaerung:
  kurz:
    de: 'Lies genau, auf welche Stelle gerundet wird, und unterstreiche sie. Rechts von ihr stehen danach nur noch Nullen oder keine Stellen mehr.'
  lang:
    - teil: so-denkst-du
      de: 'Du hast richtig gerundet, aber auf eine andere Stelle.'
    - teil: warum-nicht
      de: 'Die Namen der Stellen klingen [[ähnlich]], das verwirrt leicht. Doch jede Stelle führt zu einem anderen Ergebnis: 4 572 ist auf Zehner 4 570, auf Hunderter 4 600. Bei Kommazahlen genauso: 3,476 ist auf [[Zehntel]] 3,5 und auf [[Hundertstel]] 3,48.'
    - teil: so-stimmt-es
      de: 'Suche zuerst die [[Rundungsstelle]] und unterstreiche sie. Dann schau auf die [[Ziffer]] rechts daneben.'
gegenbeispiel:
  de: 'Wer auf ganze Euro rundet, schreibt keine Cent mehr. 4,63 € werden 5 €, nicht 4,60 €.'
rueckweg:
  vermittlung: M.ZO.NZ.RUNDEN#erklaeren-runden
kontrast: [M.ZO.BR.DEZ-ORDNEN.RUNDEN, M.ZO.NZ.RUNDEN.AUF-STELLE]
herkunft: ki-entwurf
version: 1
