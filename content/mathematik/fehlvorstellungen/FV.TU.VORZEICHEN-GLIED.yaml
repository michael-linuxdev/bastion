id: FV.TU.VORZEICHEN-GLIED
name:
  de: Trennt beim Zusammenfassen das Minus von seinem Glied
art: falsche-regel
beschreibung:
  de: >-
    Rechnet 5x − 2 + 3x − 4 = 8x − 2 + 4 oder vertauscht Glieder ohne ihr Vorzeichen. Das
    Rechenzeichen wird nicht als Vorzeichen des folgenden Glieds gesehen.
kompetenzen: [M.SF.TU.ZUSAMMENFASSEN]
erklaerung:
  kurz:
    de: 'Ein Minus gehört immer zu dem Glied, das danach kommt. Nimm es mit, wenn du Glieder umsortierst.'
  lang:
    - teil: so-denkst-du
      de: 'Du hast ein Glied ohne sein Minus verrechnet oder verschoben.'
    - teil: warum-nicht
      de: 'Beim Umsortieren schaut man auf die Zahlen und Buchstaben, das Zeichen bleibt leicht zurück. Aber − 4 heißt: 4 wird abgezogen. Ohne das Minus wird sie dazugezählt.'
    - teil: so-stimmt-es
      de: 'Kreise jedes Glied mit seinem [[Vorzeichen]] ein: (5x) (−2) (+3x) (−4). Dann sortiere: 5x + 3x − 2 − 4 = 8x − 6.'
gegenbeispiel:
  de: 'Mit x = 0: 0 − 2 + 0 − 4 = −6. Aber 8 · 0 − 2 + 4 = 2.'
rueckweg:
  vermittlung: M.SF.TU.ZUSAMMENFASSEN#erklaeren-gleichartig
  voraussetzung: M.ZO.RZ.ADD-SUB
kontrast: [M.SF.TU.ZUSAMMENFASSEN.AUSWAHL, M.SF.TU.ZUSAMMENFASSEN.LUECKE]
herkunft: ki-entwurf
version: 1
