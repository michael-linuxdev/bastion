id: FV.PW.ANZEIGE-ENDLICH
name:
  de: Hält eine Zahl für rational, weil der Taschenrechner endlich viele Stellen zeigt
art: falsche-grundvorstellung
beschreibung:
  de: >-
    Hält √7 oder π für rational, weil der Taschenrechner 2,6457513 bzw. 3,14 anzeigt. Dass die
    Anzeige gerundet ist und die Zahl unendlich viele Stellen ohne Periode hat, ist nicht verankert.
kompetenzen: [M.ZO.PW.REELL]
erklaerung:
  kurz:
    de: 'Der Taschenrechner rundet. √7 hat unendlich viele [[Nachkommastellen]] ohne [[Periode]], [[π]] auch. Beide sind irrational.'
  lang:
    - teil: so-denkst-du
      de: 'Du hast der Anzeige des Taschenrechners geglaubt: Sie endet, also ist die Zahl eine endliche [[Dezimalzahl]].'
    - teil: warum-nicht
      de: 'Probiere es: 2,6457513 · 2,6457513 ist nicht genau 7. Die Anzeige ist nur eine Näherung.'
    - teil: so-stimmt-es
      de: 'Die [[Wurzel]] aus einer natürlichen Zahl, die keine Quadratzahl ist, ist irrational. [[π]] ist irrational. Das sieht man nicht an der Anzeige, das weiß man.'
gegenbeispiel:
  de: '$\frac{1}{3}$ zeigt der Taschenrechner als 0,3333333 – trotzdem hat $\frac{1}{3}$ unendlich viele Stellen.'
rueckweg:
  vermittlung: M.ZO.PW.REELL#erklaeren-irrational
kontrast: [M.ZO.PW.REELL.ART]
herkunft: ki-entwurf
version: 1
