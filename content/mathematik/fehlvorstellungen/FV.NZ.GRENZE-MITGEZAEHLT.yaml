id: FV.NZ.GRENZE-MITGEZAEHLT
name:
  de: Zählt bei „kleiner als“ oder „größer als“ die Grenze selbst mit
art: falsche-grundvorstellung
beschreibung:
  de: >-
    Gibt bei y + 3 < 10 die Zahl 7 als größte Lösung an. Dass „<“ die Gleichheit ausschließt, ist
    noch nicht verankert; < und ≤ werden gleich behandelt. Ebenso bei „das kleinste Vielfache, das
    größer ist als 30“: Die 30 selbst wird genannt.
kompetenzen: [M.SF.NZ.GLEICHUNGEN, M.ZO.TB.TEILER]
erklaerung:
  kurz:
    de: '„Kleiner als“ und „größer als“ heißen: wirklich kleiner oder größer, nicht gleich. Die Grenze selbst gehört nicht dazu.'
  lang:
    - teil: so-denkst-du
      de: 'Du hast genau die Grenze genommen.'
    - teil: warum-nicht
      de: 'Die Grenze zu finden war der richtige erste Schritt. Aber 7 + 3 = 10, und 10 ist nicht kleiner als 10. Die Grenze selbst erfüllt die Bedingung nicht. Genauso ist 30 nicht größer als 30.'
    - teil: so-stimmt-es
      de: 'Finde die Grenze und gehe eins darunter: y + 3 < 10, die Grenze ist 7, die größte Lösung also 6. [[Probe]]: 6 + 3 = 9 < 10.'
gegenbeispiel:
  de: 'Wer jünger als 10 sein muss, darf nicht 10 Jahre alt sein.'
rueckweg:
  vermittlung: M.SF.NZ.GLEICHUNGEN#erklaeren-ungleichung
kontrast: [M.SF.NZ.GLEICHUNGEN.UNGLEICHUNG, M.ZO.TB.TEILER.VIELFACHES]
herkunft: ki-entwurf
version: 1
