id: FV.LG.BASIS-ARGUMENT
name:
  de: Basis und Zahl vertauscht
art: verwechslung
beschreibung:
  de: >-
    Rechnet $\log_5 25$ als $\log_{25} 5 = \frac{1}{2}$ oder liest $\ln x$ als $e^x$. Die Rollen von Basis, Zahl und Hochzahl werden vermischt.
kompetenzen: [M.ZO.LG.LOGARITHMUS, M.SF.LG.GLEICHUNGEN]
erklaerung:
  kurz:
    de: '$\log_b x$ ist die [[Hochzahl]], mit der b zu x wird. Die [[Basis]] steht unten, die Zahl daneben.'
  lang:
    - teil: so-denkst-du
      de: 'Du hast [[Basis]] und Zahl vertauscht.'
    - teil: warum-nicht
      de: 'Dann fragst du nach etwas anderem: Mit welcher [[Hochzahl]] wird die Zahl zur [[Basis]]?'
    - teil: so-stimmt-es
      de: 'Frage: b hoch wie viel ergibt x?'
gegenbeispiel:
  de: '$\log_2 8 = 3$, denn $2^3 = 8$. $\log_8 2 = \frac{1}{3}$ ist etwas anderes.'
rueckweg:
  vermittlung: M.ZO.LG.LOGARITHMUS#erklaeren-log
kontrast: [M.ZO.LG.LOGARITHMUS.WERT]
herkunft: ki-entwurf
version: 1
