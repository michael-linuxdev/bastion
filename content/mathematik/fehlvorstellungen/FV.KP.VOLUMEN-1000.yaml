id: FV.KP.VOLUMEN-1000
name:
  de: Rechnet bei Volumeneinheiten mit 10 oder 100 statt 1000
art: uebergeneralisiert
beschreibung:
  de: >-
    Rechnet 1 dm³ = 10 cm³ oder 100 cm³. Die Umrechnungszahl von Längen oder Flächen wird auf
    Volumen übertragen.
kompetenzen: [M.GM.KP.EINHEITEN]
erklaerung:
  kurz:
    de: 'Bei [[Volumeneinheiten]] ist die [[Umrechnungszahl]] 1000 je Schritt: 1 dm³ = 1000 cm³, 1 m³ = 1000 dm³.'
  lang:
    - teil: so-denkst-du
      de: 'Du hast mit 10 oder 100 gerechnet.'
    - teil: warum-nicht
      de: 'Bei Längen ist es 10, bei Flächen 100. Ein [[Würfel]] hat aber Länge, Breite und [[Höhe]]. Ein Würfel mit 1 dm [[Kante]] ist 10 cm lang, 10 cm breit und 10 cm hoch.'
    - teil: so-stimmt-es
      de: 'Stell dir den [[Würfel]] aus kleinen Würfeln vor: 10 · 10 = 100 in einer Schicht, 10 Schichten übereinander. Das sind 1000.'
gegenbeispiel:
  de: 'Ein Milchkarton mit 1 Liter fasst 1000 ml, nicht 10 ml.'
rueckweg:
  vermittlung: M.GM.KP.EINHEITEN#erklaeren-volumeneinheiten
  voraussetzung: M.GM.FL.EINHEITEN
kontrast: [M.GM.KP.EINHEITEN.IN-GROESSERE, M.GM.KP.EINHEITEN.IN-KLEINERE]
herkunft: ki-entwurf
version: 1
