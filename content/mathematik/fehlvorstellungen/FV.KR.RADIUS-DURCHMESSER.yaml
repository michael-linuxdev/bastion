id: FV.KR.RADIUS-DURCHMESSER
name:
  de: Verwechselt Radius und Durchmesser
art: verwechslung
beschreibung:
  de: >-
    Setzt den Durchmesser in A = π · r² ein oder rechnet den Umfang als 2 · π · d. Dass der Durchmesser
    doppelt so lang ist wie der Radius, wird beim Einsetzen nicht beachtet.
kompetenzen: [M.GM.KR.UMFANG-FLAECHE, M.GM.KR.KREISRING, M.GM.KP.ZYLINDER]
erklaerung:
  kurz:
    de: 'Der [[Radius]] r geht von der Mitte zum Rand, der [[Durchmesser]] d einmal ganz durch: d = 2 · r. Prüfe vor dem Einsetzen, welcher gegeben ist.'
  lang:
    - teil: so-denkst-du
      de: 'Du hast den [[Durchmesser]] eingesetzt, wo der [[Radius]] hingehört, oder umgekehrt.'
    - teil: warum-nicht
      de: 'Beide sind Strecken am Kreis und werden oft gleich gezeichnet. Aber in der [[Formel]] A = [[π]] · r² wird der [[Radius]] quadriert. Mit dem [[Durchmesser]] wird die Fläche viermal so groß.'
    - teil: so-stimmt-es
      de: 'Schreibe r = … und d = … auf, bevor du rechnest. [[Umfang]]: u = [[π]] · d oder u = 2 · π · r. Fläche: A = π · r².'
gegenbeispiel:
  de: 'Eine Pizza mit 30 cm [[Durchmesser]] hat etwa 700 cm² Fläche, nicht 2800 cm².'
rueckweg:
  vermittlung: M.GM.KR.UMFANG-FLAECHE#erklaeren-radius
kontrast:
  [
    M.GM.KR.UMFANG-FLAECHE.BERECHNEN,
    M.GM.KR.UMFANG-FLAECHE.RAD,
    M.GM.KR.KREISRING.RING,
    M.GM.KP.ZYLINDER.BERECHNEN,
  ]
herkunft: ki-entwurf
version: 1
