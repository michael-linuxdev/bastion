id: FV.NZ.KLAMMER
name:
  de: Übersieht, dass Klammern zuerst gerechnet werden
art: falsche-regel
beschreibung:
  de: >-
    Rechnet (2 + 3) · 4 wie 2 + 3 · 4 = 14 statt 20. Die Klammer wird übersehen oder durch
    „Punkt vor Strich“ überstimmt.
kompetenzen: [M.ZO.BR.RECHENGESETZE, M.SF.NZ.TERME, M.ZO.RZ.RECHENGESETZE, M.SF.GL.TERMWERT]
erklaerung:
  kurz:
    de: 'Was in der Klammer steht, wird immer zuerst gerechnet, noch vor [[Punkt vor Strich]].'
  lang:
    - teil: so-denkst-du
      de: 'Du hast [[Punkt vor Strich]] gerechnet und die Klammer dabei nicht beachtet.'
    - teil: warum-nicht
      de: '[[Punkt vor Strich]] ist richtig gelernt. Die Klammer sagt aber: Dieser Teil gehört zusammen und kommt zuerst. Sie ist stärker als jede andere Regel.'
    - teil: so-stimmt-es
      de: 'Rechne zuerst die Klammer aus, dann den Rest: (2 + 3) · 4 = 5 · 4 = 20.'
gegenbeispiel:
  de: '2 Äpfel und 3 Birnen, und das für 4 Kinder: (2 + 3) · 4 = 20 Stück Obst, nicht 14.'
rueckweg:
  vermittlung: M.SF.NZ.TERME#erklaeren-klammern
kontrast:
  [
    M.ZO.BR.RECHENGESETZE.BRUECHE-KLAMMER,
    M.ZO.BR.RECHENGESETZE.DEZIMAL,
    M.SF.NZ.TERME.KLAMMERN,
    M.ZO.RZ.RECHENGESETZE.TERM,
    M.SF.GL.TERMWERT.EINSETZEN,
  ]
herkunft: ki-entwurf
version: 1
