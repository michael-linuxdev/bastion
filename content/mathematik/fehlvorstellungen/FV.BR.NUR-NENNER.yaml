id: FV.BR.NUR-NENNER
name:
  de: Verändert nur den Nenner, nicht den Zähler
art: falsche-regel
beschreibung:
  de: >-
    Erweitert oder kürzt nur den Nenner, etwa 3/4 → 3/8 oder beim Addieren 1/2 + 1/4 → 1/4 + 1/4.
    Die neue Teilgröße wird richtig gefunden, die Zahl der Teile aber nicht angepasst.
kompetenzen: [M.ZO.BR.ERWEITERN, M.ZO.BR.ADD-SUB]
erklaerung:
  kurz:
    de: 'Wenn du den [[Nenner]] veränderst, musst du den [[Zähler]] mit derselben Zahl verändern.'
  lang:
    - teil: so-denkst-du
      de: 'Du hast die Größe der Teile verändert, aber nicht ihre Anzahl.'
    - teil: warum-nicht
      de: 'Neue Teilgrößen sind richtig gedacht. Doch wenn jedes Teil halb so groß ist, brauchst du doppelt so viele. Werden die Teile größer, brauchst du weniger. Sonst ändert sich der [[Anteil]].'
      bild: { werkzeug: bruchstreifen@1, parameter: { teile: 8, gefaerbt: 3 } }
    - teil: so-stimmt-es
      de: 'Verändere [[Zähler]] und [[Nenner]] mit derselben Zahl: beim [[Erweitern]] mal, $\frac{3}{4} = \frac{6}{8}$, beim [[Kürzen]] geteilt, $\frac{6}{8} = \frac{3}{4}$.'
gegenbeispiel:
  de: '$\frac{3}{4}$ einer Pizza sind fast alles. $\frac{3}{8}$ sind weniger als die Hälfte – das kann nicht dasselbe sein.'
rueckweg:
  vermittlung: M.ZO.BR.ERWEITERN#erklaeren-erweitern
kontrast: [M.ZO.BR.ERWEITERN.ZIELNENNER, M.ZO.BR.ERWEITERN.KUERZEN, M.ZO.BR.ADD-SUB.UNGLEICHNAMIG]
herkunft: ki-entwurf
version: 1
