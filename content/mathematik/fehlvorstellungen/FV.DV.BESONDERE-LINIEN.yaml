id: FV.DV.BESONDERE-LINIEN
name:
  de: Verwechselt Höhe, Seitenhalbierende und Mittelsenkrechte
art: verwechslung
beschreibung:
  de: >-
    Nennt eine Seitenhalbierende Höhe oder eine Mittelsenkrechte Höhe. Die beiden Merkmale „durch
    eine Ecke?“ und „senkrecht?“ werden nicht getrennt geprüft.
kompetenzen: [M.RF.DV.BESONDERE-LINIEN, M.RF.KR.LAGE]
erklaerung:
  kurz:
    de: '[[Höhe]]: durch eine Ecke und [[senkrecht]] zur Gegenseite. [[Seitenhalbierende]]: durch eine Ecke und die Mitte der Gegenseite. [[Mittelsenkrechte]]: durch die Mitte einer Seite und senkrecht, aber meist durch keine Ecke.'
  lang:
    - teil: so-denkst-du
      de: 'Du hast die Linie mit einer anderen besonderen Linie verwechselt.'
    - teil: warum-nicht
      de: 'Alle drei treffen eine Seite, darum sehen sie [[ähnlich]] aus. Sie unterscheiden sich aber in zwei Fragen: Geht sie durch eine Ecke? Steht sie [[senkrecht]]?'
    - teil: so-stimmt-es
      de: 'Prüfe beide Fragen mit dem [[Geodreieck]]: [[rechter Winkel]] an der Seite? Trifft sie die Mitte? Geht sie durch die gegenüberliegende Ecke?'
gegenbeispiel:
  de: 'In einem schiefen Dreieck trifft die [[Höhe]] die Seite meist nicht in der Mitte.'
rueckweg:
  vermittlung: M.RF.DV.BESONDERE-LINIEN#erklaeren-linien
kontrast: [M.RF.DV.BESONDERE-LINIEN.ERKENNEN, M.RF.KR.LAGE.IN-UMKREIS]
herkunft: ki-entwurf
version: 1
