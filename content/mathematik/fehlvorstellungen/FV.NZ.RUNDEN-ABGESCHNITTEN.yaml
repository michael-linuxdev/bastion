id: FV.NZ.RUNDEN-ABGESCHNITTEN
name:
  de: Lässt beim Runden die Stellen nur weg
art: falsche-regel
beschreibung:
  de: >-
    Rundet 3,47 auf Zehntel zu 3,4 statt 3,5. Runden wird als „hinten abschneiden“ verstanden.
    Die Regel mit der Ziffer rechts neben der Rundungsstelle wird nicht angewendet.
kompetenzen: [M.ZO.BR.DEZ-ORDNEN]
erklaerung:
  kurz:
    de: 'Schau auf die [[Ziffer]] rechts neben der [[Rundungsstelle]]: Ist sie 5 oder größer, wird aufgerundet. Sonst bleibt die Stelle.'
  lang:
    - teil: so-denkst-du
      de: 'Du hast die Stellen hinter der [[Rundungsstelle]] einfach weggelassen.'
    - teil: warum-nicht
      de: 'Manchmal stimmt das, nämlich wenn abgerundet wird. Runden heißt aber: die **nächste** Zahl finden. 3,47 liegt näher an 3,5 als an 3,4.'
      bild: { werkzeug: zahlenstrahl@1, parameter: { von: 3, bis: 4, einteilung: 10, markiert: 35 } }
    - teil: so-stimmt-es
      de: 'Schau auf die [[Ziffer]] rechts daneben. Bei 0 bis 4 rundest du ab, bei 5 bis 9 auf: 3,47 ≈ 3,5.'
gegenbeispiel:
  de: '1,99 € sind fast 2 €. Abgeschnitten wären es nur 1 €.'
rueckweg:
  vermittlung: M.ZO.NZ.RUNDEN#erklaeren-runden
kontrast: [M.ZO.BR.DEZ-ORDNEN.RUNDEN]
herkunft: ki-entwurf
version: 1
