id: FV.QF.DISKRIMINANTE
name:
  de: Berechnet oder deutet die Diskriminante falsch
art: rechenfehler
beschreibung:
  de: >-
    Rechnet D = (p/2)² + q, vergisst das Halbieren von p oder schließt aus einem positiven q auf „keine Lösung“. Wie D aus p und q entsteht und was ihr Vorzeichen bedeutet, ist nicht sicher.
kompetenzen: [M.SF.QF.FORMEL]
erklaerung:
  kurz:
    de: '$D = \left(\frac{p}{2}\right)^2 - q$. D negativ: keine Lösung, D gleich 0: eine, D positiv: zwei.'
  lang:
    - teil: so-denkst-du
      de: 'Du hast beim Berechnen von D ein [[Vorzeichen]] oder das Halbieren übersehen.'
    - teil: warum-nicht
      de: 'Bei $x^2 + 2x - 3 = 0$ ist $q = -3$, also $D = 1 - (-3) = 4$. Das Minus vor q macht hier ein Plus.'
    - teil: so-stimmt-es
      de: 'Schreibe p und q mit [[Vorzeichen]] auf, halbiere p, quadriere, ziehe q ab.'
gegenbeispiel:
  de: '$x^2 + 2x - 3 = (x + 3)(x - 1)$ hat zwei Lösungen. Mit $1 + (-3) = -2$ hättest du „keine“ gesagt.'
rueckweg:
  vermittlung: M.SF.QF.FORMEL#erklaeren-diskriminante
kontrast: [M.SF.QF.FORMEL.ANZAHL, M.SF.QF.FORMEL.LOESEN]
herkunft: ki-entwurf
version: 1
