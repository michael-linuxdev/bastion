id: FV.RZ.ABSCHNITT-ALS-EINS
name:
  de: Liest jeden Abschnitt der Zahlengerade als 1
art: lesefehler
beschreibung:
  de: >-
    Liest an einer Zahlengerade mit Halbschritten die dritte Markierung als 3 statt 1,5. Die
    Beschriftung wird nicht genutzt, um die Größe eines Abschnitts zu bestimmen.
kompetenzen: [M.ZO.RZ.BEGRIFF]
erklaerung:
  kurz:
    de: 'Prüfe zuerst, wie groß ein Abschnitt ist: Wie viele Abschnitte liegen zwischen 0 und 1? Bei zweien ist jeder 0,5 groß.'
  lang:
    - teil: so-denkst-du
      de: 'Du hast jeden Abschnitt als 1 gezählt.'
    - teil: warum-nicht
      de: 'Oft ist ein Abschnitt 1 groß, darum liegt das nahe. Hier sind die Abschnitte aber kleiner. Die Beschriftung an der [[Zahlengerade]] verrät, wie groß.'
      bild: { werkzeug: zahlenstrahl@1, parameter: { von: 0, bis: 2, einteilung: 2, markiert: 3 } }
    - teil: so-stimmt-es
      de: 'Zwischen 0 und 1 liegen 2 Abschnitte, also ist jeder 0,5. Drei Abschnitte sind 1,5.'
gegenbeispiel:
  de: 'Auf einem Lineal sind die kleinen Striche Millimeter. Wer sie als Zentimeter zählt, misst alles zehnmal zu lang.'
rueckweg:
  vermittlung: M.ZO.RZ.BEGRIFF#erklaeren-zahlengerade
kontrast: [M.ZO.RZ.BEGRIFF.ZAHLENGERADE]
herkunft: ki-entwurf
version: 1
