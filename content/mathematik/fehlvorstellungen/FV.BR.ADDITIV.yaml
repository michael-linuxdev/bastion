id: FV.BR.ADDITIV
name:
  de: Addiert oder subtrahiert beim Erweitern und Kürzen statt zu multiplizieren oder zu teilen
art: falsche-regel
beschreibung:
  de: >-
    Rechnet 2/3 → 3/4 (beide plus 1) oder 6/8 → 4/6 (beide minus 2). Die Regel „mit Zähler und
    Nenner das Gleiche tun“ wurde behalten, aber mit Plus und Minus statt Mal und Geteilt.
kompetenzen: [M.ZO.BR.ERWEITERN, M.ZO.BR.ADD-SUB]
erklaerung:
  kurz:
    de: 'Beim [[Erweitern]] wird **multipliziert**, beim [[Kürzen]] **geteilt** – nie addiert oder subtrahiert.'
  lang:
    - teil: so-denkst-du
      de: 'Du hast zu [[Zähler]] und [[Nenner]] dieselbe Zahl addiert oder davon abgezogen.'
    - teil: warum-nicht
      de: 'Die Idee „mit beiden dasselbe machen“ ist gut. Aber Plus verändert den [[Anteil]]: 1/2 ist die Hälfte, 2/3 ist mehr als die Hälfte.'
      bild: { werkzeug: bruchstreifen@1, parameter: { teile: 2, gefaerbt: 1 } }
    - teil: so-stimmt-es
      de: 'Teile jedes Stück in gleich viele kleinere: Das ist Malnehmen. Aus 1/2 wird 2/4 oder 3/6 – der [[Anteil]] bleibt gleich.'
gegenbeispiel:
  de: 'Plus 1 macht aus 1/2 den [[Bruch]] 2/3 und aus 2/3 den Bruch 3/4. Wären das gleiche Anteile, wäre die Hälfte gleich drei Viertel.'
rueckweg:
  vermittlung: M.ZO.BR.ERWEITERN#erklaeren-erweitern
kontrast: [M.ZO.BR.ERWEITERN.ZIELNENNER, M.ZO.BR.ERWEITERN.KUERZEN]
quelle:
  de: Fachdidaktik Bruchrechnung (Übertragung von Regeln der natürlichen Zahlen)
herkunft: ki-entwurf
version: 1
review:
