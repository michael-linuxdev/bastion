# „Die Periode ist b“ widerlegen – Niveau E. Entwurf: noch nicht geprüft.
id: M.SF.TF.PARAMETER.BEGRUENDEN
kompetenz: M.SF.TF.PARAMETER
niveaus: [E]
typ: auswahl
quelle: generator
generator: tf.periode-b-aussage@1
parameter:
  E: {}
text:
  aufgabe:
    de: '{situation} **Wähle** die Antwort mit der richtigen Begründung.'
hilfen:
