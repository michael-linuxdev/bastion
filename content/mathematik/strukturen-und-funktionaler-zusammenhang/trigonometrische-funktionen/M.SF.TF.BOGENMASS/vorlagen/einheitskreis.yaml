# Sinus und Kosinus über 90° am Einheitskreis – Niveau M. Entwurf: noch nicht geprüft.
id: M.SF.TF.BOGENMASS.EINHEITSKREIS
kompetenz: M.SF.TF.BOGENMASS
niveaus: [M]
typ: zahl-eingabe
quelle: generator
generator: tf.einheitskreis@1
parameter:
  M: {}
text:
  aufgabe:
    de: '{satz} **Lies** am [[Einheitskreis]] ab.'
hilfen:
  - de: 'Suche den [[Winkel]] im ersten [[Quadranten]], der gleich hoch oder gleich weit rechts liegt.'
  - de: 'Der Sinus ist die [[Höhe]] von P, der Kosinus die Lage rechts oder links. Unten und links ist der Wert negativ.'
fehlerbilder:
