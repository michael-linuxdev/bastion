    de: 'Der [[Betrag]] stimmt, das [[Vorzeichen]] nicht. Liegt P unter der x-Achse, ist der Sinus negativ. Liegt P links, ist der Kosinus negativ.'
    fv: FV.TF.VORZEICHEN-QUADRANT
  sin-cos:
    de: 'Das ist der andere Wert. Der Sinus ist die [[Höhe]] von P, der Kosinus die Lage nach rechts oder links.'
    fv: FV.TF.SIN-COS
herkunft: ki-entwurf
version: 1
