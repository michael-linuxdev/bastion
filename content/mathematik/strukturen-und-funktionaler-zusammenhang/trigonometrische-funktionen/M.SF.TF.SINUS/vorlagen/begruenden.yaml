  symmetrie:
    de: 'Der Sinus ist punktsymmetrisch zum [[Ursprung]]: $\sin(-x) = -\sin x$. Der Kosinus ist [[achsensymmetrisch]]: $\cos(-x) = \cos x$.'
    fv: FV.TF.SYMMETRIE
herkunft: ki-entwurf
version: 1
