# Graph einer Grundfunktion zuordnen – Niveau G. Entwurf: noch nicht geprüft.
id: M.SF.FS.SYSTEMATIK.GRAPH
kompetenz: M.SF.FS.SYSTEMATIK
niveaus: [G]
typ: auswahl
quelle: generator
generator: fs.zuordnen@1
parameter:
  G: {}
text:
  aufgabe:
    de: 'Zu welcher Grundfunktion gehört der [[Graph]]? **Wähle**.'
hilfen:
  - de: 'Prüfe den Punkt bei $x = 1$ und den Verlauf links von der y-Achse.'
  - de: 'Gibt es den [[Graphen]] auch für negative x? Hat er eine Lücke bei 0?'
fehlerbilder:
  aehnlich:
    de: 'Prüfe einen Punkt, etwa $x = 2$: Passt der Wert zum [[Graphen]]?'
    fv: FV.FS.GRUNDFUNKTION
  andere:
    de: 'Dieser [[Graph]] sieht anders aus. Vergleiche den Verlauf für negative x.'
    fv: FV.FS.GRUNDFUNKTION
herkunft: ki-entwurf
version: 1
