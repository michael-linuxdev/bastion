# Wert einer Verkettung – Niveau M. Entwurf: noch nicht geprüft.
id: M.SF.FS.VERKNUEPFEN.WERT
kompetenz: M.SF.FS.VERKNUEPFEN
niveaus: [M]
typ: zahl-eingabe
quelle: generator
generator: fs.verkettung-wert@1
parameter:
  M: {}
text:
  aufgabe:
    de: '{funktionen}. **Berechne** $f(g({a}))$.'
hilfen:
  - de: 'Zuerst $g({a})$ ausrechnen.'
  - de: 'Das Ergebnis in f einsetzen.'
fehlerbilder:
  innen-aussen:
    de: 'Das ist $g(f({a}))$. Bei $f(g(x))$ rechnet man zuerst g.'
    fv: FV.FS.INNEN-AUSSEN
  produkt:
    de: 'Das ist $f({a}) \cdot g({a})$. Verketten heißt einsetzen, nicht malnehmen.'
    fv: FV.FS.VERKETTUNG-PRODUKT
hilfsmittelfrei: true
herkunft: ki-entwurf
version: 1
