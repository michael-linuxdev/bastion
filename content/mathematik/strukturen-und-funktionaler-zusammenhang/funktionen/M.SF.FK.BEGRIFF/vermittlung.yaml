id: M.SF.FK.BEGRIFF
kompetenz: M.SF.FK.BEGRIFF
niveau: G
dauer_min: 12
schritte:
  - id: ziel
    typ: ziel
    text:
      de: 'Danach kannst du sagen, ob eine [[Zuordnung]] eine [[Funktion]] ist, und [[Funktionswerte]] ausrechnen.'
    weiter: vorwissen
  - id: vorwissen
    typ: anknuepfen
    text:
      de: 'Welchen Wert hat 3 · x + 1 für x = 4?'
    antwort:
      eingabe: { art: zahl, loesung: '13' }
    weiter: entdecken
    bei: { sonst: M.SF.GL.TERMWERT }
  - id: entdecken
    typ: entdecken
    text:
      de: 'Ein Automat rechnet: Zahl hinein, mal 2, plus 1, Zahl heraus. Du wirfst 5 hinein. Welche Zahl kommt heraus?'
    antwort:
      eingabe: { art: zahl, loesung: '11', fehler: [{ wert: '5', fv: FV.FK.X-ODER-Y }] }
    weiter: erklaeren-funktion
  - id: erklaeren-funktion
    typ: erklaeren
    text:
      de: 'Eine [[Funktion]] ist so ein Automat: Zu jedem x gehört genau ein y. Zwei x dürfen dasselbe y haben. Aber ein x mit zwei verschiedenen y ist keine Funktion.'
    weiter: erklaeren-stelle-wert
  - id: erklaeren-stelle-wert
    typ: erklaeren
    text:
      de: 'x heißt Stelle, das ist die Zahl, die hineingeht. y heißt [[Funktionswert]], das ist die Zahl, die herauskommt. Lies genau, wonach gefragt ist.'
    weiter: beispiel
  - id: beispiel
    typ: beispiel
    text:
      de: 'y = 2 · x + 1. An der Stelle x = 5 ist der [[Funktionswert]] y = 2 · 5 + 1 = 11. Bei x = −2 rechnest du mit Klammer: 2 · (−2) + 1 = −3.'
    weiter: ergaenzen
  - id: ergaenzen
    typ: ergaenzen
    text:
      de: 'y = x² + 1. Welcher [[Funktionswert]] gehört zur Stelle x = 3?'
    antwort:
      eingabe:
        {
          art: zahl,
          loesung: '10',
          fehler: [{ wert: '7', fv: FV.NZ.QUADRAT-MAL-ZWEI }, { wert: '3', fv: FV.FK.X-ODER-Y }],
        }
    weiter: gegenbeispiel
    bei: { FV.FK.X-ODER-Y: erklaeren-stelle-wert }
  - id: gegenbeispiel
    typ: gegenbeispiel
    text:
      de: 'Tabelle: x = 1 → y = 4, x = 2 → y = 4, x = 3 → y = 6. Ole sagt: Das ist keine [[Funktion]], weil die 4 zweimal vorkommt. Stimmt das?'
    antwort:
      optionen:
        - { wert: { de: 'Nein, jedes x hat genau ein y. Gleiche y sind erlaubt.' }, richtig: true }
        - { wert: { de: 'Ja.' }, fv: FV.ZU.EINDEUTIGKEIT }
    weiter: merksatz
    bei: { FV.ZU.EINDEUTIGKEIT: erklaeren-funktion }
  - id: merksatz
    typ: merksatz
    text:
      de: '[[Funktion]]: Jedes x hat genau ein y. x ist die Stelle, y der [[Funktionswert]]. Negative Zahlen setzt du mit Klammer ein.'
    weiter: pruefen
  - id: pruefen
    typ: pruefen
    text:
      de: 'y = x² − 1. Welcher [[Funktionswert]] gehört zur Stelle x = −2?'
    antwort:
      optionen:
        - { wert: { de: '3' }, richtig: true }
        - { wert: { de: '−5' }, fv: FV.RZ.POTENZ-KLAMMER }
        - { wert: { de: '−2' }, fv: FV.FK.X-ODER-Y }
    weiter: uebergang
    bei: { FV.RZ.POTENZ-KLAMMER: erklaeren-stelle-wert, FV.FK.X-ODER-Y: erklaeren-stelle-wert }
  - id: uebergang
    typ: uebergang
    text:
      de: 'Sehr gut. Jetzt übst du selbst.'
    vorlagen: [M.SF.FK.BEGRIFF.FUNKTION, M.SF.FK.BEGRIFF.WERT]
    anzahl: 3
herkunft: ki-entwurf
version: 1
