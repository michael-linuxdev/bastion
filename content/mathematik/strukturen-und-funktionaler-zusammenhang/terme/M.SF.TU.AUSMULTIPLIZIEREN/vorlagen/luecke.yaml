# „4·(x − 3) = 4·x − ☐“, „12·x − 18 = 6·(2·x + ☐)“. Entwurf: noch nicht geprüft.
id: M.SF.TU.AUSMULTIPLIZIEREN.LUECKE
kompetenz: M.SF.TU.AUSMULTIPLIZIEREN
niveaus: [G, M]
typ: zahl-eingabe
