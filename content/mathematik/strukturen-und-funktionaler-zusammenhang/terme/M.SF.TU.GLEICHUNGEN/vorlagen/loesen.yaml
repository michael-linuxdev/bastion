# „Löse: 3·(x + 2) = 2·x + 10“. Entwurf: noch nicht geprüft.
id: M.SF.TU.GLEICHUNGEN.LOESEN
kompetenz: M.SF.TU.GLEICHUNGEN
niveaus: [G, M]
typ: zahl-eingabe
quelle: generator
generator: tu.gleichung-klammer@1
parameter:
  G: { beidseitig: false }
  M: { beidseitig: true }
text:
  aufgabe:
    de: '**Löse** die [[Gleichung]] {gleichung}. **Gib** x **an**.'
hilfen:
  - de: 'Löse zuerst die Klammern auf ([[ausmultiplizieren]]) und fasse zusammen.'
