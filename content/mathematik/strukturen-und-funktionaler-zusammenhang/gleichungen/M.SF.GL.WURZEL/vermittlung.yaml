id: M.SF.GL.WURZEL
kompetenz: M.SF.GL.WURZEL
niveau: G
dauer_min: 12
schritte:
  - id: ziel
    typ: ziel
    text:
      de: 'Danach kannst du eine [[Gleichung]] wie $\sqrt{x + 5} = 4$ lösen und mit der [[Probe]] erkennen, wann es keine Lösung gibt.'
    weiter: vorwissen
  - id: vorwissen
    typ: anknuepfen
    text:
      de: 'Wie viel ist $\sqrt{49}$?'
    antwort:
      optionen:
        - { wert: { de: '7' }, richtig: true }
        - { wert: { de: '24,5' }, fv: FV.NZ.WURZEL-HALBIERT }
    weiter: entdecken
    bei: { FV.NZ.WURZEL-HALBIERT: M.ZO.PW.WURZEL, sonst: M.ZO.PW.WURZEL }
  - id: entdecken
    typ: entdecken
    text:
      de: 'Gesucht ist x mit $\sqrt{x} = 6$. Welche Zahl hat die [[Wurzel]] 6?'
    antwort:
      eingabe:
        { art: zahl, loesung: '36', fehler: [{ wert: '6', fv: FV.GL.WURZEL-NICHT-QUADRIERT }] }
    weiter: erklaeren-quadrieren
  - id: erklaeren-quadrieren
    typ: erklaeren
    text:
      de: 'Quadrieren hebt die [[Wurzel]] auf. Quadriere beide Seiten: Aus $\sqrt{x + 5} = 4$ wird $x + 5 = 16$, also $x = 11$.'
    weiter: erklaeren-allein
  - id: erklaeren-allein
    typ: erklaeren
    text:
      de: 'Steht neben der [[Wurzel]] noch eine Zahl, bringe sie zuerst weg: $\sqrt{x + 3} + 2 = 6$ wird $\sqrt{x + 3} = 4$. Erst dann quadrieren.'
    weiter: erklaeren-probe
  - id: erklaeren-probe
    typ: erklaeren
    text:
      de: 'Eine [[Wurzel]] ist nie negativ. $\sqrt{x} = -3$ hat keine Lösung. Quadrieren würde $x = 9$ geben, aber die [[Probe]] zeigt $\sqrt{9} = 3$. Mach deshalb immer die Probe.'
    weiter: beispiel
  - id: beispiel
    typ: beispiel
    text:
      de: '$\sqrt{2x - 1} = 3$. Quadrieren: $2x - 1 = 9$. Dann $2x = 10$ und $x = 5$. [[Probe]]: $\sqrt{2 \cdot 5 - 1} = \sqrt{9} = 3$. Stimmt.'
    weiter: ergaenzen
  - id: ergaenzen
    typ: ergaenzen
    text:
      de: 'Löse $\sqrt{x - 2} = 5$.'
    antwort:
      eingabe:
        { art: zahl, loesung: '27', fehler: [{ wert: '7', fv: FV.GL.WURZEL-NICHT-QUADRIERT }] }
    weiter: gegenbeispiel
    bei: { FV.GL.WURZEL-NICHT-QUADRIERT: erklaeren-quadrieren }
  - id: gegenbeispiel
    typ: gegenbeispiel
    text:
      de: 'Paul löst $\sqrt{x + 1} = -4$ und bekommt $x = 15$. Stimmt das?'
    antwort:
      optionen:
        - {
            wert: { de: 'Nein. Die Probe gibt $\sqrt{16} = 4$, nicht $-4$. Es gibt keine Lösung.' },
            richtig: true,
          }
        - { wert: { de: 'Ja, quadrieren gibt $x + 1 = 16$.' }, fv: FV.GL.WURZEL-PROBE }
    weiter: merksatz
    bei: { FV.GL.WURZEL-PROBE: erklaeren-probe }
  - id: merksatz
    typ: merksatz
    text:
      de: '[[Wurzel]] allein stellen, beide Seiten quadrieren, nach x auflösen. Zum Schluss die [[Probe]]: Ist die rechte Seite negativ, gibt es keine Lösung.'
    weiter: pruefen
  - id: pruefen
    typ: pruefen
    text:
      de: 'Welche Lösung hat $\sqrt{x} + 4 = 1$?'
    antwort:
      optionen:
        - { wert: { de: 'Keine Lösung' }, richtig: true }
        - { wert: { de: '$x = 9$' }, fv: FV.GL.WURZEL-PROBE }
        - { wert: { de: '$x = -3$' }, fv: FV.GL.WURZEL-NICHT-QUADRIERT }
    weiter: uebergang
    bei: { FV.GL.WURZEL-PROBE: erklaeren-probe, FV.GL.WURZEL-NICHT-QUADRIERT: erklaeren-quadrieren }
  - id: uebergang
    typ: uebergang
    text:
      de: 'Gut. Jetzt löst du selbst Wurzelgleichungen.'
    vorlagen: [M.SF.GL.WURZEL.LOESEN]
    anzahl: 3
herkunft: ki-entwurf
version: 1
