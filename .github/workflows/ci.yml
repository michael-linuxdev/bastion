# Prüft jeden Push und jeden Pull Request: Lint → Tests → Build → Größenbudget
# → Offline-Test. Auf dem Hauptzweig wird danach auf GitHub Pages veröffentlicht.
# Aktionen sind auf Commit-Hashes gepinnt (Version im Kommentar).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Die App liegt im Wurzelverzeichnis der eigenen Domain https://bastion.micana.de/
  BASE_PATH: /

jobs:
  pruefen:
    name: Prüfen und bauen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint inkl. Ordnergrenzen, Prettier, Typen)
        run: pnpm lint

      - name: Einheitentests
        run: pnpm test

      # Sperrklinke (B4): Die Zahl der Funde des Fehler-Schülers darf nicht steigen.
      - name: Fehler-Schüler (Grenze aus tools/inhalte/fehlerschueler-grenze.json)
        run: pnpm fehlerschueler --grenze

      - name: Build
        run: pnpm build

      - name: Größenbudget (ARCHITEKTUR §9)
        run: pnpm budget

      - name: Browser für Ende-zu-Ende-Tests installieren
        run: pnpm exec playwright install --with-deps chromium

      - name: Ende-zu-Ende-Tests (u. a. offline neu laden)
        run: pnpm test:e2e

      - name: Testbericht bei Fehlern sichern
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build für GitHub Pages bereitstellen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  veroeffentlichen:
    name: Auf GitHub Pages veröffentlichen
    needs: pruefen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
